<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office Listening Lab | Ron Taylor Executive Class</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#23272c; --navy-2:#2e333a; --navy-3:#3c424a; --chalk:#e8eaec; --dim:#a3aab2;
  --paper:#f5f5f3; --white:#fff; --ink:#1e2226; --muted:#5b6168; --rule:#dcdfe2;
  --gold:#4e9c93; --gold-soft:#e2f1ef;
  --missed:#f7dca4; --missed-ink:#6a4300; --extra:#b3261e;
  --p1:#2f6f69; --p2:#7a3b2e; --p3:#2f4f86; --p4:#3d6b3a; --p5:#9a5a12; --p6:#8a3b5a; --p7:#5f5a1c;
  --p8:#4b3f8f; --p9:#1f5e7a; --p10:#6b2d5c; --p11:#384a62; --p12:#8a4b12; --p13:#2d6a4f;
  --part:var(--p1);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-part="1"]{--part:var(--p1)} [data-part="2"]{--part:var(--p2)} [data-part="3"]{--part:var(--p3)}
[data-part="4"]{--part:var(--p4)} [data-part="5"]{--part:var(--p5)} [data-part="6"]{--part:var(--p6)}
[data-part="7"]{--part:var(--p7)} [data-part="8"]{--part:var(--p8)} [data-part="9"]{--part:var(--p9)}
[data-part="10"]{--part:var(--p10)} [data-part="11"]{--part:var(--p11)} [data-part="12"]{--part:var(--p12)} [data-part="13"]{--part:var(--p13)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.55;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--part)}

.shell{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
aside{background:var(--navy);color:var(--chalk);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.brand{padding:26px 24px 20px;border-bottom:1px solid var(--navy-3);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.crest{width:46px;height:46px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--gold);font-size:17px;letter-spacing:.02em}
.brand h1{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.1;color:var(--white)}
.brand p{font-size:13px;color:var(--dim);margin-top:3px}
.search{padding:14px 24px;border-bottom:1px solid var(--navy-3)}
.search input{width:100%;background:var(--navy-2);border:1px solid var(--navy-3);border-radius:8px;padding:9px 12px;color:var(--white)}
.search input::placeholder{color:#8794ad}
.progress-mini{padding:12px 24px;border-bottom:1px solid var(--navy-3);font-size:13px;color:var(--dim)}
.progress-mini .bar{height:5px;background:var(--navy-3);border-radius:3px;margin-top:6px;overflow:hidden}
.progress-mini .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
nav{overflow-y:auto;flex:1;padding:6px 0 24px}
.home-link{display:block;width:100%;text-align:left;background:none;border:0;color:var(--chalk);padding:12px 24px 8px;cursor:pointer;font-size:14.5px;font-weight:600}
.home-link:hover{color:var(--gold)}
details.part{margin-top:2px}
details.part summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;align-items:baseline;gap:8px;padding:9px 24px;font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--white)}
details.part summary::-webkit-details-marker{display:none}
details.part summary b{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--navy);background:var(--dim);border-radius:4px;text-align:center;padding:1px 0}
details.part[open] summary b{background:var(--gold)}
details.part summary small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--dim)}
details.part summary:hover{background:var(--navy-2)}
nav ol{list-style:none;padding:2px 0 8px}
nav li button{display:grid;grid-template-columns:30px 1fr 16px;gap:6px;width:100%;text-align:left;background:none;border:0;color:#c9d1df;padding:6px 20px 6px 40px;cursor:pointer;font-size:14px;line-height:1.35}
nav li button span:first-child{color:var(--dim);font-variant-numeric:tabular-nums}
nav li button:hover{background:var(--navy-2);color:var(--white)}
nav li button[aria-current="true"]{background:var(--navy-3);color:var(--white);box-shadow:inset 3px 0 0 var(--gold)}
nav li button .ck{color:var(--gold);font-size:12px}
.empty{padding:16px 24px;color:var(--dim);font-size:14px}

.scrim{display:none}
main{min-width:0;grid-column:2}
.topbar{display:none}
.wrap{max-width:800px;margin:0 auto;padding:48px 32px 90px}

/* home */
.hero{border-bottom:1px solid var(--rule);padding-bottom:30px;margin-bottom:10px}
.hero h2{font-family:var(--serif);font-size:48px;font-weight:600;line-height:1.05;letter-spacing:-.01em;color:var(--navy);margin-bottom:18px;max-width:17ch}
.hero p{font-size:17.5px;max-width:62ch;margin-bottom:12px;color:#2b3446}
.hero .exchange{margin:26px 0 6px;max-width:560px}
.sec{font-family:var(--serif);font-size:30px;font-weight:600;margin:40px 0 6px;color:var(--navy)}
.sub{color:var(--muted);max-width:62ch;margin-bottom:14px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:18px 0 8px;border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden}
.steps li{padding:16px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.steps li:nth-child(3n){border-right:0}
.steps li:nth-last-child(-n+3){border-bottom:0}
.steps b{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy)}
.steps b i{font-style:normal;font-family:var(--sans);font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center}
.steps span{display:block;font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4}
.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.parts-grid button{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 14px;cursor:pointer;position:relative;overflow:hidden}
.parts-grid button::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--part)}
.parts-grid button:hover{border-color:var(--part)}
.parts-grid .pn{font-size:13px;font-weight:700;color:var(--part)}
.parts-grid strong{font-family:var(--serif);font-size:20px;line-height:1.15;color:var(--ink)}
.parts-grid .pd{font-size:14px;color:var(--muted);line-height:1.4}
.parts-grid .pc{font-size:13px;color:var(--part);font-weight:600;margin-top:auto;padding-top:6px}
.toc{columns:2 300px;column-gap:30px;margin:14px 0 30px}
.toc section{break-inside:avoid;margin-bottom:22px}
.toc h4{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:4px;color:var(--part);padding-bottom:5px;border-bottom:2px solid var(--part)}
.toc ol{list-style:none}
.toc button{display:grid;grid-template-columns:32px 1fr auto;width:100%;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;font-size:15px;color:var(--ink);gap:4px}
.toc button span:first-child{color:var(--part);font-variant-numeric:tabular-nums;font-weight:600}
.toc button:hover{color:var(--part)}
.toc .ck{color:var(--gold);font-size:13px}
.notice{background:var(--white);border:1px solid var(--rule);border-left:4px solid var(--gold);padding:18px 20px;margin:22px 0;border-radius:0 8px 8px 0}
.notice h3{font-size:16px;margin-bottom:6px}
.notice p{font-size:15px;color:var(--muted)}
.resetrow{font-size:14px;color:var(--muted);margin-top:8px}
.linkbtn{background:none;border:0;color:var(--part);text-decoration:underline;cursor:pointer;padding:0}

/* script page */
.plate{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;margin-bottom:24px}
.num{width:92px;height:92px;border-radius:12px;background:var(--part);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.num small{font-size:11.5px;font-weight:600;opacity:.8}
.num b{font-family:var(--serif);font-size:40px;line-height:1;font-weight:600}
.partname{font-size:14px;font-weight:600;color:var(--part)}
.script h2{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.1;margin:4px 0 10px;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:13px;border:1px solid var(--rule);background:var(--white);border-radius:999px;padding:3px 10px;color:var(--muted)}
.facts span.kind{border-color:color-mix(in srgb,var(--part) 35%,#fff);color:var(--part);background:color-mix(in srgb,var(--part) 7%,#fff);font-weight:600}

.rounds{display:grid;grid-template-columns:repeat(6,1fr);list-style:none;margin:0 0 -1px;position:relative;z-index:1}
.rounds button{width:100%;background:transparent;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;padding:10px 6px 11px;cursor:pointer;font-size:13px;line-height:1.25;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.rounds button i{font-style:normal;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--white)}
.rounds button:hover{color:var(--part)}
.rounds button.done i{background:var(--part);border-color:var(--part);color:var(--white)}
.rounds button[aria-current="step"]{background:var(--white);border-color:var(--rule);color:var(--ink);font-weight:600}
.rounds button[aria-current="step"] i{border-color:var(--part);color:var(--part);background:var(--white);box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 18%,#fff)}
.panel{background:var(--white);border:1px solid var(--rule);border-radius:0 0 12px 12px;padding:24px 26px 22px}
.panel h3{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1;margin-bottom:6px;color:var(--part)}
.panel .hint{font-size:15.5px;color:var(--muted);margin-bottom:16px;max-width:64ch}

/* player */
.deck{border:1px solid var(--rule);border-radius:10px;background:#f8f9fb;padding:14px 16px;margin-bottom:14px}
.deck-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.deck-row+.deck-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.btn{background:var(--part);color:var(--white);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{filter:brightness(.9)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:var(--white);color:var(--part);border:1px solid var(--rule)}
.btn.secondary:hover{border-color:var(--part);background:color-mix(in srgb,var(--part) 6%,#fff)}
.btn.big{padding:11px 20px;min-width:128px}
.btn.gold{background:var(--navy);color:var(--gold)}
.deck label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.deck select{border:1px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--white);max-width:210px;font-size:14px}
.deck .sp{margin-left:auto}
.nowline{font-size:14px;color:var(--muted);flex:1;min-width:180px}
.nowline b{color:var(--ink)}
.track{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:10px}
.track i{display:block;height:100%;width:0;background:var(--part);transition:width .2s}
.voice-note{font-size:13px;color:var(--muted);margin:2px 0 16px}
.recording audio{width:100%;margin-bottom:6px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);cursor:pointer}
.check input{accent-color:var(--part);width:17px;height:17px}

/* transcript as a dialogue script */
.dlg{margin-top:6px;border-top:1px solid var(--rule)}
.turn{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid #eceef2}
.who{font-size:13px;font-weight:700;padding-top:4px}
.turn.P .who{color:var(--part)}
.turn.S .who{color:#4d5a70}
.turn.S .say{background:#f3f5f8;border-radius:10px;padding:8px 12px;margin-left:-12px}
.say{font-family:var(--serif);font-size:18.5px;line-height:1.7}
.seg{border-radius:4px;transition:background .15s;cursor:pointer}
.seg:hover{background:color-mix(in srgb,var(--part) 8%,transparent)}
.seg.on{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold-soft)}
.masked{border:1px dashed #b9c1ce;border-radius:10px;padding:22px 24px;color:var(--muted);font-size:15px;background:#fafbfc}
.masked .turns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.masked .turns span{font-size:12.5px;font-weight:700;border-radius:4px;padding:3px 8px;background:var(--white);border:1px solid var(--rule)}
.masked .turns span.P{color:var(--part)}
.masked .turns span.on{background:var(--gold-soft);border-color:var(--gold)}

.field{margin-top:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field input{width:100%;max-width:360px;border:1px solid var(--rule);border-radius:8px;padding:9px 12px;background:var(--white)}
textarea{width:100%;min-height:210px;border:1px solid var(--rule);border-radius:10px;padding:14px 16px;background:var(--white);font-size:17px;line-height:1.6;resize:vertical}
textarea.short{min-height:100px}
textarea:focus,.field input:focus{border-color:var(--part);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 15%,#fff)}
.prompts{list-style:none;margin:6px 0 4px;display:grid;gap:6px}
.prompts li{font-size:15px;padding-left:18px;position:relative}
.prompts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.nextrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}

.result{margin-top:22px;border:1px solid var(--rule);border-radius:10px;padding:20px 22px;background:#fbfbfc}
.score{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;color:var(--part)}
.score small{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--muted);margin-left:8px}
.legend{font-size:14px;color:var(--muted);margin:12px 0}
.legend mark,.legend del{padding:0 4px}
.diff{font-size:17px;line-height:1.9;font-family:var(--serif)}
mark{background:var(--missed);color:var(--missed-ink);border-radius:3px;padding:0 2px}
mark.small{outline:2px solid #c98a1a;outline-offset:-1px}
del{color:var(--extra);text-decoration:line-through}
.smalls{margin-top:14px;font-size:15px}
.rest{color:#9aa1a8}
.sendbox{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.sendbox p{font-size:14px;color:var(--muted);margin-top:8px}
.status{font-size:14px;color:var(--part);margin-top:8px;min-height:1.2em}
.done-banner{margin-top:16px;display:flex;gap:12px;align-items:center;background:var(--gold-soft);border:1px solid #e8d49f;border-radius:10px;padding:12px 16px;font-size:15px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--rule)}
.pager button{background:none;border:0;cursor:pointer;text-align:left;max-width:48%;padding:4px 0}
.pager button:last-child{text-align:right;margin-left:auto}
.pager small{display:block;font-size:13px;color:var(--muted)}
.pager span{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink)}
.pager button:hover span{color:var(--part)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  main{grid-column:1}
  aside{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:30;transform:translateX(-100%);transition:transform .2s ease}
  aside.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,18,32,.45);z-index:20;display:none}
  .scrim.open{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:var(--navy);color:var(--white);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar button{background:var(--navy-3);color:var(--white);border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
  .topbar strong{font-family:var(--serif);font-size:19px;font-weight:600}
  .wrap{padding:26px 16px 70px}
  .hero h2{font-size:36px}
  .script h2{font-size:29px}
  .plate{grid-template-columns:1fr;gap:12px}
  .num{width:70px;height:70px}.num b{font-size:30px}
  .rounds{grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
  .rounds button{border:1px solid var(--rule);border-radius:8px;background:var(--white)}
  .panel{border-radius:12px;padding:18px 16px}
  .steps{grid-template-columns:1fr}
  .steps li{border-right:0!important;border-bottom:1px solid var(--rule)!important}
  .steps li:last-child{border-bottom:0!important}
  .turn{grid-template-columns:1fr;gap:2px}
  .turn.S .say{margin-left:0}
  .say{font-size:17.5px}
  .deck .sp{margin-left:0}
}
@media (prefers-reduced-motion: reduce){aside,.track i,.seg{transition:none}}
@media print{
  aside,.topbar,.deck,.voice-note,.rounds,.pager,.nextrow,.actions,textarea,.field{display:none!important}
  .shell{display:block}.panel{border:0;padding:0}
}

.setting{font-size:15px;color:var(--muted);margin:-4px 0 10px}
.setting b{color:var(--ink);font-weight:600}
.star{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden;margin:16px 0 10px}
.star li{padding:16px 16px 14px;border-right:1px solid var(--rule)}
.star li:last-child{border-right:0}
.star b{display:block;font-family:var(--serif);font-size:30px;line-height:1;color:var(--gold)}
.star strong{display:block;font-family:var(--serif);font-size:19px;color:var(--navy);margin-top:6px}
.star em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.star span{display:block;font-size:14px;color:var(--muted);margin-top:6px;line-height:1.4}
.star li.act{background:var(--gold-soft)}
.pitfalls{list-style:none;display:grid;gap:10px;margin:14px 0 6px}
.pitfalls li{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;font-size:15px}
.pitfalls li b{color:var(--navy)}
.formula{counter-reset:f;list-style:none;display:grid;gap:10px;margin:14px 0}
.formula li{counter-increment:f;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:15.5px}
.formula li::before{content:counter(f);width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:14px}
.coach{margin-top:18px;background:var(--gold-soft);border:1px solid #edcfb2;border-radius:10px;padding:16px 18px}
.coach h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.coach p{font-size:15.5px;color:#3a3a33}
.mine{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
.mine h4{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--part);margin-bottom:4px}
@media (max-width:900px){.star{grid-template-columns:1fr 1fr}.star li:nth-child(2){border-right:0}.star li:nth-child(-n+2){border-bottom:1px solid var(--rule)}}
.scene{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);margin:-2px 0 10px;max-width:62ch}
.listenfor{margin-top:18px;background:var(--gold-soft);border:1px solid #bfe0dc;border-radius:10px;padding:16px 18px}
.listenfor h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.listenfor p{font-size:15.5px;color:#2d3a38}
.listenfor p+p{margin-top:6px}
.respond{margin-top:22px}
.respond h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.rsp{border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:12px;background:var(--white)}
.rsit{font-size:14.5px;color:#55615f}
.rq{font-size:17px;margin:6px 0 10px}
.rsp .field{margin-bottom:10px}
.model{margin-top:10px;background:var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:16px}
.model span{display:block;font-size:13.5px;color:#55615f;margin-top:4px}
.startlist{list-style:none;display:grid;gap:8px;margin:14px 0 8px}
.startlist button{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;cursor:pointer;font:inherit;color:var(--ink)}
.startlist button:hover{border-color:var(--gold)}
.startlist .n{width:32px;height:32px;border-radius:8px;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:700;font-variant-numeric:lining-nums}
.startlist b{display:block;font-family:var(--serif);font-size:18px}
.startlist small{color:var(--muted);font-size:13.5px}
.startlist .lv{font-size:12.5px;font-weight:700;color:var(--gold);text-align:right}
.startlist .ck{color:var(--gold);font-weight:700}

<script>
const BOOK = [{"part": 1, "title": "First Weeks", "desc": "Onboarding, introductions, the kitchen rules, and a first project.", "scripts": [{"num": 1, "title": "First Morning", "lines": [["P", "Larissa? Hi, I'm Karen Mitchell. Welcome to Cedarpoint! Did you find us okay?", "Karen"], ["S", "Hi, Karen. Yes, thanks. I took the SkyTrain to Waterfront and walked from there. It only took about ten minutes.", "Larissa"], ["P", "Perfect. Most of us come in that way. Let me take your coat. Did you want a coffee before we get started?", "Karen"], ["S", "That would be great, thank you. I didn't have time for one this morning. I was too nervous.", "Larissa"], ["P", "Totally normal. Everyone's nervous on their first day. Okay, so here's the plan for today. Nothing too heavy. This morning, Kevin from IT is going to set up your laptop and your accounts. That usually takes about an hour. Then at eleven, you'll meet the rest of the team.", "Karen"], ["S", "Sounds good. Should I bring anything to the meeting?", "Larissa"], ["P", "Just yourself. It's very casual. Then we'll all go out for lunch, on the company, of course. And this afternoon, you'll spend some time with Priya from HR. She'll go through your benefits and the paperwork.", "Karen"], ["S", "Okay. And when do I start working on a real project?", "Larissa"], ["P", "I love the enthusiasm! Not this week. This week is really about getting to know people and how we do things here. Next Monday, we'll sit down and talk about your first project.", "Karen"], ["S", "That makes sense. Is there anything I should read before then?", "Larissa"], ["P", "I'll send you a couple of documents, but honestly, don't stress about them. If you have any questions, just ask me or anyone on the team. Nobody here expects you to know everything in week one.", "Karen"], ["S", "Thank you. That really helps.", "Larissa"]], "words": 263, "kind": "story", "scene": "Monday, 8:45 a.m., the front desk.", "F": "\"Did you want a coffee?\" uses the past tense to sound polite, not to talk about the past. \"On the company\" means the company pays. \"Don't stress\" means \"don't worry.\"", "V": "", "t": [[0.3, 0.98], [1.33, 2.78], [3.13, 4.56], [4.91, 6.22], [6.82, 7.62], [7.97, 8.87], [9.22, 12.26], [12.61, 14.18], [14.78, 15.48], [15.83, 17.32], [17.67, 18.89], [19.24, 21.62], [22.22, 23.78], [24.13, 26.05], [26.4, 27.4], [28.0, 28.92], [29.27, 31.26], [31.61, 33.66], [34.01, 35.11], [35.46, 40.09], [40.44, 42.16], [42.51, 44.96], [45.56, 46.35], [46.7, 48.57], [49.17, 50.15], [50.5, 51.65], [52.0, 55.13], [55.48, 59.01], [59.36, 61.77], [62.37, 62.94], [63.29, 65.8], [66.4, 67.89], [68.24, 69.14], [69.49, 73.58], [73.93, 77.39], [77.99, 78.89], [79.24, 81.66], [82.26, 86.16], [86.51, 90.15], [90.5, 93.72], [94.32, 94.97], [95.32, 96.26]], "R": [["It's your first morning. Your new manager meets you at reception.", "Karen", "Did you find us okay? Did you want a coffee before we get started?", "Yes, thanks, it was easy. I took the SkyTrain. A coffee would be great, thank you."], ["Your manager explains that this week is only for getting to know people.", "Karen", "Honestly, don't stress about the documents. Nobody expects you to know everything in week one.", "Thank you, that really helps. I'll read them, and I'll ask if I have any questions."]]}, {"num": 2, "title": "Meet the Team", "lines": [["P", "Okay, everyone, can I grab you for a second? This is Larissa. She's joining us as our new project coordinator. Today's her first day.", "Karen"], ["P", "Welcome aboard, Larissa! I'm Greg. I'm on the accounts side, so I deal with the clients. Basically, I promise them things, and your team figures out how to deliver them.", "Greg"], ["P", "Unfortunately, that's not far from the truth.", "Karen"], ["P", "Hey, at least I'm honest! So, where are you from originally, Larissa?", "Greg"], ["S", "I'm from Belo Horizonte, in Brazil. I moved here about a year ago.", "Larissa"], ["P", "Oh, nice! Mineira! I'm Rodrigo. I'm from Curitiba. I'm a data analyst, so I'm the person who makes all the reports that nobody reads.", "Rodrigo"], ["S", "I'll read them, I promise.", "Larissa"], ["P", "Great, you'll be the first. It's really good to have another Brazilian on the team.", "Rodrigo"], ["P", "Rodrigo's been here for three years, so he knows where everything is. If you can't find something, he's your guy.", "Karen"], ["S", "Good to know. So, what's the best way to contact people here? Email?", "Larissa"], ["P", "For anything quick, use Slack. Email is more for clients, or for things that need a paper trail.", "Greg"], ["P", "And don't worry if people don't answer right away. It doesn't mean they're ignoring you. Everyone's just in meetings all day.", "Rodrigo"], ["P", "That's true. Okay, I'll let you all get back to work. Larissa, Kevin's waiting for you in the IT room. It's just down the hall on the left.", "Karen"], ["S", "Thanks. Nice to meet you, everyone.", "Larissa"], ["P", "You too. See you at lunch!", "Greg"]], "words": 242, "kind": "story", "scene": "11 a.m., the team area.", "F": "\"Can I grab you for a second?\" means \"can I have your attention briefly?\" A \"paper trail\" is a written record. \"He's your guy\" means he's the person to ask.", "V": "", "t": [[0.3, 3.11], [3.46, 4.52], [4.87, 7.76], [8.11, 9.33], [9.93, 11.6], [11.95, 12.86], [13.21, 16.5], [16.85, 21.83], [22.43, 25.01], [25.61, 27.2], [27.55, 30.19], [30.79, 33.01], [33.36, 35.11], [35.71, 36.43], [36.78, 37.47], [37.82, 38.76], [39.11, 40.31], [40.66, 45.69], [46.29, 47.57], [48.17, 49.43], [49.78, 52.47], [53.07, 56.88], [57.23, 59.34], [59.94, 60.66], [61.01, 63.7], [64.05, 64.59], [65.19, 66.98], [67.33, 71.7], [72.3, 74.85], [75.2, 76.82], [77.17, 79.17], [79.77, 80.51], [80.86, 83.15], [83.5, 86.44], [86.79, 88.54], [89.14, 89.72], [90.07, 91.65], [92.25, 93.05], [93.4, 94.5]], "R": [["A new colleague introduces himself at your desk.", "Greg", "Welcome aboard! So, where are you from originally?", "Thanks! I'm from Brazil, from Belo Horizonte. I moved here about a year ago. What about you?"], ["You want to know how people usually contact each other at work.", "Rodrigo", "If you have a question, just ask me. I've been here three years.", "Thanks, that's great. What's the best way to reach you? Slack or email?"]]}, {"num": 3, "title": "Laptop and Passwords", "lines": [["P", "Hi, you must be Larissa. I'm Kevin. Come on in and grab a seat. So, this is your new laptop. It's all charged up and ready to go.", "Kevin"], ["S", "Great, thanks. Do I need to install anything?", "Larissa"], ["P", "Nope, it's all done. You've got Outlook for email, Slack, Teams for video calls, and the shared drive. First thing, though, you need to set a new password. The temporary one expires in twenty-four hours.", "Kevin"], ["S", "Okay. Are there any rules for the password?", "Larissa"], ["P", "Yeah, at least twelve characters, with a number and a symbol. And please don't write it on a sticky note and put it on your screen. You wouldn't believe how often I see that.", "Kevin"], ["S", "I promise I won't. What happens if I forget it?", "Larissa"], ["P", "Then you just send a ticket to the help desk, or come and find me. But it's easier if you set up the reset questions now. Let's do that together.", "Kevin"], ["S", "Sure. And what about working from home? Can I use this laptop at home?", "Larissa"], ["P", "Absolutely. You'll just need to connect to the VPN first. There's an icon at the bottom of the screen. It's the little blue shield. Click that before you open any company files.", "Kevin"], ["S", "The blue shield. Got it.", "Larissa"], ["P", "Also, you're going to get a text message with a code every time you log in from a new place. That's the two-step verification. It's a bit annoying, but it keeps everyone safe.", "Kevin"], ["S", "That's fine. My bank does the same thing.", "Larissa"], ["P", "Exactly. Okay, go ahead and type your new password. I'll look away.", "Kevin"], ["S", "Thanks. Done.", "Larissa"], ["P", "Perfect. You're all set.", "Kevin"]], "words": 263, "kind": "story", "scene": "The IT room.", "F": "\"Nope\" is a casual \"no.\" \"You've got\" means \"you have,\" and the \"'ve\" is easy to miss. \"You're all set\" means everything is ready.", "V": "", "t": [[0.3, 1.67], [2.02, 2.76], [3.11, 4.56], [4.91, 6.39], [6.74, 8.66], [9.26, 10.21], [10.56, 12.11], [12.71, 13.74], [14.09, 18.6], [18.95, 21.32], [21.67, 24.43], [25.03, 25.6], [25.95, 27.6], [28.2, 31.22], [31.57, 35.11], [35.46, 37.54], [38.14, 39.28], [39.63, 41.07], [41.67, 45.17], [45.52, 48.39], [48.74, 49.88], [50.48, 50.96], [51.31, 52.82], [53.17, 54.85], [55.45, 56.32], [56.67, 59.17], [59.52, 61.65], [62.0, 63.29], [63.64, 66.3], [66.9, 67.77], [68.12, 68.7], [69.3, 74.8], [75.15, 76.79], [77.14, 79.58], [80.18, 80.91], [81.26, 82.83], [83.43, 84.21], [84.56, 86.78], [87.13, 87.97], [88.57, 89.15], [89.5, 89.96], [90.56, 91.24], [91.59, 92.41]], "R": [["IT is setting up your laptop.", "Kevin", "Okay, you're all set. Any questions before you go?", "Just one. If I forget my password, should I send a ticket to the help desk or come and find you?"], ["You want to work from home on Friday.", "Kevin", "You'll need to connect to the VPN before you open any company files.", "Got it. Where do I find the VPN? Is it the icon at the bottom of the screen?"]]}, {"num": 4, "title": "The Kitchen Rules", "lines": [["P", "So, this is the kitchen. It's the most important room in the office.", "Rodrigo"], ["S", "More important than the meeting rooms?", "Larissa"], ["P", "Definitely. This is where people actually talk. Okay, a few unwritten rules. First, the coffee machine. If you take the last cup, you make a new pot. People get really upset about that.", "Rodrigo"], ["S", "That's fair. What else?", "Larissa"], ["P", "The fridge. Always put your name on your food. There are markers and labels in that drawer. And every Friday afternoon, anything left in the fridge goes in the garbage. No exceptions.", "Rodrigo"], ["S", "Every Friday? Even if it's still good?", "Larissa"], ["P", "Even if it's still good. Someone sends a Slack message around two o'clock, as a warning. After that, it's gone.", "Rodrigo"], ["S", "Okay. I'll remember that. What about the dishes?", "Larissa"], ["P", "Right, this is a big one. There's a dishwasher, but you can't just leave your cup in the sink. Put it in the dishwasher yourself. And if the dishwasher is clean, empty it. There's actually a sign about it.", "Rodrigo"], ["S", "Oh, yeah, I see it. \"Your mother doesn't work here.\"", "Larissa"], ["P", "Exactly. Someone put that up years ago, and nobody's taken it down.", "Rodrigo"], ["S", "It's funny, but it's a little passive-aggressive, isn't it?", "Larissa"], ["P", "Yeah, that's kind of the office style here. People don't usually complain to your face. They put up a sign, or they send a message to the whole team.", "Rodrigo"], ["S", "So if there's a problem, nobody tells you directly?", "Larissa"], ["P", "Not always. You learn to read between the lines. Don't worry, I'll teach you.", "Rodrigo"]], "words": 245, "kind": "story", "scene": "The office kitchen.", "F": "\"Unwritten rules\" are rules everyone follows but nobody writes down. \"Passive-aggressive\" means showing you're annoyed in an indirect way. \"Read between the lines\" means understanding what people mean but don't say.", "V": "", "t": [[0.3, 1.59], [1.94, 4.06], [4.66, 6.52], [7.12, 7.9], [8.25, 10.04], [10.39, 11.97], [12.32, 13.63], [13.98, 16.33], [16.68, 18.46], [19.06, 19.76], [20.11, 20.77], [21.37, 22.08], [22.43, 24.09], [24.44, 26.58], [26.93, 31.39], [31.74, 32.74], [33.34, 34.21], [34.56, 35.65], [36.25, 37.44], [37.79, 41.51], [41.86, 43.0], [43.6, 44.17], [44.52, 45.47], [45.82, 46.84], [47.44, 48.65], [49.0, 52.29], [52.64, 54.17], [54.52, 56.55], [56.9, 58.41], [59.01, 60.32], [60.67, 61.99], [62.59, 63.36], [63.71, 67.1], [67.7, 70.73], [71.33, 73.3], [73.65, 75.91], [76.26, 79.57], [80.17, 83.14], [83.74, 84.6], [84.95, 86.57], [86.92, 88.32]], "R": [["A colleague shows you the office kitchen.", "Rodrigo", "If you take the last cup of coffee, you make a new pot. People get really upset about that.", "That's fair. I'll remember that. Is there anything else I should know about the kitchen?"], ["You see a sign in the kitchen that says, \"Please clean up after yourself.\"", "Rodrigo", "That sign is a bit passive-aggressive, isn't it?", "A little! But I get the message. Where should I put my cup, in the dishwasher?"]]}, {"num": 5, "title": "Monday Small Talk", "lines": [["P", "Morning, Larissa! How was your weekend?", "Greg"], ["S", "Good morning! It was nice, thanks. How was yours?", "Larissa"], ["P", "Not bad, not bad. We took the kids up to Whistler on Saturday. It was packed, though. It seemed like half of Vancouver had the same idea.", "Greg"], ["S", "Oh, I've never been to Whistler. Is it worth it?", "Larissa"], ["P", "Oh, for sure. You have to go in the winter, though. Do you ski?", "Greg"], ["S", "No, I've never tried. We don't get much snow in Belo Horizonte.", "Larissa"], ["P", "I bet! Well, you should try it this year. There are lots of lessons for beginners.", "Greg"], ["S", "Maybe. To be honest, I'm a little scared of falling.", "Larissa"], ["P", "Everyone falls. That's half the fun. My daughter learned last year, and now she's faster than me. So, what did you get up to?", "Greg"], ["S", "Nothing special. I went to Granville Island on Saturday with my husband. We walked around the market and had lunch there. And on Sunday, I just relaxed and got ready for the week.", "Larissa"], ["P", "Honestly, that sounds perfect. Granville Island's great. Did you try the doughnuts?", "Greg"], ["S", "We did! They were amazing. But I think I ate too many.", "Larissa"], ["P", "There's no such thing. Hey, did you watch the Canucks game last night?", "Greg"], ["S", "No, I didn't. I don't really follow hockey yet. I'm more of a soccer person.", "Larissa"], ["P", "Fair enough. I won't hold it against you. Well, I'd better get going. I've got a call at nine.", "Greg"], ["S", "Okay. Have a good day!", "Larissa"], ["P", "You too. Let me know if you need anything.", "Greg"]], "words": 246, "kind": "story", "scene": "Monday, 8:55 a.m., by the coffee machine.", "F": "Small talk expects a short, positive answer and the same question back. \"What did you get up to?\" means \"what did you do?\" \"I won't hold it against you\" is a joke meaning \"that's okay.\"", "V": "", "t": [[0.3, 1.52], [1.87, 3.24], [3.84, 4.57], [4.92, 6.22], [6.57, 7.47], [8.07, 9.46], [9.81, 12.34], [12.69, 13.94], [14.29, 17.54], [18.14, 19.87], [20.22, 21.0], [21.6, 22.58], [22.93, 24.75], [25.1, 26.03], [26.63, 27.94], [28.29, 30.33], [30.93, 31.71], [32.06, 33.89], [34.24, 36.53], [37.13, 37.71], [38.06, 40.46], [41.06, 42.25], [42.6, 43.82], [44.17, 47.67], [48.02, 49.55], [50.15, 51.09], [51.44, 54.49], [54.84, 57.18], [57.53, 60.98], [61.58, 63.4], [63.75, 65.34], [65.69, 67.15], [67.75, 68.32], [68.67, 69.59], [69.94, 71.3], [71.9, 73.24], [73.59, 76.26], [76.86, 77.77], [78.12, 79.81], [80.16, 81.67], [82.27, 83.16], [83.51, 85.07], [85.42, 86.97], [87.32, 88.88], [89.48, 90.05], [90.4, 91.26], [91.86, 92.66], [93.01, 94.85]], "R": [["It's Monday morning. A colleague stops by the coffee machine.", "Greg", "Morning! How was your weekend?", "Pretty good, thanks! I went to Granville Island with my husband. How about yours?"], ["Your colleague asks about your plans for the winter.", "Greg", "Do you ski? You should really try it this year.", "I've never tried, but I'd like to. Do you know a good place for beginners?"]]}, {"num": 6, "title": "Team Lunch", "lines": [["P", "Okay, is everyone ready to order? Larissa, have you decided?", "Karen"], ["S", "I think so. What do you recommend? It's my first time here.", "Larissa"], ["P", "The fish tacos are really good. I get them every time.", "Megan"], ["P", "Megan gets them every time because she never tries anything else.", "Rodrigo"], ["P", "Why would I? They're perfect. I'm Megan, by the way. I don't think we've met. I lead the marketing team, so I'm on the other side of the office.", "Megan"], ["S", "Nice to meet you. I'm Larissa. I just started today, on Karen's team.", "Larissa"], ["P", "Oh, I heard! Welcome. How's your first day going so far?", "Megan"], ["S", "Really well, thanks. Everyone's been very friendly. Kevin already set up my laptop, and Rodrigo showed me the kitchen rules.", "Larissa"], ["P", "Ah, the kitchen rules. Did he tell you about Fridays?", "Megan"], ["S", "He did. I'm a little scared of the fridge now.", "Larissa"], ["P", "You should be. Okay, just so you know, lunch is on the company today, so order whatever you like.", "Karen"], ["S", "That's very kind. Thank you.", "Larissa"], ["P", "But usually, when we go out for lunch, everyone pays for their own. People ask for separate bills all the time. Nobody gets offended.", "Rodrigo"], ["S", "That's different from Brazil. There, we often split it equally, or one person pays.", "Larissa"], ["P", "Honestly, that sounds nicer.", "Megan"], ["P", "Speaking of paying, don't forget the tip. It's usually around eighteen percent here.", "Karen"], ["S", "Eighteen? Okay. I'm still getting used to that.", "Larissa"], ["P", "We all are. Even after three years.", "Rodrigo"]], "words": 231, "kind": "story", "scene": "12:15 p.m., a restaurant near the office.", "F": "\"Separate bills\" means each person pays for their own meal. Listen carefully to \"eighteen\" and \"eighty\": the stress is on the second part in eighteen and the first part in eighty.", "V": "", "t": [[0.3, 2.32], [2.67, 4.36], [4.96, 5.72], [6.07, 7.04], [7.39, 8.66], [9.26, 11.01], [11.36, 12.81], [13.41, 17.19], [17.79, 18.67], [19.02, 19.97], [20.32, 21.7], [22.05, 23.35], [23.7, 27.32], [27.92, 28.93], [29.28, 30.1], [30.45, 32.76], [33.36, 34.23], [34.58, 35.33], [35.68, 37.71], [38.31, 39.44], [39.79, 41.35], [41.7, 46.12], [46.72, 48.01], [48.36, 49.93], [50.53, 51.15], [51.5, 53.15], [53.75, 54.58], [54.93, 59.72], [60.32, 61.35], [61.7, 62.34], [62.94, 66.82], [67.17, 69.41], [69.76, 70.95], [71.55, 72.86], [73.21, 76.54], [77.14, 78.88], [79.48, 81.63], [81.98, 84.02], [84.62, 85.24], [85.59, 86.17], [86.52, 87.93], [88.53, 89.32], [89.67, 90.94]], "R": [["You're at a team lunch at a new restaurant.", "Megan", "What are you thinking of getting?", "I'm not sure yet. What do you recommend? It's my first time here."], ["The bill arrives. Your colleague asks how you want to pay.", "Server", "Is this all together, or separate bills?", "Separate bills, please. And could I pay by card?"]]}, {"num": 7, "title": "Paperwork and Benefits", "lines": [["P", "Hi, Larissa, come on in. I'm Priya. I'm the HR partner for your team. This should take about thirty minutes.", "Priya"], ["S", "Hi, Priya. Nice to meet you.", "Larissa"], ["P", "You too. So first, the paperwork. I need you to fill out two tax forms, the TD1 forms. One is federal, and one is for B.C. They tell payroll how much tax to take off your paycheque.", "Priya"], ["S", "Okay. I think I did one of these at my last job.", "Larissa"], ["P", "Great, so you know the drill. I'll also need a void cheque, or a direct deposit form from your bank, so we can pay you.", "Priya"], ["S", "I can get that from my banking app. When is payday?", "Larissa"], ["P", "We pay every two weeks, on Fridays. Your first pay will be on the twenty-fourth. Now, benefits. You're eligible after a three-month waiting period. That covers dental, prescription drugs, and things like physiotherapy and massage.", "Priya"], ["S", "And glasses?", "Larissa"], ["P", "Yes, there's some vision coverage too. I'll send you the booklet with all the details. Your husband can be covered as well. You just add him when you enrol.", "Priya"], ["S", "That's great. What about vacation?", "Larissa"], ["P", "You start with three weeks a year. And you have five personal days for things like appointments, or if you're sick. If you're sick, just message Karen before nine, and that's it. You don't need a doctor's note for one or two days.", "Priya"], ["S", "Really? That's good to know.", "Larissa"], ["P", "And one more thing. We have an Employee Assistance Program. It's free and confidential. If you ever need to talk to someone about stress or anything personal, it's there for you.", "Priya"], ["S", "Thank you. I really appreciate that.", "Larissa"]], "words": 267, "kind": "story", "scene": "2 p.m., a small meeting room.", "F": "\"You know the drill\" means you already know the routine. Listen for the numbers: two forms, every two weeks, three months, three weeks, five days. The benefits and rules here are examples, not a description of any real employer.", "V": "", "t": [[0.3, 1.7], [2.05, 2.87], [3.22, 5.06], [5.41, 7.15], [7.75, 8.5], [8.85, 9.86], [10.46, 11.18], [11.53, 12.93], [13.28, 16.71], [17.06, 22.49], [23.09, 23.67], [24.02, 26.36], [26.96, 28.36], [28.71, 33.78], [34.38, 36.03], [36.38, 37.25], [37.85, 39.91], [40.26, 42.27], [42.62, 43.61], [43.96, 46.63], [46.98, 51.73], [52.33, 53.17], [53.77, 55.7], [56.05, 58.23], [58.58, 60.33], [60.68, 62.24], [62.84, 63.61], [63.96, 65.08], [65.68, 67.24], [67.59, 71.62], [71.97, 74.99], [75.34, 77.9], [78.5, 79.06], [79.41, 80.31], [80.91, 81.92], [82.27, 84.31], [84.66, 86.1], [86.45, 91.24], [91.84, 92.48], [92.83, 94.21]], "R": [["HR asks you for your banking information.", "Priya", "I'll also need a void cheque or a direct deposit form, so we can pay you.", "Sure. I can download a direct deposit form from my banking app. Should I email it to you?"], ["HR explains your benefits.", "Priya", "You're eligible for benefits after a three-month waiting period.", "Okay, thanks. Does that include dental? And can my husband be covered too?"]]}, {"num": 8, "title": "Your First Project", "lines": [["P", "Morning! Have you got a few minutes? I want to talk about your first project.", "Karen"], ["S", "Of course. I've been looking forward to this.", "Larissa"], ["P", "So, you know we're moving the Burnaby warehouse team onto our new system next month? I'd like you to own the training schedule.", "Karen"], ["S", "Own it? You mean I'm responsible for the whole thing?", "Larissa"], ["P", "Exactly. You'll plan the sessions, book the rooms, and make sure everyone attends. I'm not expecting perfection. Just get a first draft together, and we'll go from there.", "Karen"], ["S", "Okay. When do you need the draft?", "Larissa"], ["P", "Could you have something by end of day Thursday? Nothing fancy. A simple spreadsheet is fine.", "Karen"], ["S", "End of day Thursday. Does that mean five o'clock?", "Larissa"], ["P", "Good question. Technically, yes, but if it lands in my inbox Friday morning, the world won't end. Just give me a heads-up if it's going to be late.", "Karen"], ["S", "Got it. Who should I talk to at the warehouse?", "Larissa"], ["P", "Talk to Dave Robertson. He's the site manager. I'll loop you in on the email thread, so you can see the background.", "Karen"], ["S", "Loop me in. So, you'll add me to the emails?", "Larissa"], ["P", "Right. Sorry, I use a lot of office language. Stop me whenever I do that.", "Karen"], ["S", "I will, don't worry! And what if Dave doesn't reply?", "Larissa"], ["P", "Give it a day, then follow up. If you still don't hear back, let me know, and I'll give him a nudge.", "Karen"], ["S", "Okay. I'll send you what I have on Thursday.", "Larissa"], ["P", "Perfect. And Larissa, if anything's unclear, ask. It's always better to ask than to guess.", "Karen"]], "words": 257, "kind": "story", "scene": "The next Monday, Karen's office.", "F": "To \"own\" a task means to be fully responsible for it. A \"heads-up\" is a warning in advance. \"Give him a nudge\" means remind him gently. Karen says the deadline is flexible, but she does expect a message if it will be late.", "V": "", "t": [[0.3, 0.92], [1.27, 2.59], [2.94, 4.96], [5.56, 6.26], [6.61, 8.1], [8.7, 13.3], [13.65, 15.6], [16.2, 16.79], [17.14, 19.58], [20.18, 20.99], [21.34, 24.95], [25.3, 26.89], [27.24, 30.06], [30.66, 31.24], [31.59, 32.73], [33.33, 35.63], [35.98, 37.0], [37.35, 38.97], [39.57, 40.68], [41.03, 42.4], [43.0, 43.94], [44.29, 49.1], [49.45, 51.74], [52.34, 52.92], [53.27, 54.86], [55.46, 56.88], [57.23, 58.53], [58.88, 62.49], [63.09, 63.81], [64.16, 65.86], [66.46, 67.04], [67.39, 69.63], [69.98, 71.59], [72.19, 73.22], [73.57, 75.17], [75.77, 77.44], [77.79, 81.2], [81.8, 82.37], [82.72, 84.57], [85.17, 85.86], [86.21, 88.56], [88.91, 90.87]], "R": [["Your manager gives you your first project.", "Karen", "I'd like you to own the training schedule. Could you have a draft by end of day Thursday?", "Sure. Just to confirm, does end of day mean five o'clock? And who should I talk to at the warehouse?"], ["Your manager uses an expression you don't know.", "Karen", "I'll loop you in on the email thread.", "Sorry, what does \"loop me in\" mean? Will you add me to the emails?"]]}, {"num": 9, "title": "Asking for Help", "lines": [["S", "Rodrigo, have you got a second? Or are you busy?", "Larissa"], ["P", "I've always got a second for you. What's up?", "Rodrigo"], ["S", "It's about the training schedule. I've been trying to book rooms in the calendar, but it keeps saying I don't have permission. I didn't want to bother Kevin again. I already asked him two questions this morning.", "Larissa"], ["P", "Larissa, that's literally his job. You're not bothering him. But I can show you. Look, you're trying to book the rooms from your own calendar. You need to use the Room Finder instead. It's this button here.", "Rodrigo"], ["S", "Oh! I didn't even see that. Thank you. I feel a little silly.", "Larissa"], ["P", "Don't. It took me a month to find it. Can I give you some advice, though?", "Rodrigo"], ["S", "Please.", "Larissa"], ["P", "When I started here, I was worried that asking questions made me look bad. In Brazil, I was a senior analyst. I was used to being the person with the answers. So here, I tried to figure everything out by myself.", "Rodrigo"], ["S", "That's exactly how I feel.", "Larissa"], ["P", "Right. But I wasted so much time. People here really don't mind questions. What they mind is when you spend two days stuck and don't say anything.", "Rodrigo"], ["S", "So it's better to ask early.", "Larissa"], ["P", "Exactly. One tip: put everything in one message. Like, \"Hi Kevin, quick question when you have a minute,\" and then explain the problem. That way, people can answer when they're free.", "Rodrigo"], ["S", "That's a good idea. I'll do that.", "Larissa"], ["P", "And you can always ask me. In English or Portuguese.", "Rodrigo"], ["S", "Obrigada, Rodrigo. Really.", "Larissa"], ["P", "De nada. Now go book your rooms.", "Rodrigo"]], "words": 260, "kind": "story", "scene": "Wednesday afternoon, Rodrigo's desk.", "F": "\"Have you got a second?\" is a polite way to interrupt. \"What's up?\" means \"what do you need?\" Notice \"I've been trying\": the present perfect continuous shows something that started earlier and is still happening.", "V": "", "t": [[0.3, 2.16], [2.51, 3.4], [4.0, 5.67], [6.02, 6.72], [7.32, 8.77], [9.12, 13.69], [14.04, 15.77], [16.12, 18.66], [19.26, 21.04], [21.39, 22.57], [22.92, 24.02], [24.37, 27.24], [27.59, 29.63], [29.98, 31.09], [31.69, 32.11], [32.46, 33.61], [33.96, 34.61], [34.96, 35.99], [36.59, 37.15], [37.5, 39.11], [39.46, 41.08], [41.68, 42.3], [42.9, 47.14], [47.49, 49.36], [49.71, 51.9], [52.25, 55.32], [55.92, 57.4], [58.0, 58.58], [58.93, 60.55], [60.9, 63.0], [63.35, 67.21], [67.81, 69.23], [69.83, 70.6], [70.95, 73.0], [73.35, 78.01], [78.36, 80.34], [80.94, 81.9], [82.25, 82.96], [83.56, 84.97], [85.32, 86.73], [87.33, 88.72], [89.07, 89.62], [90.22, 90.92], [91.27, 92.48]], "R": [["You need help, but your colleague looks busy.", "Rodrigo", "What's up?", "Sorry to bother you. Have you got a second? I'm trying to book a room, but it keeps saying I don't have permission."], ["You want to ask IT a question by message.", "Kevin", "Hi, what can I help you with?", "Hi Kevin, quick question when you have a minute. I can't see the Room Finder in my calendar. Could you help me?"]]}]}, {"part": 2, "title": "Meetings", "desc": "Stand-ups, agendas, disagreeing politely, action items, and meeting notes.", "scripts": [{"num": 10, "title": "The Morning Stand-up", "lines": [["P", "Okay, good morning, everyone. Let's keep this quick. Same as always: what you did yesterday, what you're doing today, and any blockers. Greg, do you want to start?", "Karen"], ["P", "Sure. Yesterday, I had the call with the Fraser Valley client. It went well. They're happy with the timeline. Today, I'm writing up the proposal. No blockers.", "Greg"], ["P", "Great. Rodrigo?", "Karen"], ["P", "Yesterday, I finished the monthly sales report. It's on the shared drive if anyone wants to look. Today, I'm cleaning up the warehouse data for Larissa's project. One blocker, though. I still don't have access to the new system.", "Rodrigo"], ["P", "Okay, I'll ping Kevin about that right after this. Larissa?", "Karen"], ["S", "Yesterday, I sent the draft training schedule to Karen and Dave. Today, I'm booking the rooms for the first three sessions. And, um, I think I have a blocker too. Dave hasn't replied to my email yet.", "Larissa"], ["P", "When did you send it?", "Karen"], ["S", "On Tuesday morning.", "Larissa"], ["P", "Okay, two days is long enough. Follow up today, and copy me this time. Sometimes an email from a manager gets a faster answer.", "Karen"], ["S", "Okay, I'll do that.", "Larissa"], ["P", "Anything else before we wrap up?", "Karen"], ["P", "Just a reminder, it's Megan's birthday on Friday. There's a card going around. Please sign it, and don't read what I wrote.", "Greg"], ["P", "Noted. Okay, thanks, everyone. That's it. Have a good day.", "Karen"], ["S", "That was fast. Is it always only ten minutes?", "Larissa"], ["P", "It's supposed to be fifteen. If it's longer than that, someone's talking too much. Usually Greg.", "Rodrigo"]], "words": 242, "kind": "story", "scene": "Thursday, 9 a.m., the team area.", "F": "A \"blocker\" is a problem that stops your work. To \"ping\" someone means to send them a quick message. \"Wrap up\" means finish.", "V": "", "t": [[0.3, 2.07], [2.42, 3.66], [4.01, 8.67], [9.02, 10.39], [10.99, 11.6], [11.95, 15.41], [15.76, 16.71], [17.06, 18.78], [19.13, 21.46], [21.81, 22.91], [23.51, 24.14], [24.49, 25.26], [25.86, 28.42], [28.77, 31.14], [31.49, 35.24], [35.59, 36.65], [37.0, 39.27], [39.87, 42.61], [42.96, 43.64], [44.24, 48.05], [48.4, 51.55], [51.9, 54.2], [54.55, 56.81], [57.41, 58.53], [59.13, 60.24], [60.84, 62.68], [63.03, 65.38], [65.73, 69.2], [69.8, 71.13], [71.73, 73.4], [74.0, 77.28], [77.63, 79.34], [79.69, 81.97], [82.57, 83.17], [83.52, 85.08], [85.43, 86.13], [86.48, 87.39], [87.99, 88.89], [89.24, 90.81], [91.41, 92.79], [93.14, 95.67], [96.02, 96.99]], "R": [["It's the morning stand-up. It's your turn.", "Karen", "Okay, what did you do yesterday, what are you doing today, and any blockers?", "Yesterday, I sent the draft schedule. Today, I'm booking the rooms. One blocker: I'm still waiting for Dave to reply."], ["Your manager suggests you follow up with someone.", "Karen", "It's been two days. Follow up today, and copy me this time.", "Okay, I'll send him a follow-up this morning and copy you on it."]]}, {"num": 11, "title": "The Meeting Invite", "lines": [["S", "Rodrigo, I got a meeting invite from Megan for tomorrow, but I'm a bit confused. It says my attendance is optional. Does that mean I shouldn't go?", "Larissa"], ["P", "Not exactly. It means you're welcome, but it's not essential. Megan probably wants you there to listen, but you don't have to present anything.", "Rodrigo"], ["S", "So, should I accept or decline?", "Larissa"], ["P", "What's the topic?", "Rodrigo"], ["S", "The launch plan for the new training videos. And there's an agenda. Three items: timeline, budget, and \"parking lot.\" What's a parking lot in a meeting?", "Larissa"], ["P", "Good question. It's a list of topics that come up but aren't on the agenda. Instead of discussing them right then, someone writes them down, and they deal with them later. It keeps the meeting on track.", "Rodrigo"], ["S", "Oh, that's smart. And what does \"hard stop at two\" mean? She wrote that at the bottom.", "Larissa"], ["P", "It means she has to leave at exactly two o'clock. No extra time. So the meeting will end on time, even if you haven't finished.", "Rodrigo"], ["S", "Okay. I think I'll go. The videos are for my training sessions, so it's related to my project.", "Larissa"], ["P", "Then definitely go. And accept the invite, don't just show up. If you click \"tentative,\" it means maybe. People hate that.", "Rodrigo"], ["S", "Really?", "Larissa"], ["P", "Well, they don't hate it. But it's hard to plan when half the people say maybe.", "Rodrigo"], ["S", "Fair enough. Should I prepare anything?", "Larissa"], ["P", "Read the agenda, and think of one good question. That's all. If you ask one smart question, people remember you were there.", "Rodrigo"]], "words": 249, "kind": "story", "scene": "Wednesday afternoon, Rodrigo's desk.", "F": "\"Optional\" means you can choose not to attend. A \"parking lot\" is a list of topics saved for later. A \"hard stop\" is a time someone must leave, with no extra minutes.", "V": "", "t": [[0.3, 5.59], [5.94, 7.8], [8.15, 9.55], [10.15, 11.11], [11.46, 13.62], [13.97, 18.32], [18.92, 20.77], [21.37, 22.36], [22.96, 25.08], [25.43, 26.47], [26.82, 29.96], [30.31, 31.88], [32.48, 33.43], [33.78, 37.02], [37.37, 42.5], [42.85, 44.31], [44.91, 45.96], [46.31, 48.44], [48.79, 50.09], [50.69, 53.48], [53.83, 54.91], [55.26, 58.59], [59.19, 59.76], [60.11, 60.99], [61.34, 65.54], [66.14, 67.3], [67.65, 69.79], [70.14, 72.34], [72.69, 73.7], [74.3, 74.85], [75.45, 76.61], [76.96, 79.76], [80.36, 81.05], [81.4, 82.61], [83.21, 85.75], [86.1, 86.83], [87.18, 90.65]], "R": [["A colleague invites you to a meeting, but your attendance is optional.", "Megan", "You're welcome to join tomorrow. It's optional, though.", "Thanks! I'd like to come. The topic is related to my project, so I'll accept the invite."], ["The meeting has a hard stop.", "Megan", "Just so you know, I have a hard stop at two.", "No problem. I'll keep my question short so we finish on time."]]}, {"num": 12, "title": "Disagreeing Politely", "lines": [["P", "So, here's my idea. The client wants to start using the system earlier. What if we move all the training sessions up by two weeks?", "Greg"], ["P", "Hmm. Larissa, you've been working on the schedule. What do you think?", "Karen"], ["S", "I see where you're coming from, Greg. It would definitely make the client happy. But can I push back a little?", "Larissa"], ["P", "Of course. Go for it.", "Greg"], ["S", "The problem is the warehouse. Dave told me that the first two weeks of the month are their busiest time. If we move the training earlier, a lot of people won't be able to come.", "Larissa"], ["P", "Oh. I didn't know that. How many people are we talking about?", "Greg"], ["S", "About half the team. Maybe twenty people. We'd have to repeat the sessions, and that would cost more.", "Larissa"], ["P", "That's a really good point. Greg, is the client's date firm, or is there some flexibility?", "Karen"], ["P", "Honestly, I'm not sure. They said \"as soon as possible,\" but that could mean anything.", "Greg"], ["S", "What if we did a middle option? We could train a small group earlier, like the supervisors, and then train everyone else on the original dates.", "Larissa"], ["P", "I like that. That gives me something positive to tell them.", "Greg"], ["P", "Great. Larissa, can you put together a revised plan with that option?", "Karen"], ["S", "Sure. I'll have it ready by tomorrow.", "Larissa"], ["P", "Nice work. And for the record, I'm very happy to be pushed back on when it saves us money.", "Greg"], ["P", "We'll remember you said that.", "Karen"]], "words": 239, "kind": "story", "scene": "Monday, a meeting room.", "F": "\"I see where you're coming from, but\" and \"Can I push back a little?\" let you disagree while showing respect. A \"firm\" date is one that can't change.", "V": "", "t": [[0.3, 1.71], [2.06, 5.12], [5.47, 8.74], [9.34, 9.81], [10.16, 12.44], [12.79, 13.67], [14.27, 15.91], [16.26, 18.29], [18.64, 20.0], [20.6, 21.47], [21.82, 22.7], [23.3, 24.81], [25.16, 29.02], [29.37, 33.18], [33.78, 34.31], [34.66, 35.81], [36.16, 38.26], [38.86, 39.89], [40.24, 41.38], [41.73, 44.79], [45.39, 46.84], [47.19, 50.85], [51.45, 52.88], [53.23, 56.83], [57.43, 58.91], [59.26, 65.77], [66.37, 67.38], [67.73, 70.31], [70.91, 71.54], [71.89, 75.43], [76.03, 76.51], [76.86, 78.31], [78.91, 79.86], [80.21, 85.02], [85.62, 87.07]], "R": [["A colleague suggests an idea you don't agree with.", "Greg", "What if we move all the training sessions up by two weeks?", "I see where you're coming from. But can I push back a little? The first two weeks are the warehouse's busiest time."], ["Your manager asks what you suggest instead.", "Karen", "So, what would you do?", "What if we trained the supervisors first, and everyone else on the original dates?"]]}, {"num": 13, "title": "Let's Take This Offline", "lines": [["P", "Okay, the next item is the training videos. We're planning to film them in the warehouse next week. We'll need about three hours.", "Megan"], ["P", "Three hours? Megan, the client already said they don't want any disruption. Can't you film them here, in the office?", "Greg"], ["P", "Not really. The whole point is to show the real equipment. If we film in a meeting room, the videos will look fake.", "Megan"], ["P", "I get that, but three hours is a lot. Can you do it in one?", "Greg"], ["P", "One hour isn't realistic. We need time to set up the lights, the cameras, and...", "Megan"], ["P", "Okay, I can see this is important to both of you. But we still have four items to get through. Why don't we take this offline? Megan and Greg, can you two find some time today to talk it through?", "Karen"], ["P", "Sure, that works.", "Megan"], ["P", "Yeah, fine. Sorry, everyone.", "Greg"], ["P", "No need to apologize. Let's move on. Next item.", "Karen"], ["S", "Rodrigo, can I ask you something about the meeting? What did Karen mean by \"take this offline\"? Was she angry?", "Larissa"], ["P", "No, not at all. It just means: \"This conversation is too long for this meeting. Discuss it later, without the whole group.\"", "Rodrigo"], ["S", "Oh, okay. I thought she was annoyed with them.", "Larissa"], ["P", "She was a little, but only because of the time. It's a polite way to stop a discussion. You'll hear it all the time.", "Rodrigo"], ["S", "So it doesn't mean \"on the internet.\"", "Larissa"], ["P", "Ha, no. Although sometimes they do continue it on Slack.", "Rodrigo"]], "words": 244, "kind": "story", "scene": "A team meeting, then just after it.", "F": "\"Take this offline\" means discuss it later, in a smaller group. \"Talk it through\" means discuss something until you agree. \"I get that, but\" accepts a point before disagreeing.", "V": "", "t": [[0.3, 2.91], [3.26, 5.92], [6.27, 7.74], [8.34, 9.37], [9.72, 13.66], [14.01, 16.25], [16.85, 17.72], [18.07, 20.56], [20.91, 23.89], [24.49, 26.8], [27.15, 28.42], [29.02, 30.7], [31.05, 33.69], [34.29, 37.26], [37.61, 39.71], [40.06, 41.68], [42.03, 45.78], [46.38, 47.38], [47.98, 48.89], [49.24, 50.46], [51.06, 52.59], [52.94, 53.87], [54.22, 55.09], [55.69, 58.4], [58.75, 61.09], [61.44, 62.24], [62.84, 63.82], [64.17, 67.75], [68.1, 70.16], [70.76, 71.58], [71.93, 73.38], [73.98, 76.33], [76.68, 78.69], [79.04, 80.32], [80.92, 82.87], [83.47, 84.23], [84.58, 87.14]], "R": [["Two colleagues are arguing in a meeting, and there's no time left.", "Karen", "Why don't we take this offline?", "Good idea. Megan, Greg, would you like me to set up a short meeting for you two this afternoon?"], ["A colleague asks you what \"take this offline\" means.", "Daniel", "What did Karen mean by \"take this offline\"?", "It means they'll discuss it later, in a smaller group, not in this meeting."]]}, {"num": 14, "title": "Action Items", "lines": [["P", "Okay, we're almost out of time, so let's go over the action items before we finish. Larissa, would you mind taking notes?", "Karen"], ["S", "Sure. Go ahead.", "Larissa"], ["P", "Great. First, Greg is going to call the client about the supervisor training. Greg, can you do that by Wednesday?", "Karen"], ["P", "Wednesday works. I'll let everyone know what they say.", "Greg"], ["P", "Perfect. Second, Megan and Greg are going to agree on the filming time. Megan, you'll send a proposal to Dave once you two have talked?", "Karen"], ["P", "Yep. I'll have it out by Thursday at the latest.", "Megan"], ["P", "Thanks. Third, Rodrigo will finish cleaning the warehouse data. Rodrigo, where are you with that?", "Karen"], ["P", "About halfway. I should be done by Friday, as long as I get access to the new system.", "Rodrigo"], ["P", "Right. I'll follow up with Kevin on that. Put me down for that one, Larissa.", "Karen"], ["S", "Karen, follow up with Kevin. Got it.", "Larissa"], ["P", "And last, Larissa, you'll update the training schedule with the new option and share it with the group.", "Karen"], ["S", "Yes. By Friday?", "Larissa"], ["P", "Friday's fine. Did I miss anything?", "Karen"], ["P", "I don't think so.", "Megan"], ["P", "Okay. Larissa, can you send the notes out to everyone after the meeting?", "Karen"], ["S", "Of course. I'll send them this afternoon.", "Larissa"], ["P", "Thanks. Let's circle back next Monday and see where we are. Thanks, everyone.", "Karen"], ["S", "Rodrigo, is it normal for the new person to take notes?", "Larissa"], ["P", "Very normal. But it's also a good thing. Now everyone knows your name, and you know exactly what's happening.", "Rodrigo"]], "words": 238, "kind": "story", "scene": "The end of a team meeting.", "F": "\"Action items\" are the tasks people agree to do after a meeting. \"At the latest\" means no later than. \"Circle back\" means return to a topic later.", "V": "", "t": [[0.3, 5.09], [5.44, 7.5], [8.1, 8.58], [8.93, 9.59], [10.19, 10.82], [11.17, 14.94], [15.29, 17.18], [17.78, 18.87], [19.22, 21.35], [21.95, 22.64], [22.99, 26.74], [27.09, 30.48], [31.08, 31.66], [32.01, 34.14], [34.74, 35.35], [35.7, 38.61], [38.96, 40.82], [41.42, 42.36], [42.71, 46.72], [47.32, 47.89], [48.24, 49.94], [50.29, 52.14], [52.74, 54.36], [54.71, 55.29], [55.89, 61.43], [62.03, 62.59], [62.94, 63.7], [64.3, 65.29], [65.64, 66.75], [67.35, 68.4], [69.0, 69.63], [69.98, 73.42], [74.02, 74.72], [75.07, 76.53], [77.13, 77.74], [78.09, 80.9], [81.25, 82.26], [82.86, 86.24], [86.84, 87.68], [88.03, 89.31], [89.66, 93.46]], "R": [["At the end of a meeting, your manager asks you to take notes.", "Karen", "Larissa, would you mind taking notes?", "Not at all. I'll send the action items to everyone this afternoon."], ["Your manager checks when you'll finish your task.", "Karen", "Can you have the schedule updated by Friday?", "Yes, Friday works. I'll share it with the group by Friday at the latest."]]}, {"num": 15, "title": "Speaking Up", "lines": [["P", "Hey, how was the meeting with the client team?", "Rodrigo"], ["S", "Honestly, not great. I had something important to say about the schedule, but I couldn't find a moment. Everyone talked so fast, and they kept interrupting each other.", "Larissa"], ["P", "Ah, yes. That happens a lot in bigger meetings. So you didn't say anything?", "Rodrigo"], ["S", "Nothing. And then, at the end, someone suggested exactly my idea. And everyone loved it.", "Larissa"], ["P", "Oh no. That's the worst feeling. I've been there.", "Rodrigo"], ["S", "In Brazil, it's easier for me. I know how to jump into the conversation. But here, I feel like I'm being rude if I interrupt.", "Larissa"], ["P", "I understand. Can I give you a few phrases that help me?", "Rodrigo"], ["S", "Yes, please.", "Larissa"], ["P", "The first one is \"Can I jump in here?\" You say it when someone pauses, even for a second. It's polite, and people usually stop and let you talk.", "Rodrigo"], ["S", "\"Can I jump in here?\" Okay.", "Larissa"], ["P", "Another one is \"Just to build on what Greg said.\" That's good because you're connecting your idea to someone else's. It doesn't sound like you're disagreeing.", "Rodrigo"], ["S", "That's useful. What else?", "Larissa"], ["P", "And if someone interrupts you, you can say, \"Sorry, let me just finish this thought.\" Say it with a smile, and it's totally fine.", "Rodrigo"], ["S", "I don't think I could say that to Greg.", "Larissa"], ["P", "Especially to Greg. He'll respect you more. Also, one more tip. Try to say something in the first ten minutes. After that, it gets harder.", "Rodrigo"], ["S", "Okay. Next meeting, I'll try.", "Larissa"]], "words": 242, "kind": "story", "scene": "After a large client meeting, the kitchen.", "F": "Three phrases to learn: \"Can I jump in here?\", \"Just to build on what Greg said,\" and \"Sorry, let me just finish this thought.\" \"I've been there\" means \"that happened to me too.\"", "V": "", "t": [[0.3, 2.48], [3.08, 4.46], [4.81, 9.07], [9.42, 12.99], [13.59, 14.27], [14.62, 16.45], [16.8, 18.15], [18.75, 19.36], [19.71, 23.56], [23.91, 25.03], [25.63, 26.27], [26.62, 27.83], [28.18, 29.08], [29.68, 31.54], [31.89, 34.05], [34.4, 37.44], [38.04, 38.95], [39.3, 41.55], [42.15, 42.98], [43.58, 45.54], [45.89, 48.67], [49.02, 52.13], [52.73, 53.81], [54.16, 54.74], [55.34, 57.93], [58.28, 61.59], [61.94, 63.86], [64.46, 65.3], [65.65, 66.3], [66.9, 71.36], [71.71, 73.91], [74.51, 76.34], [76.94, 78.1], [78.45, 79.6], [79.95, 81.12], [81.47, 83.65], [84.0, 85.4], [86.0, 86.57], [86.92, 88.34]], "R": [["You're in a busy meeting and want to add an idea.", "Greg", "So I think we should start in June, and…", "Sorry, can I jump in here? Just to build on what Greg said, we could start with the supervisors in June."], ["Someone interrupts you while you're speaking.", "Greg", "Actually, I think the budget is more important.", "Sorry, let me just finish this thought. Then I'd love to hear about the budget."]]}, {"num": 16, "title": "Larissa Runs a Meeting", "lines": [["S", "Okay, I think it's two o'clock, so let's get started. Thanks for coming, Kevin and Priya. I know you're both busy, so I'll keep this to thirty minutes.", "Larissa"], ["P", "Sounds good.", "Priya"], ["P", "Appreciate it.", "Kevin"], ["S", "So, the goal today is to confirm the details for the warehouse training. I sent the agenda this morning. We have three things to cover: equipment, the sign-in process, and the dates. Kevin, can we start with you?", "Larissa"], ["P", "Sure. I can bring ten laptops for each session. They'll already have the new system installed, so people can practise right away.", "Kevin"], ["S", "Perfect. Will you be there, or should I ask someone else to set up?", "Larissa"], ["P", "I'll be there for the first session, just in case something breaks. After that, the warehouse team should be okay on their own.", "Kevin"], ["S", "Great, thank you. Priya, the next item is for you. How should people sign in?", "Larissa"], ["P", "We need a record of who completes the training. It's a safety requirement. So, a paper sign-in sheet is fine, as long as you send me a copy after each session.", "Priya"], ["S", "No problem. I'll scan them and email them to you the same day.", "Larissa"], ["P", "That would be perfect.", "Priya"], ["S", "And the last item is the dates. I've shared the revised schedule on the screen. Does anyone see a problem?", "Larissa"], ["P", "The fourteenth is a bit tight for me, but I can make it work.", "Kevin"], ["S", "Okay, thanks. So, just to recap: Kevin brings the laptops, and I send Priya the sign-in sheets. Did I miss anything?", "Larissa"], ["P", "Nope. Nicely done.", "Priya"]], "words": 250, "kind": "story", "scene": "2 p.m., a meeting room.", "F": "Notice how Larissa opens the meeting: the time, the goal, and the three agenda items. \"I can make it work\" means it's difficult but possible. \"Just to recap\" introduces a short summary.", "V": "", "t": [[0.3, 3.43], [3.78, 5.79], [6.14, 9.38], [9.98, 10.83], [11.43, 12.37], [12.97, 17.29], [17.64, 19.3], [19.65, 24.19], [24.54, 26.12], [26.72, 27.3], [27.65, 29.88], [30.23, 34.88], [35.48, 36.12], [36.47, 39.4], [40.0, 43.35], [43.7, 46.61], [47.21, 48.23], [48.58, 50.6], [50.95, 52.25], [52.85, 55.32], [55.67, 57.12], [57.47, 62.46], [63.06, 63.89], [64.24, 67.02], [67.62, 68.68], [69.28, 70.88], [71.23, 73.6], [73.95, 75.3], [75.9, 79.27], [79.87, 80.94], [81.29, 86.73], [87.08, 88.1], [88.7, 89.29], [89.64, 90.53]], "R": [["You're opening your first meeting as the organizer.", "Priya", "Okay, we're all here. Over to you.", "Thanks for coming. The goal today is to confirm the training details. We have three things to cover: equipment, sign-in, and dates."], ["You're ending the meeting.", "Kevin", "I think that's everything from me.", "Great. So, just to recap: Kevin brings the laptops, and I send Priya the sign-in sheets. Did I miss anything?"]]}, {"num": 17, "title": "When Nobody Agrees", "lines": [["P", "So, we need to decide on the date for the client presentation. We've got two options: the twenty-first or the twenty-eighth. Megan, what are you thinking?", "Karen"], ["P", "I'd go with the twenty-eighth. It gives my team another week to finish the videos. If we show them unfinished work, it might not make a great impression.", "Megan"], ["P", "I don't know. The client's been asking for weeks. If we wait until the twenty-eighth, they might think we're behind.", "Greg"], ["P", "But we are a bit behind, Greg.", "Megan"], ["P", "Sure, but they don't need to know that.", "Greg"], ["P", "Okay. Larissa, where's your team with the training plan?", "Karen"], ["S", "The plan is ready. So either date works for me. But I agree with Megan that the videos are important. They're a big part of the training.", "Larissa"], ["P", "What if we presented on the twenty-first, but only showed the plan? We could present the videos later.", "Greg"], ["P", "I'd rather not. If they see the plan without the videos, they'll have a lot of questions we can't answer yet.", "Megan"], ["P", "I hear both of you. I don't think we're going to agree today. Let's table this until Thursday. Greg, can you find out how flexible the client is? And Megan, can you tell us exactly how much of the video work you could finish by the twenty-first?", "Karen"], ["P", "Sure. I'll have a realistic answer by Thursday.", "Megan"], ["P", "And I'll talk to the client tomorrow.", "Greg"], ["P", "Great. Then on Thursday, we'll make the call. Either way, we'll commit to one date and go with it.", "Karen"], ["S", "Sounds like a plan.", "Larissa"]], "words": 249, "kind": "story", "scene": "Tuesday, a meeting room.", "F": "In Canada, \"let's table this\" means \"let's discuss it later.\" In British English it can mean the opposite, \"let's discuss it now.\" \"Make the call\" means decide. \"I'd rather not\" is a soft way to say no.", "V": "", "t": [[0.3, 3.71], [4.06, 7.27], [7.62, 9.15], [9.75, 11.21], [11.56, 14.31], [14.66, 18.61], [19.21, 20.11], [20.46, 22.45], [22.8, 26.66], [27.26, 28.88], [29.48, 31.32], [31.92, 32.55], [32.9, 35.41], [36.01, 37.0], [37.35, 38.84], [39.19, 42.21], [42.56, 44.11], [44.71, 48.67], [49.02, 50.96], [51.56, 52.59], [52.94, 58.03], [58.63, 59.82], [60.17, 62.11], [62.46, 64.32], [64.67, 67.4], [67.75, 73.01], [73.61, 74.19], [74.54, 76.68], [77.28, 79.24], [79.84, 80.47], [80.82, 82.75], [83.1, 85.77], [86.37, 87.41]], "R": [["Your team can't agree on a date.", "Karen", "Larissa, what do you think? The twenty-first or the twenty-eighth?", "Either date works for my part. But I agree with Megan. The videos are important, so the twenty-eighth might be safer."], ["Your manager wants to delay the decision.", "Karen", "Let's table this until Thursday.", "Sounds good. Before Thursday, I'll check how much of the training plan we can show on each date."]]}, {"num": 18, "title": "It Could Have Been an Email", "lines": [["S", "Ninety minutes. I can't believe that meeting was ninety minutes.", "Larissa"], ["P", "And we only really needed about ten. Welcome to corporate life.", "Rodrigo"], ["S", "Half the time, people were just repeating what the person before them said.", "Larissa"], ["P", "Yeah. That was definitely a meeting that could have been an email.", "Rodrigo"], ["S", "Is that a common expression?", "Larissa"], ["P", "Very common. People say it as a joke, but they're usually a little serious too. Everyone here has too many meetings.", "Rodrigo"], ["S", "So, what do you do about it? Can you just say no to a meeting?", "Larissa"], ["P", "Sometimes. If I'm not sure I need to be there, I ask the organizer. Something like, \"Hi Megan, do you need me for this one, or can I catch up on the notes afterward?\"", "Rodrigo"], ["S", "And people don't get offended?", "Larissa"], ["P", "Not if you ask nicely. Most people are actually happy. It means one less person who's bored.", "Rodrigo"], ["S", "That's true. I also noticed that some people had their cameras off and were typing the whole time.", "Larissa"], ["P", "Right. They were probably answering emails. It's not great, but it happens a lot. Just don't do it when you're new.", "Rodrigo"], ["S", "Of course not. Hey, can I ask you something? At the end, Greg said, \"Let's not reinvent the wheel.\" What does that mean?", "Larissa"], ["P", "It means, \"Don't create something new when there's already a solution that works.\"", "Rodrigo"], ["S", "Oh, I like that. It's a good expression.", "Larissa"], ["P", "It is. Greg uses it about three times a meeting, though. So you'll get lots of practice.", "Rodrigo"]], "words": 243, "kind": "story", "scene": "After a long meeting, walking back to their desks.", "F": "\"A meeting that could have been an email\" is a common office joke. \"Catch up on the notes\" means read them later. \"Reinvent the wheel\" means make something new when a good solution already exists.", "V": "", "t": [[0.3, 1.23], [1.58, 4.04], [4.64, 6.56], [6.91, 8.33], [8.93, 13.04], [13.64, 14.25], [14.6, 17.36], [17.96, 19.37], [19.97, 20.85], [21.2, 25.05], [25.4, 27.16], [27.76, 29.21], [29.56, 31.07], [31.67, 32.47], [32.82, 35.95], [36.3, 41.67], [42.27, 43.77], [44.37, 45.68], [46.03, 47.74], [48.09, 50.02], [50.62, 51.35], [51.7, 56.43], [57.03, 57.61], [57.96, 59.72], [60.07, 61.98], [62.33, 63.74], [64.34, 65.19], [65.54, 67.2], [67.55, 70.63], [70.98, 71.91], [72.51, 76.68], [77.28, 78.34], [78.69, 79.78], [80.38, 81.03], [81.38, 83.96], [84.31, 85.76]], "R": [["You don't think you need to attend a long meeting.", "Megan", "Are you coming to the planning meeting tomorrow?", "Do you need me for this one, or can I catch up on the notes afterward?"], ["A colleague uses an expression.", "Greg", "Let's not reinvent the wheel. We already have a template.", "Good point. Could you send me the template? I'll use that instead."]]}, {"num": 19, "title": "Sending the Meeting Notes", "lines": [["S", "Karen, before I send the meeting notes, could you take a quick look? I want to make sure the tone is okay.", "Larissa"], ["P", "Sure. Read it to me.", "Karen"], ["S", "Okay. \"Hi team, thanks for your time today. Here's a summary of what we discussed. Greg will speak to the client about supervisor training by Wednesday. Megan will send the filming proposal to Dave by Thursday. Rodrigo will finish the warehouse data by Friday. And I will share the updated training schedule by Friday. Please let me know if I missed anything.\"", "Larissa"], ["P", "That's really good. Clear and short. I'd change just two small things.", "Karen"], ["S", "Of course.", "Larissa"], ["P", "First, add me to the action items. Remember, I'm following up with Kevin about the system access.", "Karen"], ["S", "Oh, you're right. I forgot that one.", "Larissa"], ["P", "No problem. And second, put the action items in a list, with each person's name in bold. People skim emails. If they see their name, they'll read that part.", "Karen"], ["S", "That makes sense. Should I write \"Dear team\" instead of \"Hi team\"? It sounds more professional.", "Larissa"], ["P", "Honestly, \"Hi team\" is perfect. \"Dear team\" feels a bit too formal here. People save that for letters.", "Karen"], ["S", "Okay, good to know. And should I send it now, or wait until tomorrow?", "Larissa"], ["P", "Send it today, while everyone still remembers the meeting. The best time is within an hour or two.", "Karen"], ["S", "Okay. I'll fix it and send it right away.", "Larissa"], ["P", "Great. And Larissa, this is exactly the kind of thing that gets noticed. People always appreciate the person who sends the notes.", "Karen"], ["S", "Thanks, Karen. That means a lot.", "Larissa"]], "words": 259, "kind": "story", "scene": "Tuesday afternoon, Karen's office.", "F": "To \"skim\" means to read quickly for the main points. \"Hi team\" is the normal greeting for a team email; \"Dear team\" sounds too formal. \"That means a lot\" is a warm way to say thank you.", "V": "", "t": [[0.3, 3.98], [4.33, 6.01], [6.61, 7.13], [7.48, 8.34], [8.94, 9.52], [9.87, 12.11], [12.46, 14.28], [14.63, 18.53], [18.88, 22.66], [23.01, 25.91], [26.26, 29.43], [29.78, 31.97], [32.57, 33.55], [33.9, 34.85], [35.2, 36.94], [37.54, 38.24], [38.84, 40.97], [41.32, 44.8], [45.4, 46.3], [46.65, 47.65], [48.25, 49.17], [49.52, 54.01], [54.36, 55.65], [56.0, 58.36], [58.96, 59.86], [60.21, 62.68], [63.03, 64.35], [64.95, 67.03], [67.38, 69.81], [70.16, 71.74], [72.34, 73.57], [73.92, 76.89], [77.49, 80.54], [80.89, 83.0], [83.6, 84.18], [84.53, 86.34], [86.94, 87.58], [87.93, 91.57], [91.92, 95.1], [95.7, 96.55], [96.9, 97.86]], "R": [["Your manager reviews your meeting notes before you send them.", "Karen", "Put the action items in a list, with each name in bold. People skim.", "That makes sense. I'll fix it and send it right a
