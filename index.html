way, while everyone still remembers the meeting."], ["You're starting an email to the team.", "Karen", "How are you going to start the email?", "\"Hi team, thanks for your time today. Here's a summary of what we discussed.\""]]}]}, {"part": 3, "title": "Working with Your Manager", "desc": "One-on-ones, priorities, working from home, and talking about the future.", "scripts": [{"num": 20, "title": "The First One-on-One", "lines": [["P", "Come on in, Larissa. Have a seat. So, this is our first one-on-one. We'll do these every second Tuesday, for about thirty minutes.", "Karen"], ["S", "Great. What should I prepare for them?", "Larissa"], ["P", "Nothing formal. This time is really yours. You can bring questions, problems, ideas, anything. I'll share updates from my side too. So, how are things going so far? Honestly.", "Karen"], ["S", "Honestly, really well. Everyone's been very welcoming. The only hard part is that there's so much new information. Sometimes I go home, and my head hurts.", "Larissa"], ["P", "That's completely normal in the first month. Is there anything that would make it easier?", "Karen"], ["S", "Maybe a list of the main systems and who to ask about each one. I keep asking Rodrigo, and I feel bad about it.", "Larissa"], ["P", "That's a great idea. Actually, why don't you create that list as you learn? Then the next new person can use it too.", "Karen"], ["S", "Oh, I'd be happy to do that.", "Larissa"], ["P", "Perfect. Now, let's talk about goals. By the end of your first ninety days, I'd like to see three things. The warehouse training finished, a good relationship with Dave's team, and you running your own project meetings.", "Karen"], ["S", "That sounds fair. Can I ask how you'll measure the relationship with Dave's team?", "Larissa"], ["P", "Good question. Mainly, I'll ask Dave for feedback. If he says you're easy to work with, that's a win.", "Karen"], ["S", "Okay. I'll make sure he says that.", "Larissa"], ["P", "I'm sure he will. Anything else on your mind before we wrap up?", "Karen"], ["S", "Not today. Thank you, Karen. This was really helpful.", "Larissa"]], "words": 253, "kind": "story", "scene": "Tuesday, Karen's office.", "F": "A \"one-on-one\" is a regular private meeting with your manager. \"Every second Tuesday\" means every two weeks. \"That's a win\" means that's a success.", "V": "", "t": [[0.3, 1.64], [1.99, 2.8], [3.15, 4.95], [5.3, 8.65], [9.25, 9.83], [10.18, 11.56], [12.16, 13.13], [13.48, 14.99], [15.34, 18.4], [18.75, 20.64], [20.99, 22.92], [23.27, 23.98], [24.58, 26.0], [26.35, 27.95], [28.3, 31.72], [32.07, 34.45], [35.05, 37.27], [37.62, 39.68], [40.28, 44.05], [44.4, 47.33], [47.93, 49.09], [49.44, 52.26], [52.61, 54.69], [55.29, 56.97], [57.57, 58.27], [58.62, 60.26], [60.61, 64.06], [64.41, 70.69], [71.29, 72.23], [72.58, 76.01], [76.61, 77.55], [77.9, 80.08], [80.43, 82.7], [83.3, 83.87], [84.22, 85.39], [85.99, 86.94], [87.29, 89.68], [90.28, 91.04], [91.39, 92.33], [92.68, 93.84]], "R": [["It's your first one-on-one with your manager.", "Karen", "So, how are things going so far? Honestly.", "Honestly, really well. Everyone's very welcoming. The hard part is the amount of new information, but it's getting easier."], ["Your manager asks if you need anything.", "Karen", "Is there anything that would make it easier?", "Maybe a list of our main systems and who to ask about each one. I could start it myself as I learn."]]}, {"num": 21, "title": "Too Many Priorities", "lines": [["S", "Karen, do you have a few minutes? I need some help with my priorities.", "Larissa"], ["P", "Of course. What's going on?", "Karen"], ["S", "Well, this morning, Greg asked me to make some slides for his client meeting on Thursday. Then Megan asked if I could help her team with the video schedule. And I still have the training plan to finish for Friday.", "Larissa"], ["P", "That's a lot. What's on your plate, exactly? Let's write it down.", "Karen"], ["S", "Okay. The training plan, due Friday. Greg's slides, due Thursday. And Megan's schedule, but she didn't give me a date.", "Larissa"], ["P", "Right. So, here's the thing. The training plan is your main project. That comes first, always. Greg's slides aren't really your job. He has an assistant for that.", "Karen"], ["S", "Oh. I didn't know that. I didn't want to say no.", "Larissa"], ["P", "I understand. But it's okay to push back. You can say something like, \"I'd love to help, but I'm focused on the training plan this week. Could your assistant take this one?\"", "Karen"], ["S", "That sounds much nicer than just \"no.\"", "Larissa"], ["P", "Exactly. And for Megan, ask her when she needs it. If it's next week, it can wait. If it's urgent, tell her to talk to me.", "Karen"], ["S", "Okay. That really helps. I was starting to feel overwhelmed.", "Larissa"], ["P", "I could tell. Next time, come to me sooner. Part of my job is protecting your time.", "Karen"], ["S", "Thank you. I'll talk to Greg right now.", "Larissa"], ["P", "Good. And don't worry, he'll be fine. He asks everyone.", "Karen"]], "words": 240, "kind": "story", "scene": "Wednesday morning, Karen's office.", "F": "\"What's on your plate?\" means \"what work do you have right now?\" \"Overwhelmed\" means you have too much to handle. Notice Karen's model for saying no politely: \"I'd love to help, but…\"", "V": "", "t": [[0.3, 2.03], [2.38, 4.29], [4.89, 5.63], [5.98, 6.96], [7.56, 12.89], [13.24, 17.03], [17.38, 20.11], [20.71, 21.55], [21.9, 23.44], [23.79, 24.92], [25.52, 26.09], [26.44, 28.21], [28.56, 30.14], [30.49, 33.17], [33.77, 34.34], [34.69, 35.82], [36.17, 38.33], [38.68, 40.13], [40.48, 42.39], [42.74, 44.26], [44.86, 45.28], [45.63, 46.53], [46.88, 48.1], [48.7, 49.64], [49.99, 51.43], [51.78, 56.74], [57.09, 58.79], [59.39, 61.5], [62.1, 62.9], [63.25, 65.46], [65.81, 67.67], [68.02, 70.1], [70.7, 71.27], [71.62, 72.57], [72.92, 74.56], [75.16, 75.91], [76.26, 77.92], [78.27, 80.66], [81.26, 81.91], [82.26, 83.72], [84.32, 84.84], [85.19, 86.77], [87.12, 88.23]], "R": [["Too many people are asking you for things.", "Karen", "What's on your plate right now?", "The training plan, due Friday, slides for Greg, due Thursday, and a schedule for Megan. Could you help me prioritize?"], ["A colleague asks you for help, but you're too busy.", "Greg", "Could you make some slides for my client meeting?", "I'd love to help, but I'm focused on the training plan this week. Could your assistant take this one?"]]}, {"num": 22, "title": "Asking for a New Tool", "lines": [["S", "Karen, can I run something by you? I have an idea for the warehouse training.", "Larissa"], ["P", "Sure. I'm all ears.", "Karen"], ["S", "Right now, I'm tracking everything in spreadsheets. Who's attended, who's missed a session, who needs to reschedule. It's getting really complicated. There are six different files.", "Larissa"], ["P", "Six files? Yeah, that sounds painful.", "Karen"], ["S", "It is. So, I found an online tool that does all of this automatically. People can book their own sessions, and it sends them reminders. I think it would save me about five hours a week.", "Larissa"], ["P", "Interesting. How much does it cost?", "Karen"], ["S", "It's twelve dollars per user per month. We'd only need two users, so about three hundred dollars a year.", "Larissa"], ["P", "That's pretty reasonable. Have you checked with Kevin? IT has to approve any new software.", "Karen"], ["S", "Not yet. I wanted to ask you first.", "Larissa"], ["P", "Good call. Here's what I'd suggest. Put it in a short email. Explain the problem, the cost, and the time you'd save. Then I can forward it to my director, and Kevin can check the security side.", "Karen"], ["S", "How long should the email be?", "Larissa"], ["P", "Short. Half a page at most. People approve things faster when they can read them in one minute.", "Karen"], ["S", "Okay. And what if they say no?", "Larissa"], ["P", "Then we keep using the spreadsheets, and you tried. But honestly, I think you've made a good case. Five hours a week is a lot of your time.", "Karen"], ["S", "Thanks. I'll send it this afternoon.", "Larissa"], ["P", "Great. And Larissa, I like that you came with a solution, not just a problem. Keep doing that.", "Karen"]], "words": 255, "kind": "story", "scene": "Thursday, Karen's desk.", "F": "\"Can I run something by you?\" means \"can I ask your opinion?\" \"I'm all ears\" means \"I'm listening.\" \"You've made a good case\" means your reasons are convincing.", "V": "", "t": [[0.3, 2.41], [2.76, 4.8], [5.4, 5.92], [6.27, 7.14], [7.74, 10.67], [11.02, 14.54], [14.89, 16.6], [16.95, 18.39], [18.99, 19.88], [20.23, 21.66], [22.26, 22.9], [23.25, 27.14], [27.49, 31.16], [31.51, 33.93], [34.53, 35.35], [35.7, 36.96], [37.56, 39.55], [39.9, 43.64], [44.24, 45.53], [45.88, 47.15], [47.5, 49.66], [50.26, 50.92], [51.27, 52.57], [53.17, 53.88], [54.23, 55.56], [55.91, 57.25], [57.6, 60.6], [60.95, 65.3], [65.9, 67.34], [67.94, 68.56], [68.91, 70.19], [70.54, 73.94], [74.54, 75.11], [75.46, 76.68], [77.28, 79.73], [80.08, 82.48], [82.83, 85.18], [85.78, 86.36], [86.71, 88.13], [88.73, 89.36], [89.71, 93.96], [94.31, 95.3]], "R": [["You want to suggest a new tool to your manager.", "Karen", "Sure, I'm all ears. What's the idea?", "I'm tracking everything in six spreadsheets. I found a tool that would save about five hours a week. It costs about three hundred dollars a year."], ["Your manager asks you to put it in writing.", "Karen", "Can you put that in a short email for my director?", "Of course. I'll keep it to half a page: the problem, the cost, and the time we'd save."]]}, {"num": 23, "title": "Working from Home", "lines": [["S", "Karen, I wanted to ask about working from home. Is that possible here?", "Larissa"], ["P", "Absolutely. Most of the team works a hybrid schedule. What were you thinking?", "Karen"], ["S", "Maybe two days a week? My commute is almost an hour each way. On those days, I could start earlier and get more done.", "Larissa"], ["P", "Two days sounds fine. The only rule is that everyone's in the office on Tuesdays and Thursdays. That's when we have most of our meetings.", "Karen"], ["S", "So, Mondays and Fridays at home?", "Larissa"], ["P", "That works. Just a few things to keep in mind. Our core hours are ten to three. During that time, you need to be reachable on Slack and your phone.", "Karen"], ["S", "Of course. What if I have to step away, like for a delivery or an appointment?", "Larissa"], ["P", "Totally fine. Just set your status on Slack. Something like \"Back in thirty minutes.\" People only worry when someone disappears without saying anything.", "Karen"], ["S", "That makes sense. Do I need to keep my camera on during video calls?", "Larissa"], ["P", "For team meetings, yes, please. It really helps. For big company meetings, it's up to you.", "Karen"], ["S", "Okay. And should I tell Kevin?", "Larissa"], ["P", "Yes. Ask him about a second monitor for home. The company will pay for one.", "Karen"], ["S", "Oh, that's great. I've been using my laptop screen only, and it's so small.", "Larissa"], ["P", "No wonder you've been getting headaches. Okay, let's start next Monday. We'll check in after a month and see how it's going.", "Karen"], ["S", "Perfect. Thank you so much.", "Larissa"]], "words": 242, "kind": "story", "scene": "Friday, Karen's office.", "F": "A \"hybrid\" schedule mixes office days and home days. \"Core hours\" are the hours when everyone must be available. \"Step away\" means leave your desk for a short time.", "V": "", "t": [[0.3, 3.09], [3.44, 4.64], [5.24, 6.14], [6.49, 8.7], [9.05, 10.1], [10.7, 11.91], [12.26, 14.66], [15.01, 18.1], [18.7, 19.91], [20.26, 24.32], [24.67, 26.53], [27.13, 29.09], [29.69, 30.47], [30.82, 32.62], [32.97, 34.72], [35.07, 38.73], [39.33, 40.02], [40.37, 44.19], [44.79, 45.71], [46.06, 47.77], [48.12, 50.08], [50.43, 54.21], [54.81, 55.71], [56.06, 58.85], [59.45, 61.17], [61.52, 62.48], [62.83, 65.05], [65.65, 66.23], [66.58, 67.72], [68.32, 68.91], [69.26, 71.33], [71.68, 73.14], [73.74, 74.77], [75.12, 78.51], [79.11, 80.91], [81.26, 83.06], [83.41, 85.98], [86.58, 87.22], [87.57, 88.59]], "R": [["You want to ask about working from home.", "Karen", "What were you thinking?", "Maybe two days a week, Mondays and Fridays? My commute is almost an hour each way."], ["Your manager explains the rules for home days.", "Karen", "You need to be reachable during core hours, ten to three.", "No problem. If I need to step away, I'll set my status on Slack."]]}, {"num": 24, "title": "Just Checking In", "lines": [["P", "Hi, Larissa. Just checking in. How's your first work-from-home day going?", "Karen"], ["S", "Oh, hi, Karen! It's going well, thanks. I've been working on the training materials all morning.", "Larissa"], ["P", "Great. I won't keep you long. I just wanted to see if you needed anything.", "Karen"], ["S", "No, I'm fine. Actually, is everything okay? You don't usually call.", "Larissa"], ["P", "Everything's totally fine! I do this with everyone on their first remote day. It's easy to feel a bit disconnected at home.", "Karen"], ["S", "Oh, good. I was worried you thought I wasn't working.", "Larissa"], ["P", "Not at all. Honestly, I trust you. If I didn't, you wouldn't be working from home. So, how are the materials coming along?", "Karen"], ["S", "Good. I've finished the first two modules. I'm stuck on the third one, though. I'm not sure how much detail to include about the safety rules.", "Larissa"], ["P", "Hmm. That's a question for Priya. She knows exactly what we're legally required to cover.", "Karen"], ["S", "Okay. Should I email her, or would a call be better?", "Larissa"], ["P", "For something like this, a quick call is better. Just send her a message first and ask if she's got ten minutes. It's more polite than calling out of the blue.", "Karen"], ["S", "Right. I'll do that after lunch.", "Larissa"], ["P", "Perfect. Oh, and one more thing. Don't forget to take a real lunch break. When people work from home, they often eat at their desk.", "Karen"], ["S", "Too late. I'm eating right now.", "Larissa"], ["P", "Ha! Okay, well, tomorrow, then. Talk soon.", "Karen"], ["S", "Talk soon. Thanks, Karen.", "Larissa"]], "words": 239, "kind": "story", "scene": "Monday, 11 a.m., a video call.", "F": "\"Just checking in\" is a friendly way to ask how things are going. It doesn't mean there's a problem. \"Coming along\" means progressing. \"Out of the blue\" means without warning.", "V": "", "t": [[0.3, 1.22], [1.57, 2.59], [2.94, 5.04], [5.64, 6.76], [7.11, 8.41], [8.76, 11.35], [11.95, 12.58], [12.93, 14.12], [14.47, 16.56], [17.16, 18.2], [18.55, 20.38], [20.73, 21.89], [22.49, 23.97], [24.32, 27.11], [27.46, 29.79], [30.39, 31.06], [31.41, 33.44], [34.04, 34.83], [35.18, 36.53], [36.88, 39.22], [39.57, 41.71], [42.31, 42.78], [43.13, 44.84], [45.19, 46.73], [47.08, 50.51], [51.11, 51.58], [51.93, 53.39], [53.74, 56.91], [57.51, 58.08], [58.43, 60.89], [61.49, 63.82], [64.17, 67.58], [67.93, 70.09], [70.69, 71.22], [71.57, 72.78], [73.38, 74.07], [74.42, 75.78], [76.13, 78.24], [78.59, 81.66], [82.26, 82.91], [83.26, 84.34], [84.94, 85.46], [85.81, 87.37], [87.72, 88.51], [89.11, 89.87], [90.22, 91.07]], "R": [["Your manager calls on your first day working from home.", "Karen", "Hi! Just checking in. How's it going?", "Hi, Karen! It's going well, thanks. I've been working on the training materials all morning."], ["You need to call a colleague you don't usually call.", "Priya", "Hi Larissa, what's up?", "Hi Priya. Have you got ten minutes for a quick call? I have a question about the safety rules for the training."]]}, {"num": 25, "title": "\"Make It Pop\"", "lines": [["P", "Larissa, I read the training presentation. It's a great start. I'd just like it to be a bit more high-level, and can you make it pop?", "Karen"], ["S", "Sure. Um, sorry, can I ask what you mean exactly? I want to make sure I get it right.", "Larissa"], ["P", "Of course. Good question. By high-level, I mean less detail. Right now, each slide has a lot of text. The warehouse team doesn't need to know everything about the system. They just need the main ideas.", "Karen"], ["S", "Okay. So, fewer words on each slide?", "Larissa"], ["P", "Exactly. Try to keep it to three or four points per slide. You can put the details in the notes, and say them out loud during the session.", "Karen"], ["S", "Got it. And \"make it pop\"?", "Larissa"], ["P", "Sorry, that's a terrible expression. I mean make it more interesting to look at. Right now, it's mostly text on a white background. Add some photos of the warehouse, or some simple diagrams.", "Karen"], ["S", "Oh, I see. Megan's team took photos last week. I could use some of those.", "Larissa"], ["P", "Perfect. That would be great. It'll look more real to the team.", "Karen"], ["S", "How many slides should there be in total?", "Larissa"], ["P", "Ideally, around fifteen. Right now, there are thirty-two, I think.", "Karen"], ["S", "Thirty-four, actually.", "Larissa"], ["P", "Right. So, about half. Don't worry, it's normal. Everyone includes too much in the first draft.", "Karen"], ["S", "Okay. When would you like the new version?", "Larissa"], ["P", "No rush. Monday's fine. And thanks for asking. Most people just guess, and then we do it three times.", "Karen"], ["S", "I'd rather ask once than redo it three times.", "Larissa"]], "words": 254, "kind": "story", "scene": "Wednesday, Karen's office.", "F": "\"High-level\" means only the main ideas, without detail. \"Make it pop\" means make it more exciting to look at. Notice how Larissa asks for clarification: \"Sorry, can I ask what you mean exactly?\"", "V": "", "t": [[0.3, 2.81], [3.16, 4.27], [4.62, 8.17], [8.77, 9.25], [9.6, 12.43], [12.78, 14.32], [14.92, 15.66], [16.01, 16.94], [17.29, 19.32], [19.67, 21.99], [22.34, 25.71], [26.06, 27.66], [28.26, 28.84], [29.19, 31.01], [31.61, 32.42], [32.77, 35.29], [35.64, 39.7], [40.3, 40.88], [41.23, 42.17], [42.77, 44.78], [45.13, 47.1], [47.45, 50.22], [50.57, 54.05], [54.65, 55.44], [55.79, 57.83], [58.18, 59.4], [60.0, 60.69], [61.04, 62.04], [62.39, 64.01], [64.61, 66.53], [67.13, 68.71], [69.06, 71.01], [71.61, 72.96], [73.56, 74.14], [74.49, 75.49], [75.84, 77.19], [77.54, 79.9], [80.5, 81.08], [81.43, 82.97], [83.57, 84.34], [84.69, 85.63], [85.98, 87.23], [87.58, 90.51], [91.11, 93.54]], "R": [["Your manager gives feedback you don't fully understand.", "Karen", "Could you make it more high-level?", "Sure. Sorry, can I ask what you mean exactly? Fewer details on each slide?"], ["Your manager uses an expression.", "Karen", "And can you make it pop?", "Just to check, do you mean make it more interesting to look at, with photos or diagrams?"]]}, {"num": 26, "title": "When the Manager Makes a Mistake", "lines": [["S", "Karen, do you have a minute? It's about the report you sent this morning.", "Larissa"], ["P", "Sure. Is something wrong?", "Karen"], ["S", "Maybe. I might be wrong, but I think one of the numbers doesn't match. On page two, it says the warehouse team has eighty people. But in the HR list, it's sixty-eight.", "Larissa"], ["P", "Oh no. Really? Let me check. Hmm, you're right. I used last year's number. Some people moved to the Surrey site in the spring.", "Karen"], ["S", "That's what I thought. I just wanted to check before I used the report for the training plan.", "Larissa"], ["P", "I'm glad you did. This report went to the director this morning. The budget is based on eighty people.", "Karen"], ["S", "Oh. So, the budget is too big?", "Larissa"], ["P", "Yes, by about fifteen percent. Which is better than too small, but still. I need to fix it.", "Karen"], ["S", "I'm sorry. I didn't want to cause a problem.", "Larissa"], ["P", "You didn't cause it, Larissa. I did. You found it. That's a big difference. And thank you for telling me privately, instead of replying to everyone on the email.", "Karen"], ["S", "Of course. I would never do that.", "Larissa"], ["P", "You'd be surprised how many people do. Okay, I'll send a corrected version this afternoon. Would you mind double-checking the other numbers before I send it?", "Karen"], ["S", "Not at all. I can do that right now.", "Larissa"], ["P", "Thank you. And next time you see something like this, please tell me right away. Don't worry about how it looks. I'd much rather know.", "Karen"], ["S", "I will. I promise.", "Larissa"]], "words": 245, "kind": "story", "scene": "Thursday, Karen's office.", "F": "\"I might be wrong, but\" softens bad news. Listen for \"eighty\" and \"sixty-eight.\" \"Would you mind double-checking?\" is a polite request; \"Not at all\" means \"yes, happy to.\"", "V": "", "t": [[0.3, 1.76], [2.11, 4.08], [4.68, 5.2], [5.55, 6.52], [7.12, 7.71], [8.06, 11.33], [11.68, 15.21], [15.56, 17.6], [18.2, 18.81], [19.16, 19.77], [20.12, 20.97], [21.32, 22.23], [22.58, 24.09], [24.44, 26.97], [27.57, 28.57], [28.92, 32.73], [33.33, 34.41], [34.76, 37.2], [37.55, 39.63], [40.23, 40.65], [41.0, 42.49], [43.09, 44.86], [45.21, 47.28], [47.63, 48.71], [49.31, 50.02], [50.37, 51.95], [52.55, 53.94], [54.29, 54.92], [55.27, 56.1], [56.45, 57.68], [58.03, 62.77], [63.37, 64.06], [64.41, 65.47], [66.07, 68.16], [68.51, 71.49], [71.84, 75.36], [75.96, 76.7], [77.05, 78.26], [78.86, 79.55], [79.9, 83.26], [83.61, 85.07], [85.42, 86.56], [87.16, 87.73], [88.08, 88.87]], "R": [["You notice a mistake in your manager's report.", "Karen", "Sure, I have a minute. What's up?", "I might be wrong, but I think one number doesn't match. The report says eighty people, but the HR list says sixty-eight."], ["Your manager asks you to check something.", "Karen", "Would you mind double-checking the other numbers?", "Not at all. I can do that right now and send you any changes."]]}, {"num": 27, "title": "Asking for Time Off", "lines": [["S", "Karen, I wanted to talk to you about some time off. My parents are coming from Brazil in March.", "Larissa"], ["P", "Oh, that's wonderful! Is it their first time in Canada?", "Karen"], ["S", "Yes, their first time. I'm so excited. I'd like to take a week off while they're here, if possible. From the tenth to the fourteenth.", "Larissa"], ["P", "Let me think. March is usually fine. The only busy time is the end of the quarter, the last two weeks of March. Your dates are before that, so that works.", "Karen"], ["S", "Great. What do I need to do? Is there a form?", "Larissa"], ["P", "You just put the request in the HR system. I'll get a notification, and I'll approve it. It usually takes a day or two.", "Karen"], ["S", "Okay. And is it okay that I'm asking so early? It's still December.", "Larissa"], ["P", "It's perfect, actually. The more notice, the better. Some people ask two weeks before, and that's harder, especially in summer.", "Karen"], ["S", "Good to know. And while I'm away, who should cover my work?", "Larissa"], ["P", "That's a great question. About a week before you leave, write a handover note. What's in progress, who to contact, and anything urgent. Rodrigo can probably be your backup.", "Karen"], ["S", "I'll ask him. And should I check my emails while I'm on vacation?", "Larissa"], ["P", "Please don't. Set an out-of-office message, and enjoy your parents. If there's a real emergency, we'll text you. But there won't be.", "Karen"], ["S", "Thank you, Karen. My mother will be very happy to hear that.", "Larissa"], ["P", "Tell her I said welcome to Vancouver. And bring an umbrella. It's March.", "Karen"]], "words": 254, "kind": "story", "scene": "December, Karen's office.", "F": "\"Notice\" is the warning you give before time off. A \"handover note\" explains your work to the person covering for you. An \"out-of-office message\" is the automatic email reply you set while you're away.", "V": "", "t": [[0.3, 3.19], [3.54, 6.08], [6.68, 7.85], [8.2, 9.99], [10.59, 12.01], [12.36, 13.35], [13.7, 16.72], [17.07, 18.52], [19.12, 19.96], [20.31, 21.76], [22.11, 26.25], [26.6, 28.68], [29.28, 29.86], [30.21, 31.22], [31.57, 32.47], [33.07, 35.41], [35.76, 38.07], [38.42, 40.05], [40.65, 41.23], [41.58, 43.76], [44.11, 45.17], [45.77, 47.13], [47.48, 48.93], [49.28, 53.49], [54.09, 54.81], [55.16, 57.57], [58.17, 59.41], [59.76, 62.63], [62.98, 66.1], [66.45, 68.79], [69.39, 70.18], [70.53, 73.6], [74.2, 75.03], [75.38, 78.38], [78.73, 81.08], [81.43, 82.49], [83.09, 84.03], [84.38, 86.44], [87.04, 89.14], [89.49, 90.63], [90.98, 91.76]], "R": [["You want to ask for a week of vacation.", "Karen", "What dates were you thinking?", "From March tenth to the fourteenth, if possible. My parents are visiting from Brazil."], ["Your manager asks who will cover your work.", "Karen", "Who can cover for you while you're away?", "I'll write a handover note a week before I leave. I'll ask Rodrigo if he can be my backup."]]}, {"num": 28, "title": "Talking About the Future", "lines": [["P", "So, Larissa, you've been here almost four months now. I'd like to use today's one-on-one to talk about the future. Where do you see yourself in, say, two or three years?", "Karen"], ["S", "Honestly, I'd love to become a project manager. Not just coordinating, but leading bigger projects from start to finish.", "Larissa"], ["P", "That's great to hear. I think you'd be really good at it. What do you think you need to get there?", "Karen"], ["S", "Two things, I think. More experience leading projects, and a certification. A lot of project manager jobs ask for the PMP.", "Larissa"], ["P", "Right. The PMP is well respected. Did you know we have a professional development budget? Each person gets up to two thousand dollars a year for courses and certifications.", "Karen"], ["S", "Really? I had no idea.", "Larissa"], ["P", "It's in the benefits booklet, but nobody reads that. The PMP course and exam would probably fit in the budget.", "Karen"], ["S", "That would be amazing. How do I apply?", "Larissa"], ["P", "Send me the details of the course, and I'll approve it. The only condition is that it's related to your job, and this definitely is.", "Karen"], ["S", "And what about the experience? The warehouse project is almost finished.", "Larissa"], ["P", "I've been thinking about that. There's a new client project starting next month. It's bigger, and I'd like you to lead it. With my support, of course.", "Karen"], ["S", "Wow. Me? Leading it?", "Larissa"], ["P", "You. You've earned it. But let's not get ahead of ourselves. First, finish the warehouse training. Then we'll talk details.", "Karen"], ["S", "Thank you, Karen. I won't let you down.", "Larissa"]], "words": 249, "kind": "story", "scene": "January, Karen's office.", "F": "\"Where do you see yourself in three years?\" is a common career question. The PMP is a project management certification. \"Let's not get ahead of ourselves\" means \"let's not plan too far ahead yet.\"", "V": "", "t": [[0.3, 3.13], [3.48, 6.56], [6.91, 9.73], [10.33, 13.36], [13.71, 17.91], [18.51, 19.59], [19.94, 21.63], [21.98, 23.5], [24.1, 25.12], [25.47, 28.77], [29.12, 32.52], [33.12, 33.69], [34.04, 35.95], [36.3, 39.14], [39.49, 44.24], [44.84, 45.39], [45.74, 46.72], [47.32, 50.17], [50.52, 54.46], [55.06, 56.11], [56.46, 57.45], [58.05, 60.81], [61.16, 65.54], [66.14, 67.62], [67.97, 70.07], [70.67, 72.06], [72.41, 74.95], [75.3, 77.29], [77.64, 79.08], [79.68, 80.15], [80.5, 80.97], [81.32, 81.99], [82.59, 83.09], [83.44, 84.25], [84.6, 86.36], [86.71, 88.62], [88.97, 90.37], [90.97, 91.91], [92.26, 93.24]], "R": [["Your manager asks about your career goals.", "Karen", "Where do you see yourself in two or three years?", "I'd love to become a project manager, leading bigger projects from start to finish."], ["Your manager asks what you need to get there.", "Karen", "What do you think you need to get there?", "More experience leading projects, and a certification like the PMP. Is there any support for courses?"]]}]}, {"part": 4, "title": "Feedback and Reviews", "desc": "Compliments, criticism, self-assessments, and the annual review.", "scripts": [{"num": 29, "title": "Taking a Compliment", "lines": [["P", "There she is! Larissa, I just got off the phone with Dave. He said the last training session was the best one they've ever had.", "Greg"], ["S", "Oh, really? Well, it was nothing, really. Kevin set up the laptops, and Priya helped with the safety part. I just organized it.", "Larissa"], ["P", "Just organized it? You planned six sessions for sixty-eight people and nobody missed one. That's not nothing.", "Greg"], ["P", "Larissa, can I give you some friendly advice?", "Megan"], ["S", "Of course.", "Larissa"], ["P", "When someone gives you a compliment here, just say \"thank you.\" You don't need to give the credit to everyone else.", "Megan"], ["S", "Really? In Brazil, if you accept a compliment too easily, people might think you're arrogant.", "Larissa"], ["P", "I get that. But here, if you keep saying \"it was nothing,\" people might start to believe you. Especially managers.", "Megan"], ["P", "She's right. Trust me, I've been doing this for twenty years. The people who get promoted are the ones who let others know what they've done.", "Greg"], ["S", "So, what should I say?", "Larissa"], ["P", "Something like, \"Thank you, I'm really happy with how it went. And the team was great.\" That way, you accept it, and you still thank the others.", "Megan"], ["S", "Okay, let me try. Greg, thank you. I'm really happy with how it went. Kevin and Priya were a big help.", "Larissa"], ["P", "Perfect. See? Doesn't hurt at all.", "Greg"], ["S", "It feels a little strange, honestly.", "Larissa"], ["P", "It gets easier. And for the record, I've heard good things about you from three different people this week.", "Megan"], ["S", "Thank you, Megan. That means a lot.", "Larissa"], ["P", "Much better.", "Megan"]], "words": 250, "kind": "story", "scene": "January, the team area.", "F": "\"That's not nothing\" means \"that's important.\" To \"give credit\" means to say who deserves praise. Practise Megan's model: \"Thank you, I'm really happy with how it went.\"", "V": "", "t": [[0.3, 1.28], [1.63, 4.39], [4.74, 8.86], [9.46, 10.17], [10.52, 11.89], [12.24, 16.03], [16.38, 17.58], [18.18, 19.55], [19.9, 24.4], [24.75, 25.9], [26.5, 29.1], [29.7, 30.39], [30.99, 33.98], [34.33, 36.6], [37.2, 37.75], [38.1, 43.27], [43.87, 44.75], [45.1, 49.29], [49.64, 50.98], [51.58, 52.43], [52.78, 55.53], [55.88, 60.21], [60.81, 61.94], [62.54, 65.79], [66.14, 67.42], [67.77, 70.51], [71.11, 72.53], [72.88, 73.92], [74.27, 75.88], [76.23, 78.09], [78.69, 79.47], [79.82, 80.4], [80.75, 82.03], [82.63, 84.55], [85.15, 86.17], [86.52, 90.93], [91.53, 92.41], [92.76, 93.71], [94.31, 95.18]], "R": [["A colleague gives you a compliment.", "Greg", "The training was the best one they've ever had. Great job!", "Thank you! I'm really happy with how it went. And Kevin and Priya were a big help."], ["Someone praises your presentation.", "Susan", "That was a very clear presentation.", "Thank you, Susan. I'm glad it was useful."]]}, {"num": 30, "title": "A Bit of Feedback", "lines": [["P", "Larissa, have you got a minute? I'd like to give you a bit of feedback.", "Karen"], ["S", "Of course. Is something wrong?", "Larissa"], ["P", "No, nothing's wrong. Overall, you're doing a great job. The warehouse training was a big success, and everyone likes working with you. There's just one small thing I'd love to see you work on.", "Karen"], ["S", "Okay. What is it?", "Larissa"], ["P", "Your emails. They're very polite, which is great. But they're often quite long, and they start with a lot of apologies. For example, \"I'm so sorry to bother you, I know you're very busy, but I was wondering if maybe...\"", "Karen"], ["S", "Oh. Yes, I do write like that.", "Larissa"], ["P", "The problem is that people are busy, and they might miss the important part. Also, when you apologize a lot, it can make you sound less confident than you actually are.", "Karen"], ["S", "That makes sense. So, what should I write instead?", "Larissa"], ["P", "Put the request in the first sentence. \"Hi Dave, could you send me the attendance list by Friday?\" Then add any details below. You can still be friendly. Just be direct first.", "Karen"], ["S", "I think in Portuguese, that would sound a bit rude.", "Larissa"], ["P", "I understand. But here, it just sounds clear. People will appreciate it.", "Karen"], ["S", "Okay. I'll try that this week.", "Larissa"], ["P", "Great. And please don't take this the wrong way. It's a small thing, and it's easy to fix.", "Karen"], ["S", "No, I appreciate it. I'd rather know.", "Larissa"], ["P", "I knew you'd say that. That's one of the things I like about working with you.", "Karen"]], "words": 246, "kind": "story", "scene": "February, Karen's office.", "F": "Karen starts with praise, gives one clear point, and ends positively. \"One small thing I'd love to see you work on\" introduces criticism gently. \"Don't take this the wrong way\" means \"don't be offended.\"", "V": "", "t": [[0.3, 1.98], [2.33, 4.04], [4.64, 5.34], [5.69, 6.62], [7.22, 8.43], [8.78, 10.72], [11.07, 15.13], [15.48, 18.67], [19.27, 19.85], [20.2, 20.86], [21.46, 22.31], [22.66, 24.58], [24.93, 28.52], [28.87, 34.53], [35.13, 35.55], [35.9, 37.47], [38.07, 42.24], [42.59, 47.99], [48.59, 49.49], [49.84, 51.5], [52.1, 53.99], [54.34, 57.52], [57.87, 59.6], [59.95, 61.32], [61.67, 63.02], [63.62, 66.53], [67.13, 68.07], [68.42, 70.06], [70.41, 71.8], [72.4, 72.98], [73.33, 74.49], [75.09, 75.72], [76.07, 78.2], [78.55, 80.86], [81.46, 82.77], [83.12, 83.94], [84.54, 85.71], [86.06, 88.65]], "R": [["Your manager gives you some feedback.", "Karen", "There's one small thing I'd love to see you work on. Your emails are a bit long.", "Thanks for telling me. I'll put the main request in the first sentence from now on."], ["Your manager checks how you feel about the feedback.", "Karen", "Please don't take this the wrong way.", "Not at all. I appreciate it. I'd rather know."]]}, {"num": 31, "title": "What \"A Good Start\" Means", "lines": [["S", "Rodrigo, can I ask you something? I'm trying to understand the feedback people give here.", "Larissa"], ["P", "Oh, this is my favourite topic. What happened?", "Rodrigo"], ["S", "I sent my presentation to Greg, and he said, \"It's a good start.\" Is that good or bad?", "Larissa"], ["P", "Hmm. Honestly, it usually means it needs a lot more work.", "Rodrigo"], ["S", "Really? But \"good\" is in the sentence!", "Larissa"], ["P", "I know. That's the tricky part. In Canadian offices, people often put criticism inside something positive. So you have to listen for the hidden message.", "Rodrigo"], ["S", "Can you give me some examples?", "Larissa"], ["P", "Sure. \"Have you thought about...\" usually means \"You should do this.\" \"I'd maybe consider...\" means \"Please change this.\" And \"Interesting\" can mean \"I don't like it.\"", "Rodrigo"], ["S", "Interesting.", "Larissa"], ["P", "Ha! Exactly. Another one is \"Just a small thing.\" Sometimes it really is small. But sometimes, it's the biggest problem.", "Rodrigo"], ["S", "So how do I know which one it is?", "Larissa"], ["P", "Listen to what comes after \"but.\" And watch their face. If they smile and say \"but\" very slowly, it's serious.", "Rodrigo"], ["S", "This is so different from Brazil. There, if my manager didn't like something, I knew immediately.", "Larissa"], ["P", "I know. It took me a year to get used to it. The good news is that you can always ask. Like, \"Thanks. What would you change first?\" Then they have to be specific.", "Rodrigo"], ["S", "That's a great question. I'll ask Greg right now.", "Larissa"], ["P", "Good. And tell me what he says. I'll translate.", "Rodrigo"]], "words": 234, "kind": "story", "scene": "February, Rodrigo's desk.", "F": "Indirect criticism: \"It's a good start\" (needs more work), \"Have you thought about…\" (do this), \"Interesting\" (sometimes \"I don't like it\"). A useful reply: \"What would you change first?\"", "V": "", "t": [[0.3, 2.33], [2.68, 5.35], [5.95, 7.6], [7.95, 8.73], [9.33, 13.56], [13.91, 15.03], [15.63, 16.19], [16.54, 19.64], [20.24, 20.79], [21.14, 22.65], [23.25, 23.91], [24.26, 25.42], [25.77, 30.79], [31.14, 33.2], [33.8, 35.28], [35.88, 36.48], [36.83, 37.97], [38.32, 40.16], [40.51, 41.72], [42.07, 43.58], [43.93, 46.12], [46.72, 47.5], [48.1, 48.64], [48.99, 49.76], [50.11, 51.99], [52.34, 53.78], [54.13, 56.1], [56.7, 58.41], [59.01, 60.62], [60.97, 62.07], [62.42, 65.37], [65.97, 67.52], [67.87, 71.58], [72.18, 72.84], [73.19, 75.01], [75.36, 77.47], [77.82, 78.71], [79.06, 80.39], [80.74, 82.12], [82.72, 83.87], [84.22, 85.54], [86.14, 86.68], [87.03, 88.25], [88.6, 89.56]], "R": [["A colleague reviews your work.", "Greg", "It's a good start.", "Thanks, Greg. What would you change first?"], ["Your colleague makes an indirect suggestion.", "Greg", "Have you thought about adding a summary at the top?", "Good idea. I'll add a summary at the top and send you the new version."]]}, {"num": 32, "title": "Asking for Feedback", "lines": [["S", "Megan, thanks for making time. Now that the training videos are finished, I wanted to ask for some feedback.", "Larissa"], ["P", "Sure. On the project, or on you?", "Megan"], ["S", "On me, mainly. How I worked with your team. Please be honest. I really want to improve.", "Larissa"], ["P", "Okay, you asked for it. I'll give you one thing that went really well, and one thing to work on. Is that okay?", "Megan"], ["S", "Perfect.", "Larissa"], ["P", "What went well: you were super organized. Every filming day had a clear schedule, and you always knew who needed to be where. My team loved that.", "Megan"], ["S", "Thank you. I'm glad it helped.", "Larissa"], ["P", "Now, the thing to work on. Sometimes you agreed to changes too quickly. When Greg asked to move the filming dates, you said yes right away, without checking with me. It meant my team had to rearrange their whole week.", "Megan"], ["S", "Oh. You're right. I'm sorry. I didn't realize it caused so many problems.", "Larissa"], ["P", "It's okay. It all worked out in the end. But next time, before you say yes, it's fine to say, \"Let me check with Megan's team and get back to you.\"", "Megan"], ["S", "That's a good phrase. I think I was worried about saying no to Greg.", "Larissa"], ["P", "Everyone is. But you're not saying no. You're just saying \"not yet.\" It gives you time to think.", "Megan"], ["S", "That makes sense. Thank you, Megan. This is really useful.", "Larissa"], ["P", "Anytime. And honestly, for someone who's been here five months, you're doing great. I'd work with you again in a heartbeat.", "Megan"], ["S", "I'd like that too.", "Larissa"]], "words": 251, "kind": "story", "scene": "February, a small meeting room.", "F": "\"You asked for it\" is a joke meaning \"okay, I'll be honest.\" \"Get back to you\" means reply later. \"In a heartbeat\" means immediately, without thinking twice.", "V": "", "t": [[0.3, 2.27], [2.62, 6.86], [7.46, 8.04], [8.39, 9.9], [10.5, 11.28], [11.63, 12.97], [13.32, 14.27], [14.62, 15.99], [16.59, 17.92], [18.27, 21.82], [22.17, 23.17], [23.77, 24.41], [25.01, 27.26], [27.61, 31.99], [32.34, 33.6], [34.2, 34.85], [35.2, 36.17], [36.77, 38.18], [38.53, 41.07], [41.42, 46.36], [46.71, 49.36], [49.96, 50.38], [50.73, 51.41], [51.76, 52.46], [52.81, 55.21], [55.81, 56.66], [57.01, 58.46], [58.81, 64.77], [65.37, 66.45], [66.8, 69.18], [69.78, 70.74], [71.09, 72.34], [72.69, 74.13], [74.48, 75.87], [76.47, 77.36], [77.71, 78.59], [78.94, 80.11], [80.71, 81.49], [81.84, 85.69], [86.04, 88.12], [88.72, 89.7]], "R": [["You want feedback from a colleague after a project.", "Megan", "Sure. On the project, or on you?", "On me, mainly. How was I to work with? Please be honest. I really want to improve."], ["Someone asks you to change plans without warning.", "Greg", "Can we move the filming to next Tuesday?", "Let me check with Megan's team and get back to you today."]]}, {"num": 33, "title": "Giving Feedback to a Colleague", "lines": [["S", "Rodrigo, do you have a minute? There's something I want to talk to you about.", "Larissa"], ["P", "Uh-oh. That sounds serious.", "Rodrigo"], ["S", "It's not serious, I promise. It's about the weekly reports for the new client project. I need the data from you on Wednesdays, so I can finish the report on Thursday.", "Larissa"], ["P", "Right. I know I've been a bit late.", "Rodrigo"], ["S", "The last three weeks, it arrived on Thursday afternoon. So I had to rush, and last week, the report went out late. The client noticed.", "Larissa"], ["P", "Oh no. I didn't know the client noticed. I'm really sorry, Larissa.", "Rodrigo"], ["S", "I know you're very busy. I'm not upset. I just want to find a solution that works for both of us.", "Larissa"], ["P", "I appreciate that. Honestly, the problem is that I get the numbers from finance on Wednesday morning, and they're often late too.", "Rodrigo"], ["S", "Oh, I didn't know that. So, it's not really your fault.", "Larissa"], ["P", "Partly it is. I could send you the first part on Wednesday, and the finance numbers when I get them.", "Rodrigo"], ["S", "That would help a lot. Or maybe we could ask finance to send them on Tuesday?", "Larissa"], ["P", "That's a good idea. Let's ask them together. They'll listen more if it's a client issue.", "Rodrigo"], ["S", "Perfect. Thank you for being so understanding.", "Larissa"], ["P", "Are you kidding? Thank you for telling me directly, and not complaining to Karen.", "Rodrigo"], ["S", "I learned that from you. You said people here don't always say things to your face. I wanted to be different.", "Larissa"], ["P", "Good. Now I'm the one learning from you.", "Rodrigo"]], "words": 251, "kind": "story", "scene": "February, the kitchen.", "F": "Notice Larissa's steps: the facts, the effect (\"the client noticed\"), then \"a solution that works for both of us.\" \"Are you kidding?\" here means \"no, thank you!\"", "V": "", "t": [[0.3, 2.01], [2.36, 4.75], [5.35, 5.96], [6.31, 7.42], [8.02, 9.7], [10.05, 12.91], [13.26, 18.0], [18.6, 19.17], [19.52, 20.92], [21.52, 24.67], [25.02, 28.55], [28.9, 29.9], [30.5, 31.14], [31.49, 33.01], [33.36, 34.77], [35.37, 36.49], [36.84, 37.74], [38.09, 41.18], [41.78, 42.85], [43.2, 49.58], [50.18, 51.48], [51.83, 53.48], [54.08, 54.92], [55.27, 59.9], [60.5, 61.51], [61.86, 65.18], [65.78, 66.83], [67.18, 68.41], [68.76, 70.67], [71.27, 71.91], [72.26, 74.29], [74.89, 75.76], [76.11, 79.7], [80.3, 81.37], [81.72, 85.02], [85.37, 86.63], [87.23, 87.77], [88.12, 89.65]], "R": [["You need to talk to a colleague about late work.", "Rodrigo", "Uh-oh. That sounds serious.", "It's not serious, I promise. The data has been late for three weeks, and the client noticed. Can we find a solution that works for both of us?"], ["Your colleague explains why he's late.", "Rodrigo", "Finance sends me the numbers late too.", "Oh, I didn't know that. Maybe we could ask finance together to send them on Tuesday?"]]}, {"num": 34, "title": "How Reviews Work", "lines": [["P", "Hi, Larissa. Thanks for coming in. So, as you know, the annual review cycle starts next month. Everyone does their review in March, even people who started recently.", "Priya"], ["S", "Even me? I've only been here six months.", "Larissa"], ["P", "Even you. Don't worry, it's a shorter version for newer employees. I just want to walk you through the process.", "Priya"], ["S", "Great. What are the steps?", "Larissa"], ["P", "There are three. First, you fill out a self-assessment. That's a form where you describe what you've achieved, and rate yourself in five areas. Second, Karen writes her own assessment. And third, you meet with her to discuss both.", "Priya"], ["S", "How do I rate myself? Is there a scale?", "Larissa"], ["P", "Yes, there are four levels: developing, meeting expectations, exceeding expectations, and outstanding. Most people are meeting expectations in most areas. That's a good result, by the way. It's not like a school grade.", "Priya"], ["S", "Oh, that's good to know. I would have thought \"meeting expectations\" was just okay.", "Larissa"], ["P", "A lot of people think that. It actually means you're doing your job well.", "Priya"], ["S", "And is the review connected to a raise?", "Larissa"], ["P", "Partly, yes. Salary increases happen in April, and they're based on the review and on the company's results. But I can't promise anything specific.", "Priya"], ["S", "Of course. When is the self-assessment due?", "Larissa"], ["P", "March seventh. I'll send you the form and a guide with examples today.", "Priya"], ["S", "Thank you. This is really clear.", "Larissa"], ["P", "My pleasure. And if you have questions while you're writing, just send me a message.", "Priya"]], "words": 243, "kind": "story", "scene": "February, a small meeting room.", "F": "A \"self-assessment\" is a form where you evaluate your own work. \"Meeting expectations\" means you're doing your job well, not just okay. \"Walk you through\" means explain step by step.", "V": "", "t": [[0.3, 1.25], [1.6, 2.71], [3.06, 6.46], [6.81, 10.95], [11.55, 12.24], [12.59, 14.13], [14.73, 15.55], [15.9, 18.83], [19.18, 21.31], [21.91, 22.49], [22.84, 23.76], [24.36, 25.24], [25.59, 27.39], [27.74, 32.41], [32.76, 34.77], [35.12, 37.27], [37.87, 39.03], [39.38, 40.33], [40.93, 46.99], [47.34, 50.49], [50.84, 52.35], [52.7, 54.21], [54.81, 56.14], [56.49, 59.78], [60.38, 61.81], [62.16, 64.28], [64.88, 66.91], [67.51, 68.4], [68.75, 74.02], [74.37, 76.34], [76.94, 77.63], [77.98, 79.67], [80.27, 81.18], [81.53, 84.48], [85.08, 85.72], [86.07, 87.16], [87.76, 88.59], [88.94, 92.3]], "R": [["HR explains the review process.", "Priya", "Most people are meeting expectations in most areas.", "That's good to know. So \"meeting expectations\" means I'm doing my job well?"], ["You want to know the deadline.", "Priya", "Any questions about the self-assessment?", "Just one. When is it due, and is there a guide with examples?"]]}, {"num": 35, "title": "Writing the Self-Assessment", "lines": [["S", "Rodrigo, I'm working on my self-assessment, and I'm stuck. Could you look at it?", "Larissa"], ["P", "Sure. Let's see. Hmm. \"We organized the warehouse training. We improved the tracking process.\" Larissa, who's \"we\"?", "Rodrigo"], ["S", "Well, the team. Kevin, Priya, Dave's people. I didn't do it alone.", "Larissa"], ["P", "I know, but this is your review. Nobody else is going to write about what you did. You need to say \"I.\"", "Rodrigo"], ["S", "It feels like I'm showing off.", "Larissa"], ["P", "I felt the same at my first review. Brazilians are often very modest about this. But here, it's expected. If you don't say it, your manager might forget it.", "Rodrigo"], ["S", "Okay. So, \"I organized the warehouse training\"?", "Larissa"], ["P", "Better. But add numbers. How many people? How many sessions? Numbers make it real.", "Rodrigo"], ["S", "\"I planned and delivered six training sessions for sixty-eight warehouse employees, with a hundred percent attendance.\"", "Larissa"], ["P", "Now that sounds impressive. What about the tracking tool?", "Rodrigo"], ["S", "\"I introduced a new booking tool that saved about five hours of admin work each week.\"", "Larissa"], ["P", "Perfect. See the difference?", "Rodrigo"], ["S", "Yes. It's the same work, but it sounds much bigger.", "Larissa"], ["P", "It's not bigger. It's just accurate. Also, in the section about areas to improve, don't be too hard on yourself. Pick one or two real things, and say what you're doing about them.", "Rodrigo"], ["S", "Like writing shorter emails?", "Larissa"], ["P", "Exactly. Karen already told you about that, so she'll like that you listened.", "Rodrigo"], ["S", "Thank you. I'm going to rewrite the whole thing tonight.", "Larissa"], ["P", "Not tonight. Tomorrow. Go home.", "Rodrigo"]], "words": 241, "kind": "story", "scene": "Late February, Rodrigo's desk.", "F": "\"Showing off\" means trying to impress people. Notice how Larissa's sentences change from \"we\" to \"I,\" with numbers. \"Don't be too hard on yourself\" means don't criticize yourself too much.", "V": "", "t": [[0.3, 3.78], [4.13, 5.07], [5.67, 6.27], [6.62, 7.42], [7.77, 8.32], [8.67, 10.53], [10.88, 12.6], [12.95, 14.2], [14.8, 15.63], [15.98, 17.81], [18.16, 19.19], [19.79, 21.35], [21.7, 24.38], [24.73, 25.87], [26.47, 27.99], [28.59, 30.51], [30.86, 33.32], [33.67, 34.93], [35.28, 37.77], [38.37, 38.95], [39.3, 41.63], [42.23, 42.82], [43.17, 44.13], [44.48, 45.43], [45.78, 46.85], [47.2, 48.38], [48.98, 56.09], [56.69, 58.13], [58.48, 59.79], [60.39, 65.53], [66.13, 66.83], [67.18, 68.17], [68.77, 69.33], [69.68, 72.14], [72.74, 73.68], [74.03, 75.06], [75.41, 80.01], [80.36, 83.81], [84.41, 86.02], [86.62, 87.39], [87.74, 91.23], [91.83, 92.47], [92.82, 94.95], [95.55, 96.42], [96.77, 97.5], [97.85, 98.59]], "R": [["A colleague reads your self-assessment.", "Rodrigo", "You wrote \"we\" everywhere. What did you do?", "You're right. I planned and delivered six training sessions for sixty-eight people, with full attendance."], ["Your colleague asks about areas to improve.", "Rodrigo", "What will you write in the section on areas to improve?", "I'll say I'm working on shorter, more direct emails, and that I've already started."]]}, {"num": 36, "title": "The Annual Review", "lines": [["P", "Okay, Larissa, thanks for your self-assessment. It was really well written. Let's go through my part. Overall, I've rated you as exceeding expectations.", "Karen"], ["S", "Really? Wow. Thank you, Karen.", "Larissa"], ["P", "You earned it. Your work on the warehouse training was excellent. Dave's team still talks about it. And your first client project is going very well.", "Karen"], ["S", "I'm really happy to hear that.", "Larissa"], ["P", "Now, there's one area where I've put \"developing.\" That's delegation.", "Karen"], ["S", "Delegation? Okay. Can you tell me more?", "Larissa"], ["P", "Sure. You're very reliable, and you like to do things yourself. That's a strength. But on the client project, I've noticed you're doing a lot of tasks that other people could do. Like the meeting notes, and updating the tracker.", "Karen"], ["S", "That's true. I thought it would be faster if I did it.", "Larissa"], ["P", "In the short term, maybe. But as a project manager, your job is to lead the work, not do all of it. Otherwise, you'll burn out.", "Karen"], ["S", "That makes sense. How can I get better at it?", "Larissa"], ["P", "Start small. This month, choose two tasks and give them to someone else on the project team. Then check in with them, instead of doing it yourself.", "Karen"], ["S", "Okay. I can do that.", "Larissa"], ["P", "Great. And on the salary side, you'll hear about the increase in April, from Priya. I can't give you the number yet, but I've made a strong recommendation.", "Karen"], ["S", "Thank you, Karen. For everything. This has been a really good year for me.", "Larissa"], ["P", "It's only been six months!", "Karen"], ["S", "I know. It feels like a year.", "Larissa"]], "words": 251, "kind": "story", "scene": "March, Karen's office.", "F": "\"Delegation\" means giving tasks to other people. To \"burn out\" means to become exhausted from too much work. Notice that Larissa accepts the criticism and asks, \"How can I get better at it?\"", "V": "", "t": [[0.3, 3.23], [3.58, 4.92], [5.27, 6.68], [7.03, 10.27], [10.87, 11.43], [11.78, 12.26], [12.61, 13.55], [14.15, 14.88], [15.23, 17.58], [17.93, 19.68], [20.03, 22.65], [23.25, 24.7], [25.3, 27.94], [28.29, 29.39], [29.99, 30.79], [31.14, 31.72], [32.07, 33.05], [33.65, 34.17], [34.52, 37.62], [37.97, 38.9], [39.25, 44.26], [44.61, 47.1], [47.7, 48.43], [48.78, 50.65], [51.25, 52.57], [52.92, 57.23], [57.58, 59.04], [59.64, 60.54], [60.89, 62.32], [62.92, 63.77], [64.12, 68.47], [68.82, 71.65], [72.25, 72.82], [73.17, 74.07], [74.67, 75.3], [75.65, 79.76], [80.11, 83.69], [84.29, 85.23], [85.58, 86.4], [86.75, 88.86], [89.46, 90.96], [91.56, 92.15], [92.5, 93.61]], "R": [["Your manager gives you a positive review.", "Karen", "Overall, I've rated you as exceeding expectations.", "Thank you so much, Karen. I really appreciate that."], ["Your manager rates one area as \"developing.\"", "Karen", "The one area I've put as developing is delegation.", "That makes sense. How can I get better at it? Should I start with a couple of small tasks?"]]}, {"num": 37, "title": "A Client Complaint", "lines": [["P", "Larissa, Karen, got a second? I just had a call with the client. They're not happy.", "Greg"], ["P", "Okay. What's going on?", "Karen"], ["P", "They said the project updates are too long and too technical. Their director doesn't have time to read five pages every week.", "Greg"], ["S", "But they asked for all that detail at the start. I have the email.", "Larissa"], ["P", "I believe you. But things have changed. They have a new director now, and she wants something shorter.", "Greg"], ["S", "Well, I wish someone had told me. I've been spending hours on those reports.", "Larissa"], ["P", "Larissa, I understand. It's frustrating. But let's take a step back for a second. What can we do about it?", "Karen"], ["S", "Sorry. You're right. I was being defensive. I think I could make a one-page summary for the director, and keep the full report for the project team.", "Larissa"], ["P", "That's exactly what they need. Honestly, that would solve the whole problem.", "Greg"], ["P", "Good. Greg, could you set up a quick call with the new director? It would be good for Larissa to hear what she wants directly.", "Karen"], ["P", "Sure. I'll try for this week.", "Greg"], ["S", "And maybe I could show her a draft during the call, and ask for her feedback before I finish it.", "Larissa"], ["P", "Perfect. That way, there are no more surprises.", "Karen"], ["P", "And Larissa, just so you know, they also said the project is going really well. They're just busy people.", "Greg"], ["S", "Thanks, Greg. That makes me feel better.", "Larissa"], ["P", "Remember, a complaint from a client isn't always a complaint about you. Sometimes, their needs just change.", "Karen"], ["S", "I'll try to remember that next time. Before I get defensive.", "Larissa"]], "words": 260, "kind": "story", "scene": "March, the team area.", "F": "\"Defensive\" means protecting yourself instead of listening. \"Let's take a step back\" means let's stop and think calmly. Listen for how Larissa's tone changes after Karen's question.", "V": "", "t": [[0.3, 2.12], [2.47, 4.51], [4.86, 6.03], [6.63, 7.25], [7.6, 8.58], [9.18, 12.64], [12.99, 16.96], [17.56, 19.92], [20.27, 21.26], [21.86, 22.92], [23.27, 24.65], [25.0, 28.4], [29.0, 30.74], [31.09, 33.26], [33.86, 35.37], [35.72, 36.76], [37.11, 39.06], [39.41, 40.6], [41.2, 41.76], [42.11, 42.78], [43.13, 44.4], [44.75, 50.54], [51.14, 52.88], [53.23, 55.77], [56.37, 56.88], [57.23, 59.95], [60.3, 63.4], [64.0, 64.61], [64.96, 66.5], [67.1, 72.69], [73.29, 73.99], [74.34, 76.28], [76.88, 82.3], [82.65, 84.21], [84.81, 85.7], [86.05, 87.29], [87.89, 91.66], [92.01, 94.02], [94.62, 96.35], [96.7, 97.94]], "R": [["A colleague tells you the client isn't happy.", "Greg", "The client says the reports are too long.", "Okay, thanks for telling me. What if I made a one-page summary for the director, and kept the full report for the team?"], ["You notice you reacted badly.", "Karen", "Let's take a step back. What can we do about it?", "Sorry, you're right. I was being defensive. Let's focus on a solution."]]}]}, {"part": 5, "title": "Calls and Video Meetings", "desc": "Clients, bad connections, time zones, voicemail, and hybrid meetings.", "scripts": [{"num": 38, "title": "Meeting the New Director", "lines": [["P", "Okay, I think everyone's here. Susan, thanks for making time. This is Larissa, our project lead. She's the one who writes the weekly updates.", "Greg"], ["P", "Hi, Larissa. Nice to finally meet you.", "Susan"], ["S", "Nice to meet you too, Susan. Thanks for joining. I know you wanted to talk about the reports.", "Larissa"], ["P", "I did. First, let me say the work itself is excellent. My problem is time. I have eleven projects, and I can't read five pages for each one.", "Susan"], ["S", "Of course. That makes sense. So, what would be most useful for you?", "Larissa"], ["P", "Honestly, I just need the bottom line. Are we on track? Is there anything I need to worry about? And is there anything you need from me?", "Susan"], ["S", "Okay. I actually prepared a draft of a one-page summary. Can I share my screen for a second?", "Larissa"], ["P", "Please.", "Susan"], ["S", "So, at the top, there's a status for each area. Green means on track, yellow means some risk, and red means there's a problem. Then, below that, three short sections: progress, risks, and decisions needed.", "Larissa"], ["P", "Oh, I like this. The colours are very helpful. I can read this in thirty seconds.", "Susan"], ["S", "That was the idea. The full report will still be there for your team, if they want the details.", "Larissa"], ["P", "Perfect. One small change. Could you put the decisions section first? That's the part I actually have to act on.", "Susan"], ["S", "Sure. No problem. I'll switch it around for this week's update.", "Larissa"], ["P", "Great. Greg, you didn't tell me Larissa was this good.", "Susan"], ["P", "I've been trying to keep her a secret.", "Greg"]], "words": 255, "kind": "story", "scene": "March, a video call.", "F": "\"The bottom line\" means the most important information. \"On track\" means going according to plan. \"Switch it around\" means change the order.", "V": "", "t": [[0.3, 2.32], [2.67, 4.74], [5.09, 7.54], [7.89, 10.36], [10.96, 11.88], [12.23, 13.71], [14.31, 16.05], [16.4, 17.45], [17.8, 19.97], [20.57, 21.22], [21.57, 24.1], [24.45, 25.73], [26.08, 30.14], [30.74, 31.44], [31.79, 32.68], [33.03, 35.01], [35.61, 37.79], [38.14, 39.05], [39.4, 41.52], [41.87, 43.85], [44.45, 45.03], [45.38, 48.23], [48.58, 50.3], [50.9, 51.53], [52.13, 54.96], [55.31, 60.23], [60.58, 65.6], [66.2, 67.23], [67.58, 69.04], [69.39, 71.2], [71.8, 72.82], [73.17, 77.27], [77.87, 78.58], [78.93, 80.08], [80.43, 82.48], [82.83, 85.04], [85.64, 86.12], [86.47, 87.3], [87.65, 89.96], [90.56, 91.18], [91.53, 93.86], [94.46, 96.46]], "R": [["A busy client director explains what she needs.", "Susan", "I just need the bottom line. Are we on track?", "Yes, we're on track. There's one small risk with the night shift, and I'll have an answer by Friday."], ["The client asks for a change to your report.", "Susan", "Could you put the decisions section first?", "Sure. No problem. I'll switch it around for this week's update."]]}, {"num": 39, "title": "You're Breaking Up", "lines": [["S", "Hi, Paul. Can you hear me?", "Larissa"], ["P", "Hi, Larissa! Yes, I can hear you. Can you hear me okay?", "Paul"], ["S", "Yes, perfectly. Thanks for making time. So, I wanted to talk about the Toronto training sessions.", "Larissa"], ["P", "Great. So, I talked to my team yesterday, and they said the best week for them is... the week of the... Larissa?", "Paul"], ["S", "Sorry, Paul, you're breaking up. I missed that last part. Could you say it again?", "Larissa"], ["P", "Sure. I said the best week is the week of the... is that better?", "Paul"], ["S", "Not really. I think your video froze. I can see you, but you're not moving.", "Larissa"], ["P", "Ugh, sorry. The Wi-Fi in this meeting room is terrible. Let me turn off my camera. Maybe that will help.", "Paul"], ["S", "Okay. Try now.", "Larissa"], ["P", "Can you hear me now?", "Paul"], ["S", "Yes! Much better. So, which week did you say?", "Larissa"], ["P", "The week of April fourteenth. Fourteen, one-four.", "Paul"], ["S", "Perfect. April fourteenth. I'll write that down.", "Larissa"], ["P", "And the room we'll use holds about twenty people. So, we might need two sessions.", "Paul"], ["S", "Sorry, did you say twenty or twenty-five?", "Larissa"], ["P", "Twenty. Two-zero.", "Paul"], ["S", "Got it. Thanks. Two sessions of about twenty people, the week of April fourteenth.", "Larissa"], ["P", "Exactly. If the connection drops again, I'll call you from my phone.", "Paul"], ["S", "Good idea. Actually, why don't I send you a quick email with everything we just said? Then we can both check it.", "Larissa"], ["P", "That would be great. With this Wi-Fi, I don't trust my own ears.", "Paul"]], "words": 236, "kind": "story", "scene": "March, a video call with Toronto.", "F": "\"You're breaking up\" means the sound keeps cutting out. \"Your video froze\" means the picture stopped moving. Notice how Paul says numbers digit by digit (\"one-four\") to be clear.", "V": "", "t": [[0.3, 1.0], [1.35, 2.15], [2.75, 3.96], [4.31, 5.88], [6.23, 7.71], [8.31, 9.36], [9.71, 10.99], [11.34, 14.62], [15.22, 15.91], [16.26, 20.12], [20.47, 21.49], [21.84, 22.72], [23.32, 25.01], [25.36, 26.67], [27.02, 28.16], [28.76, 29.36], [29.71, 31.96], [32.31, 33.36], [33.96, 34.7], [35.05, 36.34], [36.69, 38.72], [39.32, 40.38], [40.73, 43.16], [43.51, 45.1], [45.45, 46.92], [47.52, 48.1], [48.45, 49.15], [49.75, 51.15], [51.75, 52.28], [52.63, 53.41], [53.76, 55.25], [55.85, 57.76], [58.11, 59.71], [60.31, 60.95], [61.3, 62.33], [62.68, 63.75], [64.35, 66.77], [67.12, 69.0], [69.6, 72.08], [72.68, 73.46], [73.81, 74.83], [75.43, 76.01], [76.36, 76.94], [77.29, 80.97], [81.57, 82.45], [82.8, 85.81], [86.41, 87.13], [87.48, 91.49], [91.84, 93.03], [93.63, 94.96], [95.31, 97.84]], "R": [["The video call keeps cutting out.", "Paul", "The best week for us is the week of the…", "Sorry, Paul, you're breaking up. Could you say that again?"], ["You want to confirm a number.", "Paul", "The room holds about twenty people.", "Sorry, did you say twenty or twenty-five?"]]}, {"num": 40, "title": "You're on Mute", "lines": [["P", "Okay, let's get started. I can see most people are here. Rodrigo, do you want to give us the data update?", "Karen"], ["S", "Karen, I think Rodrigo's on mute. His lips are moving, but there's no sound.", "Larissa"], ["P", "Rodrigo, you're on mute!", "Karen"], ["P", "Sorry! Can you hear me now?", "Rodrigo"], ["P", "Yes, we can hear you. Go ahead.", "Karen"], ["P", "Okay. So, the client data is almost ready. I just need two more days to check the... sorry, my neighbour is doing construction today. Can you hear that?", "Rodrigo"], ["P", "Yeah, we can hear it. It sounds like a drill.", "Megan"], ["P", "It is a drill. I'm so sorry. Let me mute myself when I'm not talking.", "Rodrigo"], ["P", "No problem. Just give us the key points, and you can mute again.", "Karen"], ["P", "Okay. Data ready by Wednesday. That's it. Muting now.", "Rodrigo"], ["P", "Thanks, Rodrigo. Megan, your turn.", "Karen"], ["P", "Sure. But first, Larissa, I think your camera is pointing at the ceiling.", "Megan"], ["S", "Oh no! Is that better?", "Larissa"], ["P", "Perfect. Now we can see your face instead of your light.", "Megan"], ["S", "Sorry, everyone. I just moved my laptop.", "Larissa"], ["P", "Don't worry. This happens in every meeting. Okay, Megan, go ahead.", "Karen"], ["P", "Thanks. So, the video team has finished the first draft of the client videos. I'll put the link in the chat now.", "Megan"], ["P", "Great. Everyone, please watch them before Friday and leave your comments in the document.", "Karen"], ["P", "Sorry, one quick thing. I'm unmuting just to say, the drill has stopped.", "Rodrigo"], ["P", "Congratulations, Rodrigo. Okay, let's move on.", "Karen"]], "words": 234, "kind": "story", "scene": "March, a team video call.", "F": "\"You're on mute\" may be the most common sentence in video meetings. \"Go ahead\" means \"start talking.\" \"Put the link in the chat\" means type it in the meeting's message box.", "V": "", "t": [[0.3, 1.82], [2.17, 3.71], [4.06, 6.92], [7.52, 9.62], [9.97, 12.38], [12.98, 14.52], [15.12, 15.76], [16.11, 17.1], [17.7, 18.99], [19.34, 20.04], [20.64, 21.32], [21.67, 23.75], [24.1, 26.19], [26.54, 29.0], [29.35, 30.21], [30.81, 32.01], [32.36, 33.55], [34.15, 35.02], [35.37, 36.4], [36.75, 38.9], [39.5, 40.42], [40.77, 43.45], [44.05, 44.73], [45.08, 46.46], [46.81, 47.5], [47.85, 48.65], [49.25, 50.41], [50.76, 51.78], [52.38, 52.96], [53.31, 56.98], [57.58, 58.18], [58.53, 59.34], [59.94, 60.7], [61.05, 63.51], [64.11, 65.08], [65.43, 66.85], [67.45, 68.24], [68.59, 70.21], [70.56, 72.01], [72.61, 73.3], [73.65, 77.39], [77.74, 79.39], [79.99, 80.62], [80.97, 85.5], [86.1, 87.25], [87.6, 90.1], [90.7, 92.62], [92.97, 94.29]], "R": [["Someone is speaking on a video call, but there's no sound.", "Karen", "Rodrigo, go ahead with the update.", "Karen, I think Rodrigo's on mute. Rodrigo, you're on mute!"], ["There's a lot of noise in your home.", "Megan", "Is that a drill I can hear?", "Yes, sorry! My neighbour is doing construction. I'll mute myself when I'm not talking."]]}, {"num": 41, "title": "Time Zones", "lines": [["S", "Paul, I'm trying to book a meeting with you and the Toronto team next week. What time works for you?", "Larissa"], ["P", "Mornings are usually busy for us. How about two o'clock?", "Paul"], ["S", "Two o'clock your time, or my time?", "Larissa"], ["P", "Oh, good question. My time. Toronto time.", "Paul"], ["S", "So, that's eleven a.m. in Vancouver. Toronto is three hours ahead, right?", "Larissa"], ["P", "Exactly. Three hours. So, eleven your time works for you?", "Paul"], ["S", "Eleven's perfect. I usually have a quiet morning. And which day?", "Larissa"], ["P", "Tuesday or Thursday. Wednesday is our big team meeting day.", "Paul"], ["S", "Let's say Tuesday. And how long do you need?", "Larissa"], ["P", "Let's book an hour, but I hope we finish early.", "Paul"], ["S", "Great. I'll send the invite. The calendar should show the time in your time zone automatically.", "Larissa"], ["P", "It should, but double-check. Last month, someone sent an invite in Pacific time, and half my team showed up three hours early.", "Paul"], ["S", "Oh no! I'll make sure to write both times in the invite. Two p.m. Eastern, eleven a.m. Pacific.", "Larissa"], ["P", "Perfect. That's what I do too.", "Paul"], ["S", "One more thing. We also have someone joining from the Halifax office. What time is it there?", "Larissa"], ["P", "Halifax is one hour ahead of us. So, four hours ahead of you.", "Paul"], ["S", "So, three o'clock for them. That should be fine.", "Larissa"], ["P", "Just don't book anything late in the day. By five in Toronto, most people have already gone home. Which is only two o'clock for you.", "Paul"], ["S", "Right. That explains why nobody answers my emails in the afternoon.", "Larissa"], ["P", "Now you know our secret.", "Paul"]], "words": 248, "kind": "story", "scene": "March, a phone call.", "F": "Canada has six time zones. Toronto (Eastern) is three hours ahead of Vancouver (Pacific), and Halifax (Atlantic) is four hours ahead. Always ask: \"Your time or my time?\"", "V": "", "t": [[0.3, 5.04], [5.39, 6.59], [7.19, 9.25], [9.6, 11.19], [11.79, 13.71], [14.31, 15.7], [16.05, 17.17], [17.52, 19.04], [19.64, 21.89], [22.24, 24.26], [24.86, 25.74], [26.09, 27.24], [27.59, 29.64], [30.24, 31.3], [31.65, 33.29], [33.64, 34.43], [35.03, 36.72], [37.07, 39.3], [39.9, 40.87], [41.22, 42.42], [43.02, 45.49], [46.09, 46.67], [47.02, 48.12], [48.47, 51.93], [52.53, 54.15], [54.5, 59.84], [60.44, 61.04], [61.39, 63.7], [64.05, 66.87], [67.47, 68.26], [68.61, 70.22], [70.82, 71.66], [72.01, 75.41], [75.76, 76.82], [77.42, 79.5], [79.85, 81.65], [82.25, 83.74], [84.09, 85.04], [85.64, 87.88], [88.23, 91.38], [91.73, 93.63], [94.23, 94.77], [95.12, 98.9], [99.5, 101.05]], "R": [["A colleague in Toronto suggests a meeting time.", "Paul", "How about two o'clock?", "Two o'clock your time or my time?"], ["You're confirming a time across time zones.", "Paul", "Two o'clock my time works.", "Perfect. That's eleven in the morning for me. I'll write both times in the invite."]]}, {"num": 42, "title": "Leaving a Voicemail", "lines": [["P", "Are you calling Susan? You look nervous.", "Rodrigo"], ["S", "I am a bit. If she doesn't answer, I have to leave a voicemail. I hate leaving voicemails in English.", "Larissa"], ["P", "Here's a tip. Before you call, write down what you want to say. Say your name, why you're calling, and your number. And say the number slowly, twice.", "Rodrigo"], ["S", "Twice? Isn't that strange?", "Larissa"], ["P", "No, it's very normal. People are often writing it down while they listen. Okay, go ahead. I'll listen.", "Rodrigo"], ["P", "Hi, you've reached Susan Clarke. I'm either on another call or away from my desk. Please leave a message after the tone, and I'll get back to you as soon as I can.", "Susan"], ["S", "Hi, Susan, this is Larissa Oliveira, calling from Cedarpoint. I'm calling about Thursday's project meeting. We'd like to move it from ten to eleven, if that works for you. Could you call me back to confirm? My number is six-oh-four, five-five-five, two-eight-one-seven. Again, that's six-oh-four, five-five-five, two-eight-one-seven. I'll also send you an email with the details. Thanks, Susan. Have a great day.", "Larissa"], ["P", "That was perfect! Clear, short, and friendly.", "Rodrigo"], ["S", "Really? I felt like I was talking too fast.", "Larissa"], ["P", "Only a little at the beginning. But the number was very clear.", "Rodrigo"], ["S", "I'm glad I wrote it down. I almost forgot to say what the call was about.", "Larissa"], ["P", "That happens to everyone. And sending an email too is smart. Some people never listen to their voicemail.", "Rodrigo"], ["S", "Really?", "Larissa"], ["P", "Really. Greg has forty-seven messages he's never listened to.", "Rodrigo"]], "words": 244, "kind": "story", "scene": "March, Larissa's desk.", "F": "A good voicemail has four parts: your name, the reason, what you want, and your number said twice. In phone numbers, zero is often said \"oh.\" 555 numbers are not real, like in films.", "V": "", "t": [[0.3, 1.51], [1.86, 2.78], [3.38, 4.14], [4.49, 7.24], [7.59, 9.57], [10.17, 11.01], [11.36, 13.87], [14.22, 16.48], [16.83, 18.48], [19.08, 19.68], [20.03, 21.16], [21.76, 22.94], [23.29, 25.72], [26.07, 27.08], [27.43, 28.2], [28.8, 30.39], [30.74, 33.47], [33.82, 38.2], [38.8, 43.14], [43.49, 45.75], [46.1, 49.55], [49.9, 51.48], [51.83, 55.86], [56.21, 60.09], [60.44, 62.92], [63.27, 64.24], [64.59, 65.54], [66.14, 67.11], [67.46, 68.81], [69.41, 69.96], [70.31, 72.17], [72.77, 74.14], [74.49, 75.99], [76.59, 77.93], [78.28, 80.72], [81.32, 82.56], [82.91, 84.79], [85.14, 87.26], [87.86, 88.41], [89.01, 89.62], [89.97, 92.9]], "R": [["You call a client, and you get her voicemail.", "Susan", "Please leave a message after the tone.", "Hi Susan, it's Larissa from Cedarpoint, calling about Thursday's meeting. Could you call me back? My number is 604-555-2817. Thanks!"], ["A colleague asks why you say your number twice.", "Daniel", "Why did you repeat your phone number?", "Because people are often writing it down while they listen. It makes it easier for them."]]}, {"num": 43, "title": "Spelling a Name", "lines": [["P", "Hi, Larissa. It's Susan. I got your message about Thursday.", "Susan"], ["S", "Oh, hi, Susan! Thanks for calling back. Does eleven work for you?", "Larissa"], ["P", "Eleven's fine. But I'd like to add someone to the meeting. Our new operations manager. Could you send her the invite?", "Susan"], ["S", "Of course. What's her name?", "Larissa"], ["P", "Her name is Siobhan Walsh.", "Susan"], ["S", "Sorry, could you spell that for me? I don't want to get it wrong.", "Larissa"], ["P", "Sure. It's Irish, so don't worry, everybody asks. S-I-O-B-H-A-N. Siobhan. And Walsh is W-A-L-S-H.", "Susan"], ["S", "S-I-O-B-H-A-N. Wow, I would never have guessed that. And her email?", "Larissa"], ["P", "It's her first initial, then her last name, at our company address. So, S-W-A-L-S-H.", "Susan"], ["S", "Got it. S Walsh. And just to confirm, you said the meeting will be one hour?", "Larissa"], ["P", "Actually, can we make it ninety minutes? Siobhan has a lot of questions about the training.", "Susan"], ["S", "Sure. So, eleven to twelve-thirty.", "Larissa"], ["P", "Perfect. And are we meeting at your office or ours?", "Susan"], ["S", "At ours, if that's okay. We're on the ninth floor. Just check in at reception, and they'll call me.", "Larissa"], ["P", "Great. Ninth floor. I'll let Siobhan know. Perfect. Oh, and one more thing. She'll want to see the budget. Can you bring the updated numbers?", "Susan"], ["S", "Yes. The total is now about fifteen thousand dollars. One-five.", "Larissa"], ["P", "Fifteen. Great, that's lower than I expected.", "Susan"], ["S", "It is. We saved some money because we trained the supervisors first.", "Larissa"], ["P", "Excellent. Okay, I'll let you go. See you Thursday.", "Susan"], ["S", "See you Thursday. Thanks, Susan.", "Larissa"]], "words": 240, "kind": "story", "scene": "March, a phone call.", "F": "Siobhan is pronounced \"shi-VAWN.\" \"Could you spell that for me?\" is always polite. \"I'll let you go\" is a friendly way to end a call.", "V": "", "t": [[0.3, 1.22], [1.57, 2.4], [2.75, 4.49], [5.09, 6.3], [6.65, 7.87], [8.22, 9.51], [10.11, 11.08], [11.43, 13.34], [13.69, 15.33], [15.68, 17.01], [17.61, 18.31], [18.66, 19.46], [20.06, 21.5], [22.1, 23.87], [24.22, 25.45], [26.05, 26.63], [26.98, 29.49], [29.84, 31.44], [31.79, 32.49], [32.84, 34.96], [35.56, 37.49], [37.84, 39.58], [39.93, 40.75], [41.35, 44.99], [45.34, 47.21], [47.81, 48.39], [48.74, 49.47], [49.82, 53.12], [53.72, 55.78], [56.13, 58.8], [59.4, 59.88], [60.23, 62.07], [62.67, 63.38], [63.73, 65.88], [66.48, 68.04], [68.39, 69.55], [69.9, 72.34], [72.94, 73.56], [73.91, 74.78], [75.13, 76.32], [76.67, 77.38], [77.73, 78.9], [79.25, 80.65], [81.0, 82.82], [83.42, 83.98], [84.33, 87.06], [87.41, 88.2], [88.8, 89.54], [89.89, 91.76], [92.36, 92.99], [93.34, 96.94], [97.54, 98.26], [98.61, 99.91], [100.26, 101.31], [101.91, 102.85], [103.2, 104.17]], "R": [["A client gives you a name you can't spell.", "Susan", "Her name is Siobhan Walsh.", "Sorry, could you spell that for me? I don't want to get it wrong."], ["You want to confirm the meeting details.", "Susan", "Can we make it ninety minutes?", "Sure. So, just to confirm, eleven to twelve-thirty on Thursday, at our office."]]}, {"num": 44, "title": "Sharing Your Screen", "lines": [["S", "Okay, I'm going to share my screen. Can everyone see it?", "Larissa"], ["P", "I can see your email inbox.", "Susan"], ["S", "Oh no! Sorry, wrong window. One second. Okay, how about now?", "Larissa"], ["P", "Yes, now I can see the presentation.", "Susan"], ["P", "Don't worry, Larissa. Last week, I shared my screen and everyone saw my grocery list.", "Greg"], ["S", "That makes me feel a little better. Okay, let's start. Today, I'd like to walk you through the training plan for your Toronto office. It should take about fifteen minutes, and then we'll have time for questions.", "Larissa"], ["P", "Sounds good.", "Susan"], ["S", "So, on this first slide, you can see the timeline. We'll start in the week of April fourteenth, with two sessions. Next slide. Here's the budget. As I mentioned, the total is fifteen thousand dollars.", "Larissa"], ["P", "Sorry, can I stop you there? Does that include the travel costs?", "Susan"], ["S", "Good question. No, travel is separate. It's on the next slide. Let me skip ahead.", "Larissa"], ["P", "Great, thanks.", "Susan"], ["S", "So, travel is about two thousand dollars. That's for two people from our team, for three days.", "Larissa"], ["P", "And that's a very reasonable number for Toronto hotels.", "Greg"], ["P", "Agreed. Okay, please continue.", "Susan"], ["S", "So, the last slide is next steps. We need your approval by the end of the month. Then we'll send the invitations to your team.", "Larissa"], ["P", "I think we can do that. Great presentation, Larissa. Very clear.", "Susan"], ["S", "Thank you. I'll stop sharing now. Are there any other questions?", "Larissa"], ["P", "Not from me. Greg?", "Susan"], ["P", "Just one. Can I see your email again? It looked more interesting.", "Greg"], ["S", "Absolutely not.", "Larissa"]], "words": 248, "kind": "story", "scene": "April, a video call.", "F": "Useful presenting phrases: \"Can everyone see my screen?\", \"Next slide,\" \"Let me skip ahead,\" and \"I'll stop sharing now.\" \"Can I stop you there?\" is a polite way to interrupt a presenter.", "V": "", "t": [[0.3, 2.57], [2.92, 3.91], [4.51, 6.2], [6.8, 7.4], [7.75, 9.09], [9.44, 10.25], [10.6, 11.93], [12.53, 14.52], [15.12, 16.46], [16.81, 21.27], [21.87, 23.43], [23.78, 25.07], [25.42, 29.64], [29.99, 33.99], [34.59, 35.42], [36.02, 39.15], [39.5, 42.89], [43.24, 44.05], [44.4, 45.38], [45.73, 49.04], [49.64, 51.14], [51.49, 53.31], [53.91, 54.82], [55.17, 56.74], [57.09, 58.29], [58.64, 59.61], [60.21, 61.09], [61.69, 64.12], [64.47, 67.34], [67.94, 71.65], [72.25, 72.91], [73.26, 74.69], [75.29, 77.3], [77.65, 79.95], [80.3, 82.79], [83.39, 84.7], [85.05, 86.69], [87.04, 87.84], [88.44, 89.09], [89.44, 90.67], [91.02, 92.3], [92.9, 93.77], [94.12, 94.7], [95.3, 96.14], [96.49, 98.14], [98.49, 99.98], [100.58, 101.63]], "R": [["You're about to share your screen on a video call.", "Susan", "Okay, go ahead whenever you're ready.", "Thanks. I'm going to share my screen. Can everyone see it?"], ["A client interrupts your presentation with a question.", "Susan", "Sorry, can I stop you there? Does that include travel?", "Good question. No, travel is separate. Let me skip ahead to that slide."]]}, {"num": 45, "title": "A Hybrid Meeting", "lines": [["P", "Okay, good morning, everyone, both in the room and online. Paul, can you hear us okay from Toronto?", "Karen"], ["P", "Mostly, yes. But the people at the end of the table are quiet. I can hear Karen, but not everyone else.", "Paul"], ["P", "Okay. Megan, could you move the microphone closer to that side?", "Karen"], ["P", "Sure. Paul, is this better?", "Megan"], ["P", "Much better. Thanks, Megan.", "Paul"], ["P", "Great. So, the first item is the Toronto training. Larissa, over to you.", "Karen"], ["S", "Thanks. So, the plan is ready, and Susan approved the budget yesterday. Paul, I have a question for you. Have you booked the room for the fourteenth?", "Larissa"], ["P", "Sorry, Larissa, I missed the first part. Someone was typing very loudly.", "Paul"], ["P", "That was me. Sorry! I'll stop.", "Megan"], ["S", "No problem. Paul, I was asking about the room for the fourteenth.", "Larissa"], ["P", "Yes, it's booked. Room four-B, on the fourth floor.", "Paul"], ["S", "Perfect. Thank you.", "Larissa"], ["P", "Paul, just so you know, if you want to say something, put your hand up in the chat, or just jump in. It's easy for us to forget the people online.", "Karen"], ["P", "Thanks, Karen. Actually, I do have one thing. Could someone in the room share the slides on the screen? I can only see the back of Greg's head.", "Paul"], ["P", "Sorry, Paul! I'll move.", "Greg"], ["P", "Larissa, can you share them from your laptop?", "Megan"], ["S", "Sure. One second. Paul, can you see them now?", "Larissa"], ["P", "Yes, perfect. Thank you.", "Paul"], ["P", "Good. This is always the challenge with hybrid meetings. Let's try to remember that Paul is here too.", "Karen"], ["P", "Don't worry. I'm used to being invisible.", "Paul"], ["P", "Not anymore. You're first on the agenda next time.", "Karen"]], "words": 259, "kind": "story", "scene": "April, a meeting room, with Paul online.", "F": "In a \"hybrid meeting,\" some people are in the room and some are online. \"Over to you\" means \"it's your turn to speak.\" \"Put your hand up in the chat\" means use the raise-hand button.", "V": "", "t": [[0.3, 4.03], [4.38, 6.69], [7.29, 8.59], [8.94, 11.47], [11.82, 14.03], [14.63, 15.25], [15.6, 18.65], [19.25, 19.83], [20.18, 21.37], [21.97, 22.9], [23.25, 24.42], [25.02, 25.65], [26.0, 28.75], [29.1, 30.64], [31.24, 31.82], [32.17, 36.13], [36.48, 38.3], [38.65, 40.44], [41.04, 43.28], [43.63, 45.68], [46.28, 47.21], [47.56, 48.26], [48.61, 49.47], [50.07, 50.
