 ["P", "Even if I ask a lot?", "Daniel"], ["S", "Even if you ask a lot. My friend Rodrigo taught me that. Now I'm teaching you.", "Larissa"]], "words": 249, "kind": "story", "scene": "August, the kitchen.", "F": "This script echoes scripts 4, 9 and 20. Listen for the lines Larissa repeats from Rodrigo and Karen. \"That's a relief\" means \"I feel much better now.\"", "V": "", "t": [[0.3, 1.73], [2.08, 2.9], [3.25, 4.34], [4.94, 6.3], [6.65, 8.07], [8.42, 11.07], [11.67, 12.41], [12.76, 13.73], [14.08, 16.5], [17.1, 18.93], [19.28, 21.64], [21.99, 25.05], [25.65, 26.36], [26.71, 28.54], [28.89, 29.88], [30.23, 31.4], [32.0, 33.31], [33.66, 35.73], [36.08, 38.37], [38.97, 39.82], [40.17, 43.05], [43.4, 44.08], [44.68, 45.92], [46.27, 48.48], [49.08, 49.78], [50.13, 51.99], [52.34, 54.28], [54.63, 57.33], [57.68, 62.11], [62.71, 63.99], [64.34, 65.98], [66.58, 67.67], [68.02, 69.09], [69.69, 70.65], [71.0, 71.78], [72.13, 74.48], [75.08, 76.16], [76.51, 77.71], [78.06, 81.66], [82.01, 83.73], [84.33, 85.98], [86.33, 87.24], [87.84, 88.76], [89.11, 91.04], [91.39, 92.69], [93.04, 95.27], [95.87, 97.67], [98.27, 99.45], [99.8, 101.47], [101.82, 102.93]], "R": [["A new colleague is nervous on his first day.", "Daniel", "I'm scared I'll say something wrong.", "You'll be fine. If you have a question, just ask. People here really don't mind questions."], ["Your new colleague asks what he should know.", "Daniel", "Is there anything else I should know?", "Yes. I made you a list of our main systems and who to ask about each one."]]}, {"num": 72, "title": "The Long Weekend", "lines": [["P", "So, Larissa, any plans for the long weekend?", "Greg"], ["S", "The long weekend? Oh, right, Monday is a holiday. I almost forgot.", "Larissa"], ["P", "B.C. Day. First Monday in August. Best long weekend of the year, if you ask me. The weather's always great.", "Greg"], ["P", "Sorry, what's a long weekend?", "Daniel"], ["P", "It's when a public holiday falls on a Monday or a Friday, so you get three days off instead of two.", "Greg"], ["P", "Oh, nice. In Mexico, we call it a \"puente.\" A bridge.", "Daniel"], ["S", "In Brazil too! \"Feriado prolongado.\" Anyway, I don't have big plans. Maybe a hike with my husband. What about you, Greg?", "Larissa"], ["P", "We're going camping on Vancouver Island. The ferry will be a nightmare, though. Everyone has the same idea.", "Greg"], ["S", "That sounds like your trip to Whistler last year.", "Larissa"], ["P", "Ha! You remember that? Yeah, Vancouver never learns. What about you, Daniel?", "Greg"], ["P", "I'm not sure. My wife wants to go to the beach. Is that a good idea?", "Daniel"], ["P", "For sure. Just go early. By eleven, you won't find any parking.", "Greg"], ["P", "Okay. Go early. And are the stores closed on Monday?", "Daniel"], ["S", "Some are, but most big stores stay open. Banks and government offices are closed, though.", "Larissa"], ["P", "And the office, obviously. So, no emails, Daniel. I mean it.", "Greg"], ["P", "Don't worry. I don't have enough work yet to check my email.", "Daniel"], ["P", "Enjoy it while it lasts. Okay, have a great long weekend, you two!", "Greg"], ["S", "You too, Greg! Enjoy the ferry.", "Larissa"], ["P", "Very funny.", "Greg"]], "words": 234, "kind": "story", "scene": "Late July, the kitchen.", "F": "A \"long weekend\" has a holiday on Friday or Monday. B.C. Day is the first Monday in August in British Columbia. \"Enjoy it while it lasts\" means this good situation won't continue forever.", "V": "", "t": [[0.3, 3.24], [3.84, 4.77], [5.12, 7.09], [7.44, 8.47], [9.07, 10.03], [10.38, 12.01], [12.36, 15.2], [15.55, 17.14], [17.74, 19.72], [20.32, 26.74], [27.34, 28.41], [28.76, 31.1], [31.45, 32.42], [33.02, 33.97], [34.32, 35.52], [35.87, 37.91], [38.26, 39.75], [40.1, 41.12], [41.72, 44.14], [44.49, 46.3], [46.65, 48.52], [49.12, 51.38], [51.98, 52.55], [52.9, 54.03], [54.38, 56.05], [56.4, 57.73], [58.33, 59.5], [59.85, 62.07], [62.42, 64.11], [64.71, 65.48], [65.83, 66.94], rt summary of your main projects this year, with numbers. Like you did for your self-assessment. That'll help me make the case.", "Karen"], ["S", "I can have it for you by Friday.", "Larissa"], ["P", "Perfect. And Larissa, I can't promise anything yet. But I'm going to push for this.", "Karen"], ["S", "Thank you, Karen. That means a lot.", "Larissa"], ["P", "Don't thank me yet. Let's see what happens.", "Karen"]], "words": 248, "kind": "story", "scene": "August, Karen's office.", "F": "\"Put your name forward\" means recommend you for a job. \"Make the case\" means give strong reasons. \"I'm going to push for this\" means I'll try hard to make it happen.", "V": "", "t": [[0.3, 2.22], [2.57, 5.27], [5.87, 6.61], [6.96, 7.83], [8.43, 11.08], [11.68, 12.37], [12.72, 13.86], [14.21, 15.39], [15.74, 17.22], [17.82, 18.47], [18.82, 21.27], [21.62, 23.07], [23.67, 24.91], [25.26, 26.77], [27.37, 29.14], [29.49, 34.31], [34.66, 36.93], [37.53, 40.56], [40.91, 43.31], [43.91, 44.46], [45.06, 45.67], [46.02, 50.53], [50.88, 53.89], [54.49, 55.66], [56.01, 57.35], [57.95, 58.68], [59.03, 60.35], [60.7, 63.8], [64.15, 65.68], [66.03, 68.94], [69.54, 70.24], [70.59, 72.24], [72.84, 73.43], [73.78, 77.41], [77.76, 79.63], [79.98, 81.36], [81.96, 83.54], [84.14, 84.83], [85.18, 87.58], [87.93, 89.38], [89.98, 90.92], [91.27, 92.22], [92.82, 93.95], [94.3, 95.49]], "R": [["You want to ask your manager about a promotion.", "Karen", "What did you want to ask?", "It's been almost a year, and I'd like to become a project manager. What would the next step be?"], ["Your manager asks you to prepare something.", "Karen", "Can you write a short summary of your projects this year?", "Of course. I'll include numbers, and I can have it for you by Friday."]]}, {"num": 74, "title": "The Offer", "lines": [["P", "Larissa, come on in. Priya's joining us. Have a seat.", "Karen"], ["S", "Hi, Priya. Hi, Karen.", "Larissa"], ["P", "Hi, Larissa. So, I'll let Karen tell you the news.", "Priya"], ["P", "W /* ---------- speech engine ---------- */
let voices = [], RUN = 0;

const MALE = /\bmale\b|alex|aaron|evan|nathan|tom|daniel|oliver|arthur|lee|gordon|rishi|guy|christopher|eric|andrew|brian|roger|ryan|liam|william|david|mark|matthew|james|thomas|noah|jamie/i;
const GOOD = /samantha|alex|ava|zoe|allison|susan|evan|nathan|tom|daniel|karen|moira|tessa|serena|kate|oliver|arthur|jenny|aria|guy|libby|sonia|ryan|clara|liam|natural|neural|google/i;

/* ---------- transcription check ---------- */

function resultText(s) {

  const lines = ["Office Listening Lab results", `Name: ${ST.name || "(not given)"}`, `Script: ${s.num}. ${s.title} (Part ${s.part}: ${s.partTitle})`,
    `Score: ${pct}% (${R.matched} of ${R.graded} words${R.rest.length ? ", checked up to where I stopped" : ""})`, "",
    `Small words I missed: ${cap(R.small.map(([w, c]) => c > 1 ? `${w} (${c})` : w), 30)}`,
    `Other words I missed: ${cap(R.other, 40)}`, `Extra or misspelled words I wrote: ${cap(R.extra, 30)}`];
  if (ST.gist) lines.push("", `My answers after the first listen: ${ST.gist.slice(0, 500)}`);
  return lines.join("\n");
}

/* ---------- routing ---------- */
function route() {
  const h = location.hash;
  if (h.startsWith("#script-")) renderScript(+h.slice(8)); else renderHome();
  renderNav($("#q").value); closeMenu();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-script],[data-home]"); if (!b) return;
  location.hash = b.hasAttribute("data-home") ? "#home" : "#script-" + b.dataset.script;
});
$("#q").addEventListener("input", e => renderNav(e.target.value));
function closeMenu() { $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false"); }
$("#menuBtn").onclick = () => { $("#sidebar").classList.add("open"); $("#scrim").classList.add("open"); $("#menuBtn").setAttribute("aria-expanded", "true"); };
$("#scrim").onclick = closeMenu;
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); stopAll(); } });
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", () => { if ("speechSynthesis" in window) speechSynthesis.cancel(); });
renderProgress();
route();
</script>
</body>
</html>
