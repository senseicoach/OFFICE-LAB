89], [51.24, 54.21], [54.81, 56.11], [56.46, 58.54], [59.14, 59.78], [60.13, 60.77], [61.37, 66.61], [66.96, 69.42], [70.02, 71.15], [71.5, 73.36], [73.71, 76.39], [76.74, 78.81], [79.41, 80.4], [80.75, 81.66], [82.26, 84.61], [85.21, 85.69], [86.04, 86.85], [87.2, 88.63], [89.23, 90.44], [90.79, 91.65], [92.25, 92.76], [93.11, 95.99], [96.34, 98.55], [99.15, 100.14], [100.49, 102.28], [102.88, 103.76], [104.11, 106.05]], "R": [["You're in a hybrid meeting. Someone online can't hear.", "Paul", "Sorry, I missed the first part.", "No problem, Paul. I was asking if you've booked the room for the fourteenth."], ["Your manager hands the meeting to you.", "Karen", "Larissa, over to you.", "Thanks, Karen. Paul, if you have a question, just jump in or put your hand up in the chat."]]}, {"num": 46, "title": "Ending a Call Politely", "lines": [["P", "... and then my brother-in-law said we should go camping, in April! Can you believe it? It was snowing.", "Paul"], ["S", "That sounds cold. Poor you.", "Larissa"], ["P", "Honestly, it was terrible. The tent almost blew away. Anyway, where was I?", "Paul"], ["S", "I think we'd finished the training details. Actually, Paul, I'm sorry, but I've got a hard stop at three. I have another meeting.", "Larissa"], ["P", "Oh, of course! I've kept you too long. I talk too much.", "Paul"], ["S", "Not at all. It was great to catch up. So, just to confirm, you'll send me the list of names by Friday?", "Larissa"], ["P", "Yes, Friday at the latest.", "Paul"], ["S", "Great. And I'll send you the final schedule on Monday.", "Larissa"], ["P", "Perfect. Anything else?", "Paul"], ["S", "I think that's everything. If anything comes up, just send me a message.", "Larissa"], ["P", "Will do. Thanks, Larissa. Good luck with your next meeting.", "Paul"], ["S", "Thanks, Paul. Talk soon. Bye!", "Larissa"], ["P", "Bye!", "Paul"], ["P", "That was a very nice exit. Very professional.", "Rodrigo"], ["S", "Thanks. I was starting to panic. He was telling me about his camping trip for ten minutes.", "Larissa"], ["P", "Paul always does that. He's lovely, but he can talk forever. That's why I schedule our calls for twenty minutes before lunch.", "Rodrigo"], ["S", "That's smart. What do you say when you want to end a call, but you don't have another meeting?", "Larissa"], ["P", "My favourite is \"I'll let you go.\" It sounds like you're doing them a favour.", "Rodrigo"], ["S", "\"I'll let you go.\" Susan said that to me last week!", "Larissa"], ["P", "See? You're learning all the secrets.", "Rodrigo"]], "words": 239, "kind": "story", "scene": "April, a phone call, then Larissa's desk.", "F": "Phrases for ending a call: \"I've got a hard stop at three,\" \"Just to confirm,\" \"If anything comes up,\" and \"I'll let you go.\" \"Catch up\" means talk after some time apart.", "V": "", "t": [[0.3, 3.46], [3.81, 5.17], [5.52, 6.72], [7.32, 8.36], [8.71, 9.31], [9.91, 11.59], [11.94, 13.73], [14.08, 15.57], [16.17, 18.15], [18.5, 22.13], [22.48, 23.58], [24.18, 25.39], [25.74, 27.28], [27.63, 28.96], [29.56, 30.3], [30.65, 31.93], [32.28, 36.3], [36.9, 38.67], [39.27, 39.85], [40.2, 42.65], [43.25, 44.03], [44.38, 45.53], [46.13, 47.38], [47.73, 50.28], [50.88, 51.78], [52.13, 53.39], [53.74, 55.48], [56.08, 56.88], [57.23, 57.99], [58.34, 58.86], [59.46, 60.15], [60.75, 62.18], [62.53, 63.59], [64.19, 64.77], [65.12, 66.32], [66.67, 69.5], [70.1, 71.34], [71.69, 73.6], [73.95, 77.45], [78.05, 78.8], [79.15, 82.93], [83.53, 85.26], [85.61, 87.51], [88.11, 89.01], [89.36, 91.15], [91.75, 92.3], [92.65, 94.12]], "R": [["A colleague on the phone keeps talking, and you have another meeting.", "Paul", "…and anyway, the camping trip was a disaster.", "That sounds terrible! Paul, I'm sorry, but I've got a hard stop at three. Can we confirm the next steps quickly?"], ["You want to end the call politely.", "Paul", "Anything else?", "I think that's everything. If anything comes up, just send me a message. Talk soon!"]]}]}, {"part": 6, "title": "Indirect Canadian English", "desc": "What people say, what they really mean, and how to answer.", "scripts": [{"num": 47, "title": "Sorry, Sorry, Sorry", "lines": [["S", "Rodrigo, can I ask you something strange? Why does everyone here say \"sorry\" all the time?", "Larissa"], ["P", "Ha! You noticed. What happened?", "Rodrigo"], ["S", "This morning, I bumped into someone in the elevator. It was my fault, but he said sorry to me. Then Megan said sorry because her coffee was on my desk. And Greg said sorry when he asked me a question.", "Larissa"], ["P", "Yeah. In Canada, \"sorry\" doesn't always mean \"I apologize.\" It has lots of different meanings.", "Rodrigo"], ["S", "Like what?", "Larissa"], ["P", "Sometimes, it just means \"excuse me.\" Like, \"Sorry, can I get past?\" Sometimes it means \"I didn't hear you,\" like \"Sorry?\" with a question.", "Rodrigo"], ["S", "Oh, like \"pardon\"?", "Larissa"], ["P", "Exactly. And sometimes it means \"I feel bad for you.\" If you tell someone your flight was cancelled, they'll say, \"Oh, I'm sorry.\" It doesn't mean they did anything.", "Rodrigo"], ["S", "That makes sense. In Portuguese, we'd say \"que pena.\"", "Larissa"], ["P", "Right. And the elevator guy? That's just Canadian politeness. People say sorry to avoid any tension, even when it's not their fault.", "Rodrigo"], ["S", "So, should I say sorry more too?", "Larissa"], ["P", "For small things, sure. It sounds friendly. But be careful at work. Remember what Karen said about your emails?", "Rodrigo"], ["S", "Yes. Too many apologies make me sound less confident.", "Larissa"], ["P", "Exactly. So, \"sorry\" in the elevator is great. \"Sorry\" at the start of every email, not so much.", "Rodrigo"], ["S", "Sorry, this is complicated.", "Larissa"], ["P", "See? You're already Canadian.", "Rodrigo"]], "words": 226, "kind": "story", "scene": "April, the kitchen.", "F": "\"Sorry\" can mean \"I apologize,\" \"excuse me,\" \"pardon?\" or \"I feel bad for you.\" Listen to the tone: \"Sorry?\" with rising intonation means \"I didn't hear you.\"", "V": "", "t": [[0.3, 2.82], [3.17, 5.82], [6.42, 6.95], [7.3, 8.12], [8.47, 9.24], [9.84, 13.0], [13.35, 15.8], [16.15, 19.54], [19.89, 22.56], [23.16, 23.78], [24.13, 27.31], [27.66, 29.27], [29.87, 30.6], [31.2, 33.4], [33.75, 35.32], [35.67, 38.47], [38.82, 39.72], [40.32, 41.38], [41.98, 42.75], [43.1, 45.55], [45.9, 49.83], [50.18, 51.69], [52.29, 53.18], [53.53, 55.74], [56.34, 56.92], [57.27, 58.39], [58.74, 60.33], [60.68, 64.91], [65.51, 67.34], [67.94, 69.17], [69.52, 70.63], [70.98, 72.22], [72.57, 74.67], [75.27, 75.83], [76.18, 78.98], [79.58, 80.35], [80.7, 82.65], [83.0, 85.9], [86.5, 88.26], [88.86, 89.41], [89.76, 90.99]], "R": [["You bump into someone in the elevator.", "Stranger", "Oh, sorry!", "Sorry! My fault."], ["You didn't hear what a colleague said.", "Greg", "The meeting moved to four.", "Sorry? Did you say four?"]]}, {"num": 48, "title": "No Worries", "lines": [["P", "Okay, that should do it. Your second monitor is working now.", "Kevin"], ["S", "Oh, amazing! Thank you so much, Kevin. I'm sorry it took so long.", "Larissa"], ["P", "No worries. It happens all the time with those cables.", "Kevin"], ["S", "Seriously, thank you. I know you're really busy.", "Larissa"], ["P", "Not a problem. That's what I'm here for.", "Kevin"], ["S", "Can I ask you something, Kevin? You said \"no worries,\" then \"not a problem.\" Are they the same?", "Larissa"], ["P", "Pretty much. They both mean \"you're welcome\" or \"it's fine.\" People here say them more than \"you're welcome,\" actually.", "Kevin"], ["S", "Really? At school, I learned to say \"you're welcome.\"", "Larissa"], ["P", "That's still correct. It just sounds a bit more formal. With colleagues, most people say \"no problem,\" \"no worries,\" or \"anytime.\"", "Kevin"], ["S", "And what about \"you bet\"? Greg says that a lot.", "Larissa"], ["P", "Ha, yeah, that's another one. It's very casual. It means \"of course\" or \"happy to help.\"", "Kevin"], ["S", "So, if I say thank you to Greg, and he says \"you bet,\" it's positive?", "Larissa"], ["P", "Totally positive. It's not like he's gambling or anything.", "Kevin"], ["S", "Good. I was a little confused the first time.", "Larissa"], ["P", "I can imagine. English has too many ways to say the same thing.", "Kevin"], ["S", "That's true. Well, thanks again, Kevin.", "Larissa"], ["P", "Anytime. And if the screen goes black again, just try unplugging it first. Nine times out of ten, that fixes it.", "Kevin"], ["S", "Unplug it first. Got it. And the tenth time?", "Larissa"], ["P", "The tenth time, you call me. And I say \"no worries\" again.", "Kevin"]], "words": 237, "kind": "story", "scene": "April, Larissa's desk.", "F": "Casual ways to say \"you're welcome\": \"no worries,\" \"no problem,\" \"not a problem,\" \"anytime,\" and \"you bet.\" \"Nine times out of ten\" means almost always.", "V": "", "t": [[0.3, 1.49], [1.84, 3.74], [4.34, 5.34], [5.69, 6.93], [7.28, 8.69], [9.29, 10.12], [10.47, 12.53], [13.13, 14.44], [14.79, 15.95], [16.55, 17.48], [17.83, 18.96], [19.56, 21.12], [21.47, 24.01], [24.36, 25.2], [25.8, 26.61], [26.96, 29.05], [29.4, 32.35], [32.95, 33.5], [33.85, 36.11], [36.71, 37.76], [38.11, 39.69], [40.04, 44.68], [45.28, 46.4], [46.75, 47.91], [48.51, 49.91], [50.26, 51.38], [51.73, 53.83], [54.43, 58.83], [59.43, 60.53], [60.88, 62.78], [63.38, 63.86], [64.21, 66.1], [66.7, 67.64], [67.99, 70.5], [71.1, 71.82], [72.17, 73.76], [74.36, 75.07], [75.42, 79.06], [79.41, 81.38], [81.98, 83.0], [83.35, 83.94], [84.29, 85.26], [85.86, 87.2], [87.55, 89.12]], "R": [["You thank IT for fixing your computer.", "Kevin", "Okay, that should do it.", "Thanks so much, Kevin. I really appreciate it."], ["A colleague thanks you for your help.", "Megan", "Thanks for sending those photos!", "No worries! Anytime."]]}, {"num": 49, "title": "\"That's an Interesting Idea\"", "lines": [["S", "So, that's my idea. Instead of doing all the training in person, we could record the sessions and put them online. People could watch them whenever they want.", "Larissa"], ["P", "Interesting. That's an interesting idea.", "Greg"], ["P", "Yes, definitely something to think about. Let's keep it in mind for the future. Okay, next item.", "Karen"], ["P", "So, how did it feel?", "Megan"], ["S", "Honestly, good! They said it was interesting. Karen said it was something to think about.", "Larissa"], ["P", "Hmm. Larissa, I hate to tell you this, but that was probably a polite no.", "Megan"], ["S", "What? But they said \"interesting\"!", "Larissa"], ["P", "I know. But when someone says \"interesting\" and then moves straight to the next item, it usually means \"not right now.\" \"Let's keep it in mind\" is the same.", "Megan"], ["S", "Oh. So they didn't like my idea?", "Larissa"], ["P", "Not necessarily. Maybe they liked it, but the timing is wrong, or it costs too much. You just don't know yet.", "Megan"], ["S", "So, what should I do? Forget about it?", "Larissa"], ["P", "No. Ask Karen about it privately. Something like, \"I'd love to hear what you really thought of the online training idea. What would make it work?\"", "Megan"], ["S", "That's a good question. Then she has to give a real answer.", "Larissa"], ["P", "Exactly. And if the answer is about money, you can come back with a cheaper version.", "Megan"], ["S", "In Brazil, if my boss didn't like my idea, he would just tell me in the meeting.", "Larissa"], ["P", "Honestly, that sounds easier. Here, you have to be a bit of a detective.", "Megan"], ["S", "A detective. Okay. I'll go and investigate.", "Larissa"]], "words": 247, "kind": "story", "scene": "April, a team meeting, then the hallway.", "F": "\"That's an interesting idea\" and \"Let's keep it in mind\" often mean \"not now.\" Listen to what happens next: if the speaker changes the topic quickly, it's probably a polite no.", "V": "", "t": [[0.3, 1.71], [2.06, 7.2], [7.55, 10.0], [10.6, 11.49], [11.84, 13.68], [14.28, 16.45], [16.8, 18.68], [19.03, 20.34], [20.94, 22.15], [22.75, 23.76], [24.11, 25.41], [25.76, 27.72], [28.32, 28.87], [29.22, 33.29], [33.89, 34.37], [34.72, 36.06], [36.66, 37.39], [37.74, 43.85], [44.2, 46.16], [46.76, 47.18], [47.53, 49.01], [49.61, 50.75], [51.1, 54.8], [55.15, 56.47], [57.07, 58.28], [58.63, 59.45], [60.05, 60.64], [60.99, 62.62], [62.97, 67.62], [67.97, 69.17], [69.77, 70.82], [71.17, 72.99], [73.59, 74.42], [74.77, 78.6], [79.2, 84.3], [84.9, 86.64], [86.99, 89.23], [89.83, 90.69], [91.04, 91.62], [91.97, 93.34]], "R": [["You suggest an idea, and the reaction is polite but unclear.", "Karen", "Interesting. Let's keep it in mind for the future.", "Thanks. Could we talk about it later? I'd love to hear what would make it work."], ["Later, you ask your manager what she really thought.", "Karen", "What did you want to talk about?", "The online training idea. I'd love to hear what you really thought. What would make it work?"]]}, {"num": 50, "title": "\"You Might Want To…\"", "lines": [["P", "Okay, Larissa, the plan looks good. Just a couple of thoughts. You might want to add a session for the night shift. And I'd maybe think about moving the first session to a Tuesday.", "Susan"], ["S", "Okay, those are good ideas. I'll consider them.", "Larissa"], ["P", "Great. And it might be worth checking with Siobhan about the room. Anyway, I'll let you get back to it. Thanks, Larissa.", "Susan"], ["S", "Thanks, Susan. Talk soon.", "Larissa"], ["P", "So, what are you going to change?", "Greg"], ["S", "I'm not sure. She said I might want to add a session. So, it's optional, right?", "Larissa"], ["P", "Oh, no. Not optional. When a client says \"you might want to,\" it means \"please do this.\"", "Greg"], ["S", "Really? It sounded like a suggestion.", "Larissa"], ["P", "It's a suggestion in the grammar, but it's an instruction in real life. Same with \"I'd maybe think about.\" That means \"change it.\"", "Greg"], ["S", "So, all three things were instructions?", "Larissa"], ["P", "Pretty much. The night shift session, the Tuesday, and checking with Siobhan. I'd do all three before the next call.", "Greg"], ["S", "Wow. I almost ignored them. That would have been a disaster.", "Larissa"], ["P", "It happens. Susan's very polite. She'll never say \"do this.\" But she'll definitely notice if you don't.", "Greg"], ["S", "So how do I know when something is really optional?", "Larissa"], ["P", "If they really don't care, they'll say something like \"It's totally up to you\" or \"Either way is fine.\"", "Greg"], ["S", "Okay. \"You might want to\" means do it. \"It's up to you\" means it's optional.", "Larissa"], ["P", "You got it. Now, go add that night shift session.", "Greg"]], "words": 245, "kind": "story", "scene": "April, a video call, then Larissa's desk.", "F": "Soft instructions: \"You might want to,\" \"I'd maybe think about,\" and \"It might be worth\" all usually mean \"please do this.\" Real options sound like \"It's totally up to you.\"", "V": "", "t": [[0.3, 2.19], [2.54, 3.85], [4.2, 6.56], [6.91, 10.48], [11.08, 12.93], [13.28, 14.23], [14.83, 15.45], [15.8, 18.51], [18.86, 20.65], [21.0, 21.96], [22.56, 23.54], [23.89, 24.64], [25.24, 27.09], [27.69, 28.48], [28.83, 30.9], [31.25, 32.55], [33.15, 33.97], [34.32, 35.35], [35.7, 39.54], [40.14, 40.69], [41.04, 42.55], [43.15, 47.47], [47.82, 49.77], [50.12, 51.39], [51.99, 54.13], [54.73, 55.68], [56.03, 59.44], [59.79, 61.91], [62.51, 62.99], [63.34, 64.62], [64.97, 66.29], [66.89, 67.8], [68.15, 69.64], [69.99, 71.61], [71.96, 74.23], [74.83, 77.73], [78.33, 84.19], [84.79, 85.36], [85.71, 87.1], [87.45, 89.37], [89.97, 90.86], [91.21, 93.32]], "R": [["A client makes a soft suggestion.", "Susan", "You might want to add a session for the night shift.", "Good idea. I'll add a night shift session and send you the updated plan."], ["A client says something is really your choice.", "Susan", "Honestly, either way is fine. It's totally up to you.", "Okay, great. Then I'll keep it on Tuesday."]]}, {"num": 51, "title": "\"We Should Grab Lunch Sometime\"", "lines": [["P", "Hey, Larissa! Great job in the meeting today. We should grab lunch sometime.", "Megan"], ["S", "Oh, I'd love that! When are you free?", "Larissa"], ["P", "Oh, um, let me check my calendar. How about next Thursday?", "Megan"], ["S", "Perfect. Thursday it is.", "Larissa"], ["P", "Great! I'll send you an invite.", "Megan"], ["P", "Wow. That was impressive.", "Rodrigo"], ["S", "What was impressive? We just made plans for lunch.", "Larissa"], ["P", "Exactly. You turned \"we should grab lunch sometime\" into a real lunch. Most people never do that.", "Rodrigo"], ["S", "What do you mean? She invited me.", "Larissa"], ["P", "Well, kind of. Here, \"we should grab lunch sometime\" or \"let's get coffee sometime\" is often just a friendly thing to say. Like \"have a nice day.\" People don't always mean it as a real invitation.", "Rodrigo"], ["S", "Oh no. So, did I put her in a difficult position?", "Larissa"], ["P", "Not at all. She seemed happy. Megan likes you. But with some people, if you ask \"when,\" they get a bit uncomfortable.", "Rodrigo"], ["S", "So, how do I know if it's a real invitation?", "Larissa"], ["P", "A real invitation usually has details. A day, a time, a place. \"Want to grab lunch on Thursday?\" is real. \"We should grab lunch sometime\" might be real, or might just be nice.", "Rodrigo"], ["S", "And if I want to make it real?", "Larissa"], ["P", "Do exactly what you did. Say \"I'd love that,\" and suggest a day. If they say yes, great. If they say \"Oh, things are crazy right now,\" then it was just a nice thing to say.", "Rodrigo"], ["S", "This is exhausting.", "Larissa"], ["P", "I know. But you're getting good at it.", "Rodrigo"]], "words": 246, "kind": "story", "scene": "April, the hallway.", "F": "\"We should grab lunch sometime\" is friendly but not always a real plan. A real invitation has a day, a time, or a place. \"Things are crazy right now\" is a polite way to say \"not soon.\"", "V": "", "t": [[0.3, 1.26], [1.61, 3.33], [3.68, 5.21], [5.81, 6.96], [7.31, 8.18], [8.78, 10.84], [11.19, 12.62], [13.22, 13.86], [14.21, 15.12], [15.72, 16.4], [16.75, 18.02], [18.62, 19.2], [19.55, 20.62], [21.22, 22.26], [22.61, 24.07], [24.67, 25.44], [25.79, 29.14], [29.49, 30.92], [31.52, 32.29], [32.64, 33.6], [34.2, 35.1], [35.45, 41.93], [42.28, 43.46], [43.81, 46.71], [47.31, 47.89], [48.24, 50.63], [51.23, 51.99], [52.34, 53.34], [53.69, 54.71], [55.06, 58.79], [59.39, 62.14], [62.74, 65.05], [65.4, 66.67], [67.02, 68.71], [69.06, 69.77], [70.12, 74.08], [74.68, 76.15], [76.75, 78.1], [78.45, 80.51], [80.86, 82.18], [82.53, 87.47], [88.07, 89.17], [89.77, 90.43], [90.78, 92.0]], "R": [["A colleague says something friendly in the hallway.", "Megan", "We should grab lunch sometime.", "I'd love that! Are you free next Thursday?"], ["A colleague's answer tells you it's not a real plan yet.", "Megan", "Oh, things are crazy right now.", "No problem! Let me know when things calm down."]]}, {"num": 52, "title": "\"Not Bad at All\"", "lines": [["P", "So, how did the Toronto sessions go?", "Greg"], ["S", "Really well, I think. Everyone attended, and the feedback forms were very positive.", "Larissa"], ["P", "Not bad! Not bad at all.", "Greg"], ["S", "Oh. Only \"not bad\"? I thought it went well.", "Larissa"], ["P", "No, no, \"not bad at all\" is a compliment. It means \"really good.\" Canadians just don't like to sound too excited.", "Greg"], ["S", "Really? In Portuguese, \"not bad\" is just okay.", "Larissa"], ["P", "Here, it depends on the tone. If I say \"not bad\" with a smile, it's good. \"Not bad at all\" is even better.", "Greg"], ["S", "Okay. Good to know. There was one small issue, though. The projector didn't work in the second session.", "Larissa"], ["P", "Oh, that's a bit of a pain. What did you do?", "Greg"], ["S", "We used Kevin's laptop and everyone sat closer. It was fine.", "Larissa"], ["P", "Well, it's not the end of the world. Sounds like you handled it.", "Greg"], ["S", "Wait. You just said \"a bit of a pain\" and \"not the end of the world.\" Is that bad or okay?", "Larissa"], ["P", "Ha! Okay. \"A bit of a pain\" means annoying, but small. \"Not the end of the world\" means don't worry about it.", "Greg"], ["S", "So, Canadians make good things sound smaller and bad things sound smaller too?", "Larissa"], ["P", "Pretty much. Oh, and if someone says something is \"a bit of a problem,\" be careful. That usually means it's a big problem.", "Greg"], ["S", "So, when a Canadian says \"a bit,\" I should multiply it by ten?", "Larissa"], ["P", "Sometimes by a hundred. You're learning the code.", "Greg"]], "words": 240, "kind": "story", "scene": "May, Greg's desk.", "F": "Understatement makes things sound smaller than they are. \"Not bad at all\" means very good. \"A bit of a pain\" means annoying. \"A bit of a problem\" can mean a serious problem.", "V": "", "t": [[0.3, 2.74], [3.34, 4.41], [4.76, 8.35], [8.95, 9.83], [10.18, 11.34], [11.94, 12.36], [12.71, 13.71], [14.06, 15.09], [15.69, 18.46], [18.81, 20.38], [20.73, 23.58], [24.18, 24.74], [25.09, 27.79], [28.39, 30.22], [30.57, 33.43], [33.78, 35.77], [36.37, 36.95], [37.3, 38.01], [38.36, 39.83], [40.18, 42.58], [43.18, 44.81], [45.16, 46.23], [46.83, 49.87], [50.22, 51.03], [51.63, 53.64], [53.99, 55.46], [56.06, 56.6], [56.95, 60.26], [60.61, 61.87], [62.47, 63.03], [63.38, 64.16], [64.51, 67.13], [67.48, 70.64], [71.24, 76.23], [76.83, 77.77], [78.12, 82.71], [83.06, 85.46], [86.06, 90.35], [90.95, 92.4], [92.75, 94.0]], "R": [["A colleague asks how your sessions went.", "Greg", "So, how did the sessions go?", "Really well, thanks. Everyone came, and the feedback was very positive."], ["A colleague reacts to a small problem.", "Greg", "Oh, that's a bit of a pain. What did you do?", "We used Kevin's laptop, and everyone sat closer. It was fine in the end."]]}, {"num": 53, "title": "\"When You Get a Chance\"", "lines": [["P", "Larissa, did you get my email yesterday? About the Toronto numbers?", "Karen"], ["S", "Yes, I did. You asked me to send them when I get a chance. I was planning to do it at the end of the week.", "Larissa"], ["P", "Ah. Sorry, that's my fault. I needed them for a meeting this afternoon.", "Karen"], ["S", "Oh no. I thought \"when you get a chance\" meant there was no rush.", "Larissa"], ["P", "That's fair. Honestly, it's a confusing expression. Sometimes it means \"no rush,\" and sometimes it means \"soon, please.\" I should have given you a time.", "Karen"], ["S", "I can send them in thirty minutes. Is that okay?", "Larissa"], ["P", "That would be perfect. Thank you.", "Karen"], ["S", "Karen, how can I tell the difference next time?", "Larissa"], ["P", "Good question. Look at the context. If it's something for a meeting or a client, it probably means today. If you're not sure, just ask. \"Do you need this by a specific time?\"", "Karen"], ["S", "That's simple. I'll do that.", "Larissa"], ["P", "And there are other phrases like that. \"Would you be able to\" and \"I was wondering if you could.\" They sound like questions, but they're usually requests.", "Karen"], ["S", "So I can't really say no?", "Larissa"], ["P", "You can say no if there's a good reason. But usually, the person expects a yes.", "Karen"], ["S", "And \"at your earliest convenience\"?", "Larissa"], ["P", "That one's funny. It sounds relaxed, but it actually means \"as soon as possible.\" Clients use it a lot.", "Karen"], ["S", "Okay. So, polite words, urgent meaning.", "Larissa"], ["P", "Exactly. And I'll try to write clear deadlines from now on. That's a good lesson for me too.", "Karen"]], "words": 249, "kind": "story", "scene": "May, Karen's office.", "F": "\"When you get a chance\" can mean \"no rush\" or \"soon.\" \"At your earliest convenience\" means as soon as possible. When in doubt, ask: \"Do you need this by a specific time?\"", "V": "", "t": [[0.3, 2.78], [3.13, 4.66], [5.26, 6.21], [6.56, 8.92], [9.27, 11.48], [12.08, 12.58], [12.93, 14.32], [14.67, 16.9], [17.5, 18.07], [18.42, 21.42], [22.02, 22.75], [23.1, 25.32], [25.67, 29.67], [30.02, 31.41], [32.01, 33.79], [34.14, 35.06], [35.66, 36.78], [37.13, 37.82], [38.42, 41.04], [41.64, 42.57], [42.92, 44.07], [44.42, 48.08], [48.43, 50.01], [50.36, 52.32], [52.92, 53.75], [54.1, 54.81], [55.41, 57.24], [57.59, 60.67], [61.02, 64.09], [64.69, 66.1], [66.7, 68.84], [69.19, 71.58], [72.18, 73.94], [74.54, 75.47], [75.82, 79.3], [79.65, 81.02], [81.62, 82.19], [82.54, 84.73], [85.33, 86.13], [86.48, 88.82], [89.17, 90.75]], "R": [["Your manager asks for something \"when you get a chance.\"", "Karen", "Could you send me the Toronto numbers when you get a chance?", "Sure. Do you need them by a specific time?"], ["A client writes \"at your earliest convenience.\"", "Susan", "Could you send the updated budget at your earliest convenience?", "Of course, Susan. I'll send it this afternoon."]]}, {"num": 54, "title": "Saying No Without Saying No", "lines": [["P", "Larissa, perfect timing! Could you take over the client onboarding for the Surrey account? It's just a few meetings.", "Greg"], ["S", "Oh. I'd love to help, Greg, but that might be a bit tricky right now. I'm running the Toronto project until the end of May.", "Larissa"], ["P", "Hmm. Are you sure? It's really not much work.", "Greg"], ["S", "Let me see what I can do. I'll check my schedule and get back to you tomorrow.", "Larissa"], ["P", "Okay, great. Thanks!", "Greg"], ["P", "Nicely done.", "Megan"], ["S", "What do you mean? I think I just said yes.", "Larissa"], ["P", "No, you didn't. You said \"that might be tricky\" and \"let me see what I can do.\" That's the Canadian way of saying \"probably not.\"", "Megan"], ["S", "Really? It felt like a yes.", "Larissa"], ["P", "Greg knows the code. He heard \"probably not, but I'll think about it.\" Now you have time to decide.", "Megan"], ["S", "But what if I decide it's a no? What do I say tomorrow?", "Larissa"], ["P", "Keep it positive. Something like, \"I've looked at my schedule, and I really can't take it on until June. But I could help with the first meeting.\" That way, you're saying no, but you're still offering something.", "Megan"], ["S", "That's much easier than just saying \"no.\"", "Larissa"], ["P", "Exactly. A direct \"no\" can sound really harsh here. So we wrap it in something soft.", "Megan"], ["S", "In Brazil, we soften things too, but we usually use more words and more warmth.", "Larissa"], ["P", "Then you already have the skill. You just need the Canadian vocabulary.", "Megan"], ["S", "Don't worry. I'm learning fast.", "Larissa"]], "words": 240, "kind": "story", "scene": "May, the team area.", "F": "Soft ways to say no: \"That might be a bit tricky,\" \"Let me see what I can do,\" and \"I can't take it on until June, but I could…\" Offering something smaller keeps the relationship positive.", "V": "", "t": [[0.3, 1.91], [2.26, 5.63], [5.98, 7.44], [8.04, 8.46], [8.81, 12.54], [12.89, 16.12], [16.72, 17.25], [17.6, 18.54], [18.89, 20.45], [21.05, 22.32], [22.67, 25.61], [26.21, 27.31], [27.66, 28.39], [28.99, 29.94], [30.54, 31.3], [31.65, 32.93], [33.53, 34.49], [34.84, 37.91], [38.26, 41.0], [41.6, 42.15], [42.5, 43.59], [44.19, 45.39], [45.74, 48.24], [48.59, 50.19], [50.79, 52.38], [52.73, 53.96], [54.56, 55.69], [56.04, 60.89], [61.24, 62.94], [63.29, 66.16], [66.76, 68.74], [69.34, 70.18], [70.53, 72.94], [73.29, 75.04], [75.64, 80.72], [81.32, 82.68], [83.03, 85.45], [86.05, 86.72], [87.07, 88.1]], "R": [["A colleague asks you to take on extra work.", "Greg", "Could you take over the Surrey onboarding?", "I'd love to help, Greg, but that might be a bit tricky right now. Let me see what I can do and get back to you tomorrow."], ["You decide the answer is no.", "Greg", "So, can you take it on?", "I've looked at my schedule, and I really can't take it on until June. But I could help with the first meeting."]]}, {"num": 55, "title": "Elevator Small Talk", "lines": [["P", "Morning, Larissa! How are you?", "Priya"], ["S", "Good, thanks, Priya. How are you?", "Larissa"], ["P", "Not too bad, thanks. Can you believe this rain? It's been raining for, what, twelve days now?", "Priya"], ["S", "I know. My umbrella broke on the way here.", "Larissa"], ["P", "Oh no! Well, at least it's not snow. Could be worse.", "Priya"], ["S", "That's true. Although in Belo Horizonte, it's thirty degrees right now.", "Larissa"], ["P", "Don't tell me that. I'm so jealous. Anyway, have a good one!", "Priya"], ["S", "You too!", "Larissa"], ["P", "Look at you! Perfect Vancouver small talk.", "Rodrigo"], ["S", "Was it? I felt like we said nothing.", "Larissa"], ["P", "That's the point. Elevator small talk isn't really about information. It's about being friendly.", "Rodrigo"], ["S", "But she asked \"How are you?\" and didn't wait for a real answer.", "Larissa"], ["P", "Right. \"How are you?\" here is basically \"hello.\" The normal answer is \"Good, thanks,\" or \"Not too bad.\" You don't tell her about your problems.", "Rodrigo"], ["S", "And \"not too bad\" means good?", "Larissa"], ["P", "It usually means \"fine, normal.\" Like we learned with Greg. Canadians make everything a bit smaller.", "Rodrigo"], ["S", "And why does everyone talk about the weather?", "Larissa"], ["P", "Because it's safe. Everyone has an opinion, and nobody gets offended. And in Vancouver, there's always rain to complain about.", "Rodrigo"], ["S", "\"Could be worse\" is a very Canadian thing to say, isn't it?", "Larissa"], ["P", "The most Canadian. It means \"this is bad, but let's stay positive.\"", "Rodrigo"], ["S", "And \"have a good one\"? A good what?", "Larissa"], ["P", "A good day. A good anything. It's just a friendly goodbye.", "Rodrigo"], ["S", "Okay. Have a good one, Rodrigo.", "Larissa"], ["P", "You too. You're a natural.", "Rodrigo"]], "words": 244, "kind": "story", "scene": "May, the elevator, then the hallway.", "F": "\"How are you?\" is often just a greeting; answer \"Good, thanks\" and ask back. \"Could be worse\" means \"it's bad, but let's stay positive.\" \"Have a good one\" is a friendly goodbye.", "V": "", "t": [[0.3, 1.36], [1.71, 2.54], [3.14, 4.46], [4.81, 5.54], [6.14, 7.34], [7.69, 9.05], [9.4, 11.67], [12.27, 12.86], [13.21, 14.93], [15.53, 16.24], [16.59, 18.05], [18.4, 19.26], [19.86, 20.58], [20.93, 24.26], [24.86, 25.84], [26.19, 27.24], [27.59, 28.91], [29.51, 30.16], [30.76, 31.59], [31.94, 33.52], [34.12, 34.72], [35.07, 36.44], [37.04, 37.96], [38.31, 41.48], [41.83, 43.14], [43.74, 45.17], [45.52, 47.17], [47.77, 48.35], [48.7, 49.59], [49.94, 51.36], [51.71, 54.95], [55.3, 57.14], [57.74, 59.15], [59.75, 61.53], [61.88, 63.1], [63.45, 65.56], [66.16, 68.33], [68.93, 69.93], [70.28, 73.16], [73.51, 76.51], [77.11, 80.73], [81.33, 82.39], [82.74, 85.44], [86.04, 87.0], [87.35, 88.12], [88.72, 89.54], [89.89, 90.86], [91.21, 92.7], [93.3, 93.87], [94.22, 95.49], [96.09, 96.82], [97.17, 98.08]], "R": [["You're in the elevator with a colleague.", "Priya", "Morning! How are you?", "Good, thanks! How are you?"], ["Your colleague talks about the weather.", "Priya", "Can you believe this rain?", "I know! Well, at least it's not snow. Could be worse."]]}, {"num": 56, "title": "Reading Between the Lines of an Email", "lines": [["S", "Rodrigo, can you help me read this email from Susan? I think she's annoyed, but I'm not sure.", "Larissa"], ["P", "Sure. Read it to me.", "Rodrigo"], ["S", "\"Hi Larissa, just circling back on my email from last week. As per my previous message, we still need the night shift schedule. Just a friendly reminder that the deadline is Friday. Thanks so much!\"", "Larissa"], ["P", "Oh. Yeah. She's annoyed.", "Rodrigo"], ["S", "But she said \"friendly\" and \"thanks so much\"!", "Larissa"], ["P", "I know. But look at the other phrases. \"Just circling back\" means \"you didn't answer me.\" \"As per my previous message\" means \"I already told you this.\"", "Rodrigo"], ["S", "Oh no.", "Larissa"], ["P", "And \"just a friendly reminder\" is often not very friendly. It means \"please don't forget again.\"", "Rodrigo"], ["S", "But I did answer her! I sent the schedule on Tuesday.", "Larissa"], ["P", "Did you send it to Susan, or to Siobhan?", "Rodrigo"], ["S", "Oh. To Siobhan. Because she's the operations manager.", "Larissa"], ["P", "That explains it. Susan probably never saw it.", "Rodrigo"], ["S", "So, what should I do? Should I explain?", "Larissa"], ["P", "Reply quickly, and keep it simple. Something like, \"Hi Susan, thanks for following up. I sent the schedule to Siobhan on Tuesday. I've attached it here as well. Sorry for any confusion.\"", "Rodrigo"], ["S", "That sounds good. Not too many apologies, but one is okay here.", "Larissa"], ["P", "Exactly. One is perfect. And copy Siobhan, so everyone has the same information.", "Rodrigo"], ["S", "A few months ago, I would have thought this email was really nice.", "Larissa"], ["P", "And now?", "Rodrigo"], ["S", "Now I can hear the hidden message. It's like learning a second English.", "Larissa"], ["P", "That's exactly what it is. Office English.", "Rodrigo"]], "words": 251, "kind": "story", "scene": "May, Larissa's desk.", "F": "Email phrases that often show annoyance: \"Just circling back,\" \"As per my previous message,\" and \"Just a friendly reminder.\" A calm reply thanks the person, explains briefly, and fixes the problem.", "V": "", "t": [[0.3, 3.41], [3.76, 5.75], [6.35, 6.95], [7.3, 8.19], [8.79, 12.53], [12.88, 16.69], [17.04, 20.28], [20.63, 21.51], [22.11, 22.64], [22.99, 23.6], [23.95, 24.75], [25.35, 27.66], [28.26, 28.92], [29.27, 30.71], [31.06, 33.57], [33.92, 37.74], [38.34, 38.92], [39.52, 43.1], [43.45, 45.23], [45.83, 46.97], [47.32, 49.0], [49.6, 51.82], [52.42, 52.84], [53.19, 53.95], [54.3, 56.56], [57.16, 58.21], [58.56, 60.2], [60.8, 62.01], [62.36, 63.37], [63.97, 65.73], [66.08, 68.87], [69.22, 71.64], [71.99, 73.35], [73.7, 75.19], [75.79, 76.73], [77.08, 79.94], [80.54, 81.31], [81.66, 82.67], [83.02, 86.44], [87.04, 90.59], [91.19, 91.9], [92.5, 94.33], [94.68, 96.36], [96.96, 98.3], [98.65, 99.57]], "R": [["A client's email says, \"Just circling back on my last email.\"", "Susan", "Just circling back. We still need the night shift schedule.", "Hi Susan, thanks for following up. I sent it to Siobhan on Tuesday. I've attached it here as well. Sorry for any confusion."], ["A colleague asks you about an email phrase.", "Daniel", "What does \"just a friendly reminder\" mean?", "It usually means \"please don't forget again.\" The person is probably a little annoyed."]]}]}, {"part": 7, "title": "Problems at Work", "desc": "Mistakes, deadlines, conflict, outages, stress, and escalating.", "scripts": [{"num": 57, "title": "The Wrong Attachment", "lines": [["S", "Karen, do you have a minute? I made a mistake, and I need to tell you right away.", "Larissa"], ["P", "Okay. Take a breath. What happened?", "Karen"], ["S", "This morning, I sent Susan the project update. But I attached the wrong file. I sent her our internal budget, with our costs and our profit margin.", "Larissa"], ["P", "Ah. Okay. When did you send it?", "Karen"], ["S", "About twenty minutes ago. I noticed when I saw the file name in my sent folder. I feel terrible.", "Larissa"], ["P", "I understand. But you did the right thing by coming to me immediately. Have you tried to recall the email?", "Karen"], ["S", "Yes, but it didn't work. It says she already opened it.", "Larissa"], ["P", "Okay. Then here's what we'll do. First, send her the correct file right now, with a short note. Something like, \"Apologies, I attached the wrong document earlier. Please disregard it and delete it. The correct update is attached.\"", "Karen"], ["S", "Should I explain what the file was?", "Larissa"], ["P", "No. Keep it short. The less attention, the better. Then, I'll call Greg, because it's his client. He might want to mention it to Susan.", "Karen"], ["S", "Is this going to be a big problem?", "Larissa"], ["P", "Honestly, probably not. Our margins are normal for the industry. It's a bit embarrassing, but it's not the end of the world.", "Karen"], ["S", "I'm so sorry, Karen.", "Larissa"], ["P", "I know. And I appreciate that you told me straight away. The worst thing is when people hide mistakes. Everyone sends the wrong file once.", "Karen"], ["S", "Only once?", "Larissa"], ["P", "If you're lucky. Now go send that email.", "Karen"]], "words": 247, "kind": "story", "scene": "May, Karen's office.", "F": "\"Recall the email\" means try to take it back after sending. \"Please disregard it\" means please ignore it. \"Straight away\" means immediately.", "V": "", "t": [[0.3, 1.76], [2.11, 4.95], [5.55, 6.17], [6.52, 7.36], [7.71, 8.53], [9.13, 12.14], [12.49, 14.0], [14.35, 18.61], [19.21, 19.71], [20.06, 20.68], [21.03, 22.15], [22.75, 24.05], [24.4, 27.59], [27.94, 28.83], [29.43, 30.36], [30.71, 33.29], [33.64, 35.35], [35.95, 37.22], [37.57, 39.01], [39.61, 40.24], [40.59, 41.9], [42.25, 45.65], [46.0, 49.93], [50.28, 52.1], [52.45, 54.12], [54.72, 56.46], [57.06, 57.55], [57.9, 58.79], [59.14, 60.75], [61.1, 63.61], [63.96, 65.8], [66.4, 68.28], [68.88, 70.48], [70.83, 73.17], [73.52, 76.27], [76.87, 78.21], [78.81, 79.42], [79.77, 82.11], [82.46, 84.77], [85.12, 87.14], [87.74, 88.55], [89.15, 90.03], [90.38, 91.77]], "R": [["You sent the wrong file to a client.", "Karen", "Okay. Take a breath. What happened?", "I attached the wrong document to Susan's email. It was our internal budget. I noticed twenty minutes ago."], ["You write a short correction email.", "Karen", "What will you write to her?", "\"Apologies, I attached the wrong document earlier. Please disregard it and delete it. The correct update is attached.\""]]}, {"num": 58, "title": "Fixing It with the Client", "lines": [["P", "Hi, Larissa. I got your email. The one with the other file.", "Susan"], ["S", "Hi, Susan. Yes. I'm really sorry about that. It was my mistake. I attached the wrong document.", "Larissa"], ["P", "It happens. Don't worry. I've deleted it, and I haven't forwarded it to anyone.", "Susan"], ["S", "Thank you. I really appreciate that.", "Larissa"], ["P", "Honestly, I've done worse. Last year, I sent my holiday photos to our entire board of directors.", "Susan"], ["S", "Oh no! What did they say?", "Larissa"], ["P", "One of them said my kids were cute. So, it could have been worse. Anyway, I'm actually calling about the correct file. I have a couple of questions.", "Susan"], ["S", "Of course. Go ahead.", "Larissa"], ["P", "On page one, the night shift sessions are marked yellow. Is there a risk?", "Susan"], ["S", "A small one. Two of the trainers are on vacation in June, so we have fewer people available. But I've asked Kevin's team to help.", "Larissa"], ["P", "Okay. When will you know for sure?", "Susan"], ["S", "By Friday. If it's still a problem, I'll let you know right away, and we'll move those sessions to July.", "Larissa"], ["P", "That's fine. I appreciate that you're telling me early. I'd much rather know about a risk now than a problem later.", "Susan"], ["S", "That's exactly why I marked it yellow.", "Larissa"], ["P", "Good. Well, I think that's everything. And Larissa, about the email this morning, you handled it well. You fixed it quickly, and you didn't make a big deal of it.", "Susan"], ["S", "Thank you, Susan. That means a lot.", "Larissa"], ["P", "Okay. I'll let you go. Talk Friday.", "Susan"], ["S", "Talk Friday.", "Larissa"]], "words": 244, "kind": "story", "scene": "May, a phone call.", "F": "Notice Larissa's apology: one clear sentence, then she moves on. \"Make a big deal of it\" means treat it as more serious than it is. \"I'd much rather know\" means I strongly prefer to know.", "V": "", "t": [[0.3, 1.22], [1.57, 2.59], [2.94, 4.17], [4.77, 5.65], [6.0, 6.56], [6.91, 8.33], [8.68, 9.79], [10.14, 11.7], [12.3, 13.11], [13.46, 14.24], [14.59, 17.58], [18.18, 18.82], [19.17, 20.54], [21.14, 22.52], [22.87, 27.32], [27.92, 28.52], [28.87, 29.74], [30.34, 32.09], [32.44, 33.69], [34.04, 36.9], [37.25, 38.71], [39.31, 40.01], [40.36, 41.03], [41.63, 44.65], [45.0, 45.92], [46.52, 47.23], [47.58, 52.36], [52.71, 54.44], [55.04, 55.71], [56.06, 57.25], [57.85, 58.64], [58.99, 64.23], [64.83, 65.6], [65.95, 68.02], [68.37, 71.66], [72.26, 74.25], [74.85, 75.37], [75.72, 77.18], [77.53, 81.11], [81.46, 84.48], [85.08, 86.12], [86.47, 87.42], [88.02, 88.69], [89.04, 89.99], [90.34, 91.25], [91.85, 92.7]], "R": [["The client calls about your mistake.", "Susan", "I got your email. The one with the other file.", "Yes, I'm really sorry about that. It was my mistake."], ["The client asks about a risk.", "Susan", "Is there a risk with the night shift sessions?", "A small one. Two trainers are on vacation in June. I'll know for sure by Friday, and I'll tell you right away."]]}, {"num": 59, "title": "Asking for More Time", "lines": [["S", "Karen, I wanted to give you a heads-up. I don't think I'll finish the Toronto final report by Wednesday.", "Larissa"], ["P", "Okay. Thanks for telling me early. What's going on?", "Karen"], ["S", "I'm still waiting for the feedback forms from Paul's team. He said he'd send them last Friday, but I only got half of them.", "Larissa"], ["P", "Have you followed up with him?", "Karen"], ["S", "Twice. He said his team is really busy with their own deadline this week. I believe him, but I can't write the report without the data.", "Larissa"], ["P", "That's fair. So, what do you need?", "Karen"], ["S", "I think I could finish it by Monday. Would Monday work instead?", "Larissa"], ["P", "Let me think. The report is for the director meeting on Tuesday afternoon. So, Monday end of day is okay. But not later than that.", "Karen"], ["S", "Understood. Monday, end of day. I promise.", "Larissa"], ["P", "Great. And in the meantime, can you do the parts that don't need Paul's data? The summary, the budget, the lessons learned?", "Karen"], ["S", "Yes. Actually, I've already started those. The only missing part is the feedback section.", "Larissa"], ["P", "Perfect. Then it's really just one section. That's not bad at all.", "Karen"], ["S", "Should I tell Paul about the new deadline?", "Larissa"], ["P", "Yes. Be specific. Tell him you need the rest of the forms by Thursday, so you have time to write it up. Copy me if you think it'll help.", "Karen"], ["S", "Okay. I'll send him a message now.", "Larissa"], ["P", "Good. And Larissa, this is exactly how to handle it. You told me before the deadline, not after. That makes a big difference.", "Karen"], ["S", "I learned from the best.", "Larissa"], ["P", "Flattery will get you everywhere.", "Karen"]], "words": 260, "kind": "story", "scene": "May, Karen's office.", "F": "\"Would Monday work instead?\" is a polite way to ask for more time. \"In the meantime\" means while you wait. \"Flattery will get you everywhere\" is a joke reply to a compliment.", "V": "", "t": [[0.3, 2.46], [2.81, 6.46], [7.06, 7.69], [8.04, 9.45], [9.8, 10.78], [11.38, 14.36], [14.71, 18.42], [19.02, 20.39], [20.99, 21.61], [21.96, 25.75], [26.1, 29.65], [30.25, 30.98], [31.33, 32.46], [33.06, 34.9], [35.25, 36.54], [37.14, 37.98], [38.33, 41.66], [42.01, 43.88], [44.23, 45.53], [46.13, 46.89], [47.24, 48.46], [48.81, 49.6], [50.2, 50.83], [51.18, 54.73], [55.08, 57.36], [57.96, 58.51], [58.86, 61.07], [61.42, 64.09], [64.69, 65.38], [65.73, 67.61], [67.96, 69.14], [69.74, 71.72], [72.32, 72.91], [73.26, 74.16], [74.51, 79.06], [79.41, 80.98], [81.58, 82.16], [82.51, 83.96], [84.56, 85.08], [85.43, 88.2], [88.55, 90.9], [91.25, 92.7], [93.3, 94.38], [94.98, 96.66]], "R": [["You won't finish your report on time.", "Karen", "How's the report going?", "I wanted to give you a heads-up. I'm still waiting for Paul's data. Would Monday work instead?"], ["Your manager agrees to a new deadline.", "Karen", "Monday end of day is fine, but not later.", "Understood. Monday, end of day. In the meantime, I'll finish the other sections."]]}, {"num": 60, "title": "When a Colleague Overpromises", "lines": [["S", "Greg, have you got a few minutes? Somewhere private?", "Larissa"], ["P", "Sure. Let's grab the small meeting room. What's up?", "Greg"], ["S", "It's about the call with Susan yesterday. You told her we could add the Halifax office to the training in June.", "Larissa"], ["P", "Right. She was really happy about that.", "Greg"], ["S", "I'm sure she was. But I didn't know about it. And honestly, I don't think we can do it. The June schedule is already full.", "Larissa"], ["P", "Oh. I thought it would just be a couple more sessions.", "Greg"], ["S", "It's six more sessions, plus travel. And two of our trainers are on vacation in June. I'm not trying to be difficult. I just want to be honest with you.", "Larissa"], ["P", "No, I appreciate that. I guess I got a bit excited on the call. Susan was talking about expanding the contract, and I wanted to say yes.", "Greg"], ["S", "I understand. That's your job. But next time, could you check with me before you promise dates? Even a quick message during the call would help.", "Larissa"], ["P", "That's fair. I should have done that. So, what do we do now?", "Greg"], ["S", "I think we tell Susan the truth, but with a solution. We could do Halifax in September, or we could do two online sessions in June and the rest later.", "Larissa"], ["P", "I like the online option. It still gives her something in June.", "Greg"], ["S", "Exactly. Could you call her, since you made the promise? I'm happy to join the call.", "Larissa"], ["P", "Yeah. That's on me. I'll set it up for tomorrow.", "Greg"], ["S", "Thanks, Greg. And thanks for listening.", "Larissa"], ["P", "Hey, you were very diplomatic. I've had people yell at me for less.", "Greg"]], "words": 265, "kind": "story", "scene": "May, a small meeting room.", "F": "Notice how Larissa raises the problem: privately, with facts, then a request (\"could you check with me before…\") and a solution. \"That's on me\" means \"that's my responsibility.\"", "V": "", "t": [[0.3, 2.05], [2.4, 3.34], [3.94, 4.55], [4.9, 6.77], [7.12, 7.91], [8.51, 10.58], [10.93, 14.89], [15.49, 16.13], [16.48, 18.28], [18.88, 19.88], [20.23, 21.43], [21.78, 23.96], [24.31, 26.26], [26.86, 27.39], [27.74, 30.35], [30.95, 33.02], [33.37, 36.33], [36.68, 38.13], [38.48, 40.09], [40.69, 42.23], [42.58, 45.1], [45.45, 50.12], [50.72, 51.63], [51.98, 52.9], [53.25, 56.52], [56.87, 59.26], [59.86, 60.71], [61.06, 62.24], [62.59, 63.97], [64.57, 67.53], [67.88, 73.77], [74.37, 76.06], [76.41, 78.46], [79.06, 79.77], [80.12, 82.41], [82.76, 84.17], [84.77, 85.38], [85.73, 86.71], [87.06, 88.65], [89.25, 90.14], [90.49, 91.63], [92.23, 94.13], [94.48, 96.48]], "R": [["A colleague promised a client something you can't deliver.", "Greg", "Susan was so happy about the Halifax sessions!", "I'm sure she was. But I don't think we can do them in June. Next time, could you check with me before you promise dates?"], ["Your colleague asks what to do now.", "Greg", "So, what do we do now?", "Let's tell Susan the truth, with a solution. We could do two online sessions in June and the rest in September."]]}, {"num": 61, "title": "When Someone Takes Credit", "lines": [["P", "Larissa, were you in the director meeting this morning?", "Megan"], ["S", "No, I wasn't invited. Why?", "Larissa"], ["P", "Greg presented the online training idea. Your idea. And he didn't mention your name once.", "Megan"], ["S", "What? The idea from the team meeting? The one everyone said was \"interesting\"?", "Larissa"], ["P", "That's the one. And the directors loved it. They want to start a pilot this summer.", "Megan"], ["S", "I can't believe it. So now it's Greg's idea?", "Larissa"], ["P", "To be fair, I don't think he did it on purpose. Greg gets excited and forgets details. But you need to say something.", "Megan"], ["S", "I don't want to start a fight. We just fixed the Halifax problem.", "Larissa"], ["P", "You don't have to fight. Just make sure people know. Talk to Greg first, and then mention it to Karen.", "Megan"], ["S", "What do I say to Greg?", "Larissa"], ["P", "Keep it light. Something like, \"I heard the directors liked the online training idea I suggested. I'd love to be involved in the pilot.\"", "Megan"], ["S", "That's clever. It's not an accusation. But he'll understand.", "Larissa"], ["P", "Exactly. You're not saying \"you stole my idea.\" You're saying \"that was my idea, and I want to work on it.\"", "Megan"], ["S", "Okay. Greg's coming. Wish me luck.", "Larissa"], ["P", "Hey, Larissa! Guess what? The directors want to do an online training pilot!", "Greg"], ["S", "I heard! I'm so glad they liked the idea I suggested in April. I'd love to lead the pilot.", "Larissa"], ["P", "Oh. Right. Your idea. Of course! I should have mentioned that. I'll tell Karen you're the person to lead it.", "Greg"], ["S", "Thanks, Greg. I appreciate it.", "Larissa"], ["P", "Perfectly done.", "Megan"]], "words": 248, "kind": "story", "scene": "June, the team area.", "F": "To \"take credit\" means to accept praise for something. \"Keep it light\" means keep the tone friendly and relaxed. Larissa's phrase \"the idea I suggested\" claims credit without accusing anyone.", "V": "", "t": [[0.3, 3.04], [3.64, 5.19], [5.54, 6.01], [6.61, 8.83], [9.18, 9.99], [10.34, 12.13], [12.73, 13.21], [13.56, 15.04], [15.39, 17.29], [17.89, 18.76], [19.11, 20.52], [20.87, 22.63], [23.23, 24.26], [24.61, 25.94], [26.54, 29.0], [29.35, 31.73], [32.08, 33.51], [34.11, 35.44], [35.79, 37.71], [38.31, 39.53], [39.88, 41.41], [41.76, 44.42], [45.02, 46.16], [46.76, 47.68], [48.03, 53.04], [53.39, 55.42], [56.02, 56.81], [57.16, 58.46], [58.81, 59.87], [60.47, 61.3], [61.65, 63.6], [63.95, 67.1], [67.7, 68.28], [68.63, 69.45], [69.8, 70.6], [71.2, 72.26], [72.61, 73.48], [73.83, 76.9], [77.5, 78.1], [78.45, 82.11], [82.46, 83.89], [84.49, 85.02], [85.37, 86.02], [86.37, 87.3], [87.65, 88.53], [88.88, 90.16], [90.51, 92.88], [93.48, 94.37], [94.72, 95.76], [96.36, 97.37]], "R": [["A colleague presented your idea without mentioning you.", "Greg", "Guess what? The directors want to do an online training pilot!", "I heard! I'm so glad they liked the idea I suggested in April. I'd love to lead the pilot."], ["Your colleague apologizes.", "Greg", "Oh, right. Your idea! I should have mentioned that.", "No problem. Thanks, Greg. I appreciate it."]]}, {"num": 62, "title": "The System Is Down", "lines": [["S", "Kevin, the training starts in fifteen minutes, and I can't log in to the new system. Neither can anyone else.", "Larissa"], ["P", "Yeah, I know. The whole system is down. It's not just you. It's affecting the whole company.", "Kevin"], ["S", "Oh no. Do you know how long it'll take to fix?", "Larissa"], ["P", "Honestly, I'm not sure. The vendor says they're working on it. It could be twenty minutes, or it could be two hours.", "Kevin"], ["S", "I have twenty people from the Surrey site waiting in the training room. Some of them drove forty minutes to get here.", "Larissa"], ["P", "I'm really sorry. Do you have a plan B?", "Kevin"], ["S", "I don't know. Let me think. The first part of the session is just an introduction. I can do that without the system. It's only slides.", "Larissa"], ["P", "That's a good start. That gives you about thirty minutes.", "Kevin"], ["S", "And then maybe a coffee break. And if it's still down after that?", "Larissa"], ["P", "I have some screenshots of the system from the test environment. You could walk them through the main screens with those. It's not perfect, but it's something.", "Kevin"], ["S", "That's actually a really good idea. Could you send them to me right now?", "Larissa"], ["P", "Sending them now. And I'll message you the minute the system is back up.", "Kevin"], ["S", "Thank you, Kevin. You're a lifesaver.", "Larissa"], ["P", "Don't thank me yet. Thank me when it's working.", "Kevin"], ["S", "Okay. Wish me luck. I'm going to go tell twenty people there's a small problem.", "Larissa"], ["P", "Say \"a bit of a problem.\" Very Canadian.", "Kevin"], ["S", "Ha. They'll know exactly what that means.", "Larissa"]], "words": 250, "kind": "story", "scene": "June, outside the training room.", "F": "\"The system is down\" means it isn't working. A \"plan B\" is a backup plan. \"You're a lifesaver\" is a strong thank-you. \"The minute it's back up\" means as soon as it works again.", "V": "", "t": [[0.3, 5.29], [5.64, 6.85], [7.45, 8.27], [8.62, 9.95], [10.3, 11.37], [11.72, 13.29], [13.89, 14.47], [14.82, 16.63], [17.23, 18.42], [18.77, 20.41], [20.76, 23.32], [23.92, 27.75], [28.1, 30.42], [31.02, 31.99], [32.34, 33.53], [34.13, 34.83], [35.18, 35.92], [36.27, 39.22], [39.57, 41.18], [41.53, 42.59], [43.19, 44.25], [44.6, 46.24], [46.84, 48.24], [48.59, 50.09], [50.69, 54.24], [54.59, 57.13], [57.48, 59.15], [59.75, 61.56], [61.91, 63.52], [64.12, 65.06], [65.41, 68.08], [68.68, 69.6], [69.95, 70.9], [71.5, 72.48], [72.83, 74.06], [74.66, 75.23], [75.58, 76.38], [76.73, 80.16], [80.76, 82.1], [82.45, 83.45], [84.05, 84.5], [84.85, 86.62]], "R": [["The system goes down just before your training.", "Kevin", "The whole system is down. Do you have a plan B?", "Yes. I'll start with the introduction slides, then take a coffee break. Could you send me some screenshots, just in case?"], ["You tell the group about the problem.", "Participant", "Is everything okay?", "There's a bit of a problem with the system, but don't worry. We'll start with the introduction."]]}, {"num": 63, "title": "Calling In Sick", "lines": [["P", "Hi, Larissa. You don't sound great. Is everything okay?", "Karen"], ["S", "Hi, Karen. Sorry to call so early. I'm feeling really under the weather. I think I have the flu. I was up all night with a fever.", "Larissa"], ["P", "Oh no. I'm sorry to hear that. Please, take the day off and rest.", "Karen"], ["S", "Thank you. I have two meetings today, though. The call with Paul at eleven, and the team meeting at two.", "Larissa"], ["P", "Don't worry about the team meeting. I'll let everyone know. What about Paul? Is it urgent?", "Karen"], ["S", "Not really. It's just a weekly check-in. I can send him a quick message and move it to next week.", "Larissa"], ["P", "Perfect. Just do that and then turn off your laptop.", "Karen"], ["S", "There's one more thing. The Toronto report was due to Susan today. It's almost finished. It's in the shared folder.", "Larissa"], ["P", "Okay. Is it ready to send?", "Karen"], ["S", "Almost. It just needs a final check. Rodrigo knows the numbers. Maybe he could look at it?", "Larissa"], ["P", "Good idea. I'll ask him, and I'll send it to Susan myself. I'll tell her you're sick.", "Karen"], ["S", "Thank you so much, Karen. I feel bad leaving everything.", "Larissa"], ["P", "Larissa, you're sick. That's what the team is for. If you come in with the flu, the whole office gets sick, and then nobody's working.", "Karen"], ["S", "That's true. Okay. I'll send the message to Paul and go back to bed.", "Larissa"], ["P", "Good. And don't check your email. I mean it.", "Karen"], ["S", "I promise. Thanks, Karen.", "Larissa"], ["P", "Feel better soon.", "Karen"]], "words": 241, "kind": "story", "scene": "June, 7:30 a.m., a phone call.", "F": "\"Under the weather\" means a little sick. \"I'm sorry to hear that\" shows sympathy. \"Feel better soon\" is the usual thing to say to someone who is sick.", "V": "", "t": [[0.3, 1.22], [1.57, 2.69], [3.04, 4.24], [4.84, 5.64], [5.99, 7.33], [7.68, 9.32], [9.67, 10.85], [11.2, 12.62], [13.22, 13.84], [14.19, 15.47], [15.82, 17.66], [18.26, 18.91], [19.26, 20.75], [21.1, 24.38], [24.98, 26.63], [26.98, 28.17], [28.52, 29.43], [29.78, 30.68], [31.28, 32.02], [32.37, 33.77], [34.12, 37.25], [37.85, 38.55], [38.9, 41.22], [41.82, 42.82], [43.17, 46.17], [46.52, 47.61], [47.96, 49.12], [49.72, 50.35], [50.7, 51.81], [52.41, 53.05], [53.4, 54.83], [55.18, 56.65], [57.0, 58.17], [58.77, 59.55], [59.9, 62.65], [63.0, 64.13], [64.73, 65.94], [66.29, 67.9], [68.5, 69.73], [70.08, 71.46], [71.81, 76.31], [76.91, 77.63], [77.98, 78.56], [78.91, 81.83], [82.43, 82.95], [83.3, 84.6], [84.95, 85.66], [86.26, 87.05], [87.4, 88.25], [88.85, 89.98]], "R": [["You're sick and need to call your manager.", "Karen", "Hi, Larissa. Is everything okay?", "Hi, Karen. I'm feeling really under the weather. I think I have the flu, so I'll need to take the day off."], ["A colleague is sick.", "Rodrigo", "I'm not coming in today. I have a fever.", "Oh no, I'm sorry to hear that. Feel better soon!"]]}, {"num": 64, "title": "Working Too Late", "lines": [["P", "Larissa? What are you still doing here? It's almost eight o'clock.", "Rodrigo"], ["S", "Oh, hi, Rodrigo. I'm just finishing the pilot plan. I want it to be perfect for Karen tomorrow.", "Larissa"], ["P", "You said the same thing last night. And the night before. Are you okay?", "Rodrigo"], ["S", "I'm fine. Just tired. There's a lot happening right now. The pilot, the Halifax sessions, the Toronto report. And I was sick last week, so I'm behind.", "Larissa"], ["P", "That's a lot for one person. Have you talked to Karen about it?", "Rodrigo"], ["S", "Not really. I don't want her to think I can't handle it. She just gave me the pilot.", "Larissa"], ["P", "I understand. I felt the same in my first year. I said yes to everything, and I worked every night. After six months, I was completely burnt out.", "Rodrigo"], ["S", "Really? What happened?", "Larissa"], ["P", "I got sick for two weeks. And Karen told me something I never forgot. She said, \"I'd rather you tell me you're overloaded than disappear for two weeks.\"", "Rodrigo"], ["S", "That sounds like Karen.", "Larissa"], ["P", "It is. And remember the Employee Assistance Program Priya told you about on your first day? It's free. You can talk to someone about stress. Nobody at work will know.", "Rodrigo"], ["S", "I'd forgotten about that.", "Larissa"], ["P", "Also, delegation. Wasn't that in your review? You don't have to do everything yourself.", "Rodrigo"], ["S", "You're right. It was. I'm doing exactly what Karen told me not to do.", "Larissa"], ["P", "So, tomorrow, talk to her. Tell her what's on your plate, and ask what can wait.", "Rodrigo"], ["S", "Okay. I will. And now?", "Larissa"], ["P", "Now, you save your file, shut down your laptop, and go home. The plan will still be there tomorrow.", "Rodrigo"]], "words": 266, "kind": "story", "scene": "June, 7:50 p.m., the empty office.", "F": "\"Burnt out\" means exhausted from too much work. \"Overloaded\" means having too much to do. \"What can wait\" means which tasks are less urgent.", "V": "", "t": [[0.3, 1.04], [1.39, 2.71], [3.06, 4.31], [4.91, 6.24], [6.59, 8.33], [8.68, 10.93], [11.53, 13.22], [13.57, 14.64], [14.99, 15.83], [16.43, 17.13], [17.48, 18.35], [18.7, 20.26], [20.61, 23.93], [24.28, 26.63], [27.23, 28.69], [29.04, 30.57], [31.17, 31.91], [32.26, 34.21], [34.56, 35.97], [36.57, 37.48], [37.83, 39.58], [39.93, 42.71], [43.06, 45.61], [46.21, 46.76], [47.11, 47.85], [48.45, 49.83], [50.18, 52.49], [52.84, 57.3], [57.9, 59.09], [59.69, 60.34], [60.69, 65.69], [66.04, 66.81], [67.16, 68.88], [69.23, 70.51], [71.11, 72.36], [72.96, 74.16], [74.51, 75.82], [76.17, 78.14], [78.74, 79.41], [79.76, 80.38], [80.73, 83.48], [84.08, 85.56], [85.91, 88.49], [89.09, 89.66], [90.01, 90.58], [90.93, 91.53], [92.13, 95.49], [95.84, 97.62]], "R": [["A colleague sees you working very late.", "Rodrigo", "What are you still doing here? It's almost eight.", "I'm just finishing the pilot plan. You're right, though. I should go home."], ["You talk to your manager about your workload.", "Karen", "You wanted to talk about something?", "Yes. I'm feeling a bit overloaded. Can we look at what's on my plate and decide what can wait?"]]}, {"num": 65, "title": "Budget Cuts", "lines": [["P", "Okay, everyone, thanks for joining. I'll be honest, this isn't the most fun meeting. We've had some news about the budget.", "Karen"], ["P", "Uh-oh. That doesn't sound good.", "Greg"], ["P", "It's not great, but it's not terrible either. Because of the company's results this quarter, every department has to cut its budget by fifteen percent for the rest of the year.", "Karen"], ["P", "Fifteen percent? That's a lot. What does that mean for us?", "Megan"], ["P", "It means we have to make some choices. We don't have to cut any jobs, which is the most important thing. But we'll need to delay some projects.", "Karen"], ["S", "Does that include the online training pilot?", "Larissa"], ["P", "Not necessarily. Actually, the directors like the pilot because it could save money in the long term. So, if we can do it cheaply, it might survive.", "Karen"], ["S", "I think we could. If we use our own team for the filming instead of an outside company, we could cut the cost by almost half.", "Larissa"], ["P", "My team could do the filming. We'd need to buy a couple of microphones, but that's it.", "Megan"], ["P", "That's the kind of thinking we need. Greg, what about client events?", "Karen"], ["P", "I was planning a big client dinner in the fall. I guess I could make it smaller. Or do a lunch instead of a dinner.", "Greg"], ["P", "Let's look at that. Okay, here's what I'd like. By Friday, everyone send me a list of what you could cut or delay, and what it would save.", "Karen"], ["P", "By Friday. Got it.", "Megan"], ["P", "And thanks, everyone. I know this isn't easy. We'll get through it. We just have to tighten our belts for a few months.", "Karen"], ["P", "Lunch it is.", "Greg"]], "words": 268, "kind": "story", "scene": "June, a team meeting.", "F": "\"In the long term\" means over a long period. \"Tighten our belts\" means spend less money. Listen for \"fifteen percent\" and how each person offers something to cut.", "V": "", "t": [[0.3, 2.48], [2.83, 5.24], [5.59, 7.46], [8.06, 8.72], [9.07, 10.41], [11.01, 13.34], [13.69, 20.95], [21.55, 22.72], [23.07, 24.03], [24.38, 25.64], [26.24, 28.17], [28.52, 32.04], [32.39, 34.28], [34.88, 37.21], [37.81, 38.94], [39.29, 43.95], [44.3, 47.03], [47.63, 48.47], [48.82, 55.41], [56.01, 57.5], [57.85, 60.78], [61.38, 62.94], [63.29, 65.02], [65.62, 68.34], [68.69, 70.54], [70.89, 72.92], [73.52, 74.58], [74.93, 76.45], [76.8, 81.91], [82.51, 83.39], [83.74, 84.47], [85.07, 86.28], [86.63, 87.95], [88.3, 89.21], [89.56, 91.95], [92.55, 93.58]], "R": [["Your manager announces budget cuts.", "Karen", "We have to cut fifteen percent. Any ideas?", "If Megan's team does the filming instead of an outside company, we could cut the pilot cost by almost half."], ["Your manager asks for a list.", "Karen", "By Friday, send me what you could cut or delay.", "Okay. I'll send you a list by Friday, with how much each change would save."]]}, {"num": 66, "title": "Escalating a Problem", "lines": [["S", "Karen, I need some advice. I think I need to escalate something, but I'm not sure how.", "Larissa"], ["P", "Okay. What's the situation?", "Karen"], ["S", "For the Halifax online sessions, I need Siobhan to confirm the list of participants. I first asked her three weeks ago. I've followed up twice by email, and once by phone. No answer.", "Larissa"], ["P", "And when do you need it?", "Karen"], ["S", "By next Wednesday. Otherwise, we can't send the invitations, and the sessions won't happen in June.", "Larissa"], ["P", "Right. That's a real risk. So yes, it's time to escalate. The question is how.", "Karen"], ["S", "I don't want Siobhan to get in trouble. Maybe she's just very busy.", "Larissa"], ["P", "That's a good attitude. So, when you contact Susan, don't make it about Siobhan. Make it about the project.", "Karen"], ["S", "What do you mean?", "Larissa"], ["P", "Instead of \"Siobhan isn't answering,\" say something like, \"We need the participant list by Wednesday to keep the June dates. Could you help us get this from the right person?\"", "Karen"], ["S", "Oh, that's much better. It doesn't blame anyone.", "Larissa"], ["P", "Exactly. And copy Siobhan on the email. That way, it's transparent. You're not going behind her back.", "Karen"], ["S", "Should I mention that I've already asked three times?", "Larissa"], ["P", "Briefly. Just one line. \"We've reached out a few times, but I know everyone's busy.\" That's enough.", "Karen"], ["S", "Okay. That sounds professional.", "Larissa"], ["P", "And if Susan doesn't answer by Monday, let me know. I'll call her myself.", "Karen"], ["S", "Thank you, Karen. I was worried escalating would look like complaining.", "Larissa"], ["P", "Not when you do it like this. Escalating is part of your job. The real mistake is waiting too long.", "Karen"]], "words": 257, "kind": "story", "scene": "June, Karen's office.", "F": "To \"escalate\" means to take a problem to someone with more authority. \"Going behind her back\" means acting secretly without telling her. Notice how Karen focuses on the project, not the person.", "V": "", "t": [[0.3, 2.06], [2.41, 5.7], [6.3, 6.93], [7.28, 8.58], [9.18, 14.23], [14.58, 16.36], [16.71, 19.83], [20.18, 20.99], [21.59, 22.66], [23.26, 24.31], [24.66, 29.67], [30.27, 30.84], [31.19, 32.34], [32.69, 34.6], [34.95, 36.16], [36.76, 38.51], [38.86, 40.37], [40.97, 42.22], [42.57, 45.73], [46.08, 47.6], [48.2, 48.96], [49.56, 56.5], [56.85, 58.97], [59.57, 60.89], [61.24, 62.44], [63.04, 63.84], [64.19, 65.87], [66.22, 67.74], [68.09, 69.71], [70.31, 72.76], [73.36, 74.06], [74.41, 75.46], [75.81, 78.91], [79.26, 80.01], [80.61, 81.19], [81.54, 82.78], [83.38, 86.2], [86.55, 87.73], [88.33, 89.27], [89.62, 92.43], [93.03, 94.43], [94.78, 96.68], [97.03, 99.06]], "R": [["Someone hasn't answered you for three weeks.", "Karen", "So, what's the situation?", "I need Siobhan to confirm the participant list by Wednesday, but she hasn't answered. I think I need to escalate."], ["You write to the client to escalate without blaming anyone.", "Susan", "What do you need from me?", "We need the participant list by Wednesday to keep the June dates. Could you help us get it from the right person?"]]}]}, {"part": 8, "title": "Workplace Life", "desc": "Celebrations, goodbyes, a new colleague, and a promotion.", "scripts": [{"num": 67, "title": "The Company Barbecue", "lines": [["P", "Larissa, you made it! Welcome to the company barbecue.", "Megan"], ["S", "Thanks, Megan! This park is beautiful. I can't believe we're working today.", "Larissa"], ["P", "Technically, we're not working. This is team building. Grab a plate. There's lots of food.", "Megan"], ["S", "I brought something too. It's pão de queijo. Brazilian cheese bread. My mother taught me the recipe when she visited.", "Larissa"], ["P", "Did someone say cheese bread? Oh, wow. These are amazing. Can I take three?", "Greg"], ["S", "Of course! Take as many as you want.", "Larissa"], ["P", "Careful, I'll take that literally. So, Larissa, is this your first company barbecue?", "Greg"], ["S", "Yes. In Brazil, we have lots of work parties, but they're usually in the evening, with music and dancing.", "Larissa"], ["P", "That sounds way more fun than this. Here, we play frisbee and talk about the weather.", "Megan"], ["P", "Hey! We also talk about hockey.", "Greg"], ["P", "And we complain about the parking. Don't forget the parking.", "Rodrigo"], ["S", "Rodrigo! I didn't see you. Is your wife here?", "Larissa"], ["P", "She's over there, by the lake. Come and say hi later. She wants to meet the famous Larissa.", "Rodrigo"], ["S", "Famous? Why?", "Larissa"], ["P", "Because I talk about you all the time. You're my success story.", "Rodrigo"], ["P", "Okay, before you two start speaking Portuguese, who wants to play frisbee?", "Megan"], ["P", "Not me. I'm guarding the cheese bread.", "Greg"], ["S", "I'll play! But I'm warning you, I've never done it before.", "Larissa"], ["P", "Perfect. Neither has Greg, and he's played every year for ten years.", "Megan"], ["P", "I heard that.", "Greg"]], "words": 228, "kind": "story", "scene": "July, Stanley Park.", "F": "\"Team building\" means activities that help colleagues get to know each other. \"I'll take that literally\" is a joke meaning \"I really will take a lot.\" \"Way more fun\" means much more fun.", "V": "", "t": [[0.3, 1.7], [2.05, 3.85], [4.45, 5.34], [5.69, 6.88], [7.23, 8.95], [9.55, 11.12], [11.47, 12.66], [13.01, 13.92], [14.27, 15.47], [16.07, 17.23], [17.58, 18.7], [19.05, 20.39], [20.74, 23.2], [23.8, 25.5], [25.85, 26.67], [27.02, 28.25], [28.6, 29.84], [30.44, 31.16], [31.51, 32.8], [33.4, 35.25], [35.6, 39.03], [39.63, 40.19], [40.54, 46.71], [47.31, 49.04], [49.39, 51.94], [52.54, 53.14], [53.49, 55.26], [55.86, 57.47], [57.82, 59.07], [59.67, 60.38], [60.73, 61.65], [62.0, 62.86], [63.46, 64.86], [65.21, 66.5], [66.85, 68.66], [69.26, 69.9], [70.25, 70.72], [71.32, 73.18], [73.53, 74.82], [75.42, 79.72], [80.32, 81.17], [81.52, 83.2], [83.8, 84.47], [84.82, 87.34], [87.94, 88.69], [89.04, 92.21], [92.81, 93.82]], "R": [["You're at the company barbecue. A colleague tries your food.", "Greg", "These are amazing! What are they?", "They're pão de queijo, Brazilian cheese bread. Take as many as you want!"], ["A colleague asks about work parties in Brazil.", "Megan", "What are work parties like in Brazil?", "They're usually in the evening, with music and dancing. But I like this too!"]]}, {"num": 68, "title": "A Birthday Card", "lines": [["P", "Larissa, have you got a second? We're organizing something for Kevin. It's his birthday on Friday.", "Megan"], ["S", "Oh, nice! What are you planning?", "Larissa"], ["P", "Nothing big. There's a card going around, and we're collecting money for a gift. People usually chip in about ten dollars. But it's totally optional.", "Megan"], ["S", "Of course, I'll chip in. What are you getting him?", "Larissa"], ["P", "A gift card for that ramen place he always talks about. And we're getting a cake for the kitchen at three o'clock.", "Megan"], ["S", "That's so nice. In Brazil, the birthday person often brings the cake.", "Larissa"], ["P", "Really? Here, it's the opposite. The team does it. Don't let Greg bring a cake for his own birthday. He'll try.", "Megan"], ["S", "Ha, okay. Where's the card?", "Larissa"], ["P", "Here. Just write something short and friendly. And don't write anything about his age. He's a bit sensitive about turning forty.", "Megan"], ["S", "Okay. What should I write? \"Happy birthday, Kevin! Thank you for fixing my second monitor three times.\"", "Larissa"], ["P", "That's perfect. He'll love that.", "Megan"], ["P", "Hey, what are you two whispering about?", "Kevin"], ["P", "Nothing! Nothing at all. Larissa was just asking about... the printer.", "Megan"], ["P", "The printer's fine. I fixed it this morning. Are you sure that's all?", "Kevin"], ["S", "Yes. Totally sure. Thanks, Kevin!", "Larissa"], ["P", "Okay. You're both acting very strange.", "Kevin"], ["P", "Well, that was close.", "Megan"], ["S", "I'm a terrible liar. He definitely knows.", "Larissa"], ["P", "He always knows. He pretends to be surprised every year. It's a tradition.", "Megan"]], "words": 226, "kind": "story", "scene": "July, the team area.", "F": "To \"chip in\" means to give a little money toward a shared gift. \"A card going around\" means it's being passed from person to person to sign. \"That was close\" means we almost got caught.", "V": "", "t": [[0.3, 2.08], [2.43, 4.34], [4.69, 6.31], [6.91, 7.71], [8.06, 8.99], [9.59, 10.49], [10.84, 14.43], [14.78, 17.09], [17.44, 18.78], [19.38, 20.73], [21.08, 22.15], [22.75, 25.95], [26.3, 28.81], [29.41, 30.29], [30.64, 33.97], [34.57, 35.23], [35.58, 36.95], [37.3, 38.32], [38.67, 40.96], [41.31, 42.12], [42.72, 43.45], [43.8, 44.63], [45.23, 45.79], [46.14, 48.25], [48.6, 50.61], [50.96, 53.24], [53.84, 54.42], [54.77, 55.7], [56.05, 57.3], [57.65, 60.46], [61.06, 62.04], [62.39, 63.36], [63.96, 65.73], [66.33, 67.02], [67.37, 68.34], [68.69, 70.7], [71.05, 71.86], [72.46, 73.47], [73.82, 75.03], [75.38, 76.46], [77.06, 77.62], [77.97, 78.77], [79.12, 80.0], [80.6, 81.26], [81.61, 83.3], [83.9, 85.11], [85.71, 86.84], [87.19, 88.39], [88.99, 90.12], [90.47, 92.72], [93.07, 94.12]], "R": [["A colleague is collecting money for a birthday gift.", "Megan", "We're collecting for Kevin's gift. People usually chip in about ten dollars.", "Of course, I'll chip in. Where's the card?"], ["The birthday person almost catches you.", "Kevin", "What are you two whispering about?", "Oh, nothing! Just the printer."]]}, {"num": 69, "title": "Big News", "lines": [["P", "Larissa, can we go for a walk? I need to tell you something.", "Rodrigo"], ["S", "Of course. Is everything okay?", "Larissa"], ["P", "Everything's good. Actually, it's great news. But it's a bit sad too. I've accepted a new job. In Calgary.", "Rodrigo"], ["S", "What? Calgary? Rodrigo!", "Larissa"], ["P", "I know. It's a senior data analyst role at an energy company. It's a big step for me. And my wife's family is in Calgary, so we've wanted to move for a while.", "Rodrigo"], ["S", "Wow. Congratulations. I'm really happy for you. But I'm also a little sad. You're the reason I survived my first year.", "Larissa"], ["P", "Come on. You did that yourself. I just translated some Canadian expressions.", "Rodrigo"], ["S", "Many Canadian expressions. When do you leave?", "Larissa"], ["P", "I gave Karen my two weeks' notice this morning. My last day is the fifteenth.", "Rodrigo"], ["S", "Only two weeks? That's so fast.", "Larissa"], ["P", "That's normal here. Two weeks is the standard. It's enough time to finish my projects and do a handover.", "Rodrigo"], ["S", "Who's going to replace you?", "Larissa"], ["P", "They've already started looking. Karen asked if I could help train the new person, if they start before I leave.", "Rodrigo"], ["S", "And if they don't?", "Larissa"], ["P", "Then you'll have to show them where the Room Finder is.", "Rodrigo"], ["S", "Ha! I will. I promise.", "Larissa"], ["P", "And we'll keep in touch. Calgary isn't that far. And there's always video calls.", "Rodrigo"], ["S", "You'd better call me. And no camera on the ceiling.", "Larissa"], ["P", "Deal. And if you ever need a translator, just message me.", "Rodrigo"]], "words": 233, "kind": "story", "scene": "July, a walk outside the office.", "F": "\"Two weeks' notice\" is the usual warning you give before leaving a job in Canada. \"Keep in touch\" means stay in contact. \"You'd better\" means you really should.", "V": "", "t": [[0.3, 1.95], [2.3, 3.64], [4.24, 4.94], [5.29, 6.37], [6.97, 7.98], [8.33, 9.74], [10.09, 11.4], [11.75, 13.14], [13.49, 14.29], [14.89, 15.38], [15.73, 16.32], [16.67, 17.38], [17.98, 18.65], [19.0, 22.44], [22.79, 24.11], [24.46, 28.63], [29.23, 29.71], [30.06, 31.22], [31.57, 32.8], [33.15, 34.48], [34.83, 37.09], [37.69, 38.36], [38.71, 39.85], [40.2, 42.79], [43.39, 44.93], [45.28, 46.14], [46.74, 49.19], [49.54, 51.03], [51.63, 52.61], [52.96, 53.91], [54.51, 55.54], [55.89, 57.2], [57.55, 60.76], [61.36, 62.71], [63.31, 64.67], [65.02, 69.42], [70.02, 70.93], [71.53, 74.17], [74.77, 75.22], [75.57, 76.14], [76.49, 77.27], [77.87, 79.03], [79.38, 80.74], [81.09, 82.55], [83.15, 84.15], [84.5, 85.92], [86.52, 87.11], [87.46, 90.29]], "R": [["A close colleague tells you he's leaving.", "Rodrigo", "I've accepted a new job in Calgary.", "Wow, congratulations! I'm really happy for you. I'm going to miss you, though."], ["You want to stay in contact.", "Rodrigo", "My last day is the fifteenth.", "So soon! We have to keep in touch. You'd better call me."]]}, {"num": 70, "title": "Rodrigo's Last Day", "lines": [["P", "Okay, everyone, can I have your attention for a minute? As you all know, today is Rodrigo's last day.", "Karen"], ["P", "Boo!", "Greg"], ["P", "I know, Greg. We're all sad. Rodrigo, you've been with us for almost four years. You've built most of our reports, you've trained half the office, and you've never once complained about the coffee machine.", "Karen"], ["P", "That's not true. I complain all the time. Just in Portuguese.", "Rodrigo"], ["P", "Fair enough. Seriously, though, we're going to miss you. You've made this team better. And we're so happy for you and your family.", "Karen"], ["P", "We got you something. Here. Open it!", "Megan"], ["P", "Oh, you didn't have to. A Canucks jersey? Guys, I'm moving to Calgary!", "Rodrigo"], ["P", "Exactly. Now you'll be the most hated man in Calgary. You're welcome.", "Greg"], ["P", "Thank you. Really. I'll wear it with pride. Maybe just at home.", "Rodrigo"], ["P", "Larissa, did you want to say something?", "Karen"], ["S", "Yes. Just quickly. Rodrigo, on my first day, you showed me the kitchen rules. Then you taught me how to ask for help, how to read feedback, and how to escape from long phone calls. I don't think I'd be here without you. So, thank you. Obrigada.", "Larissa"], ["P", "De nada. And thank you, everyone. This was my first job in Canada. I arrived not knowing what \"take this offline\" meant. Now I say it in my sleep.", "Rodrigo"], ["P", "We'll miss you, buddy. Keep in touch.", "Greg"], ["P", "I will. And please, somebody, empty the dishwasher.", "Rodrigo"]], "words": 231, "kind": "story", "scene": "August, the team area.", "F": "Farewell phrases: \"We're going to miss you,\" \"Keep in touch,\" and \"You didn't have to\" (said when receiving a gift). Calgary's hockey team is a rival of Vancouver's, which is why the jersey is a joke.", "V": "", "t": [[0.3, 3.45], [3.8, 6.53], [7.13, 7.74], [8.34, 9.27], [9.62, 10.52], [10.87, 13.8], [14.15, 20.47], [21.07, 22.06], [22.41, 23.71], [24.06, 25.25], [25.85, 26.59], [26.94, 29.02], [29.37, 30.75], [31.1, 33.16], [33.76, 34.97], [35.32, 35.89], [36.24, 37.0], [37.6, 38.84], [39.19, 40.32], [40.67, 42.18], [42.78, 43.68], [44.03, 46.72], [47.07, 48.0], [48.6, 49.33], [49.68, 50.29], [50.64, 51.75], [52.1, 53.24], [53.84, 55.92], [56.52, 57.08], [57.43, 58.29], [58.64, 62.12], [62.47, 68.32], [68.67, 70.45], [70.8, 71.71], [72.06, 72.79], [73.39, 74.1], [74.45, 75.62], [75.97, 77.73], [78.08, 80.75], [81.1, 82.54], [83.14, 84.35], [84.7, 85.69], [86.29, 86.96], [87.31, 89.45]], "R": [["It's a colleague's last day. You say a few words.", "Karen", "Larissa, did you want to say something?", "Yes, just quickly. Rodrigo, thank you for everything you taught me. We're all going to miss you."], ["Someone gives you a gift.", "Megan", "We got you something. Open it!", "Oh, you didn't have to! Thank you so much."]]}, {"num": 71, "title": "The New Person", "lines": [["S", "Hi, you must be Daniel. I'm Larissa. Welcome to the team!", "Larissa"], ["P", "Hi, Larissa. Nice to meet you. Karen said you would show me around this morning.", "Daniel"], ["S", "That's right. How are you feeling? First days are always a bit overwhelming.", "Larissa"], ["P", "Honestly, a bit nervous. This is my first job in Canada. I arrived from Mexico City four months ago.", "Daniel"], ["S", "Oh, really? I was exactly the same last year. I'm from Brazil. So, I understand.", "Larissa"], ["P", "That's a relief. Everyone seems so polite here. I'm scared I'll say something wrong.", "Daniel"], ["S", "You'll be fine. Okay, let's start with the most important room. The kitchen.", "Larissa"], ["P", "The kitchen? More important than the meeting rooms?", "Daniel"], ["S", "Definitely. This is where people actually talk. Okay, a few unwritten rules. If you take the last coffee, you make a new pot. And every Friday afternoon, anything left in the fridge goes in the garbage.", "Larissa"], ["P", "Every Friday? Even if it's still good?", "Daniel"], ["S", "Even if it's still good. Trust me on that one.", "Larissa"], ["P", "Okay. Noted. Is there anything else I should know?", "Daniel"], ["S", "Actually, yes. I made something for you. It's a list of all our main systems, and who to ask about each one. I started it in my first month.", "Larissa"], ["P", "Wow, that's really helpful. Thank you.", "Daniel"], ["S", "And one more thing. If you have a question, just ask. Don't spend two days stuck. People here really don't mind questions.", "Larissa"],
